name: release readiness

on:
  schedule:
    - cron: "41 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-check:
    name: current version is ready to tag
    # Readiness answers "would the gate pass if we tagged now", so it has to run
    # the gate's ffmpeg rather than the week's. See .github/actions/ffmpeg.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Install browser prerequisites
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify release readiness
        run: make release-check
