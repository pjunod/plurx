name: validation nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed_pgs_crash:
        description: Prove the fuzz failure gate with a disposable harness panic
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deep-validation:
    name: playback, recovery, bounds, clients, UI, and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install media and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run every scheduled validation
        run: make validate-nightly
      - name: Upload deep-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-deep-validation-evidence
          path: |
            target/validation
            target/playback-lab
            target/ui-baseline
          if-no-files-found: warn
          retention-days: 14

  pgs-fuzz:
    name: bounded PGS parser fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the PGS fuzz runner
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          cargo install cargo-fuzz --locked
        timeout-minutes: 20
      - name: Prove the fuzz seed is opt-in
        run: cargo +nightly-2026-08-01 test --manifest-path fuzz/Cargo.toml --lib
      - name: Fuzz the bounded PGS parser
        id: pgs_fuzz
        continue-on-error: true
        timeout-minutes: 20
        env:
          PLURX_FUZZ_SEEDED_CRASH: ${{ inputs.seed_pgs_crash && '1' || '' }}
        run: |
          mkdir -p target/validation
          set -o pipefail
          cargo +nightly-2026-08-01 fuzz run inspect_sup fuzz/corpus/inspect_sup \
            -- -max_total_time=900 2>&1 | tee target/validation/pgs-fuzz.log
      - name: Upload PGS fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pgs-fuzz-evidence
          path: |
            target/validation/pgs-fuzz.log
            fuzz/artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when the PGS fuzzer finds a crash
        if: always() && steps.pgs_fuzz.outcome == 'failure'
        run: |
          echo "The bounded PGS fuzz campaign found a reproducible failure." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1

  mutation:
    name: report-only weekly mutation spot-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-mutation
      - name: Install media prerequisite
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the mutation spot-checker
        run: cargo install cargo-mutants --locked
        timeout-minutes: 20
      - name: Mutation spot-check the last seven days
        id: mutants
        continue-on-error: true
        timeout-minutes: 60
        run: |
          mkdir -p target/mutants
          mapfile -t changed < <(
            git log --since=7.days --name-only --format= \
              | grep -E '^crates/.*\.rs$' \
              | sort -u
          )
          if (( ${#changed[@]} == 0 )); then
            echo "## Mutation spot-check: no Rust files changed in seven days" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          file_args=()
          for path in "${changed[@]}"; do
            file_args+=(--file "$path")
          done
          set +e
          cargo mutants --timeout 300 --output target/mutants "${file_args[@]}"
          status=$?
          set -e
          echo "## Mutation spot-check (report-only)" >> "$GITHUB_STEP_SUMMARY"
          echo "cargo-mutants exit status: $status" >> "$GITHUB_STEP_SUMMARY"
          if grep -RqsE 'MISSED|TIMEOUT' target/mutants; then
            echo "Surviving or timed-out mutants were reported; inspect the artifact." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No surviving mutant marker was found in the report." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-mutation-evidence
          path: target/mutants
          if-no-files-found: warn
          retention-days: 14
