name: Rust dependency audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-audit.yml"

permissions:
  contents: read
  checks: write

jobs:
  workspace:
    name: RustSec workspace advisory scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v2.0.0, pinned so the security gate cannot move without review.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    name: RustSec fuzz advisory scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v2.0.0, pinned so the security gate cannot move without review.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: fuzz
