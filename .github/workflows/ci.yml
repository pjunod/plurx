name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The merge queue is the enforcement point of the two-tier design: PR runs
  # are scoped to the diff for fast iteration, and every merge_group event
  # fails open into the full cross-surface fan-out before a commit reaches
  # main. Adding a required check that does not run on merge_group would
  # deadlock the queue — pr_gate reports on both events.
  merge_group:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the PR diff once. Expensive jobs consume these outputs in parallel;
  # merge groups, pushes, and tags deliberately enable every surface.
  scope:
    name: validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      apple: ${{ steps.scope.outputs.apple }}
      android_jvm: ${{ steps.scope.outputs.android_jvm }}
      android_device: ${{ steps.scope.outputs.android_device }}
      web_layout: ${{ steps.scope.outputs.web_layout }}
      release_build: ${{ steps.scope.outputs.release_build }}
      container: ${{ steps.scope.outputs.container }}
      mobile_version: ${{ steps.scope.outputs.mobile_version }}
      hiqlite_spike: ${{ steps.scope.outputs.hiqlite_spike }}
      cluster_auth: ${{ steps.scope.outputs.cluster_auth }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected CI surfaces
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m validation.ci_scope \
            --event "$EVENT_NAME" --base "$VALIDATION_BASE" >> "$GITHUB_OUTPUT"

  # A stale counter must fail the aggregate gate without hiding the native test
  # result. Run release hygiene beside preflight and the affected platform jobs
  # rather than making it their prerequisite.
  mobile_version:
    name: mobile release version
    needs: scope
    if: needs.scope.outputs.mobile_version == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check mobile release hygiene
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$VALIDATION_BASE" ] \
            && git cat-file -e "$VALIDATION_BASE^{commit}" 2>/dev/null; then
            PLURX_VALIDATION_MODE=changed-from \
              PLURX_VALIDATION_BASE="$VALIDATION_BASE" \
              python3 -m validation.mobile_versions
          else
            python3 -m validation.mobile_versions
          fi

  # The failure history says policy mistakes are both common and cheap to
  # detect. Run the structural contracts before provisioning Rust, browsers,
  # simulators, emulators, cross compilers, or Docker builds, and make every
  # expensive fan-out job in this workflow depend on this result.
  preflight:
    name: fast policy and contract preflight
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit corrective-history evidence
        run: make history-check
      - name: Check validation catalog and contract unit tests
        run: |
          make validation-lint
          python3 -m unittest discover -s tests/validation -p 'test_*.py'
      - name: Check CI, deploy, and shipping contracts
        run: make operations-check
      - name: Record the documentation-only lane
        if: needs.scope.outputs.docs_only == 'true'
        run: echo "Documentation-only diff; runtime and compiler surfaces are skipped."

  check:
    name: functionality points (CI profile)
    needs: [scope, preflight]
    # Kotlin and Swift diffs compile nothing under crates/, so the cargo lane
    # only runs when the diff can reach it; the merge queue re-runs it always.
    if: needs.scope.outputs.rust == 'true'
    # Pinned, not floating: this job's playback assertions are written against
    # one ffmpeg major, and apt on `ubuntu-latest` supplies whichever one that
    # week's image ships. See .github/actions/ffmpeg.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The validator compares the event base with HEAD. Full history keeps
          # that base available after force-pushes and on long-lived branches.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # plurxd shells out to ffmpeg, and the transcode and stream tests drive
      # that far enough to spawn it — they don't need it to succeed on the
      # placeholder fixtures, they need a child process to exist so there is a
      # session to make assertions about. The runner image doesn't ship ffmpeg,
      # so without this those tests fail on `No such file or directory`, which
      # is an absent dependency rather than anything wrong with the tree.
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      # Keep the portable baseline and focused Linux contracts in this job.
      # Browser and Android JVM checks are selected by the same impact graph,
      # but delegated to parallel jobs below instead of serializing the gate.
      - name: Validate functionality points
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLURX_SKIP_UI_BASELINE: 1
          PLURX_SKIP_ANDROID_JVM: 1
        run: |
          if [ -n "$VALIDATION_BASE" ] \
            && git cat-file -e "$VALIDATION_BASE^{commit}" 2>/dev/null; then
            scripts/validate run --profile ci \
              --changed-from "$VALIDATION_BASE" --strict
          else
            echo "No usable event base; validating every functionality point."
            scripts/validate run --profile ci --all --strict
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: target/validation
          if-no-files-found: warn

  cluster_auth:
    name: replicated storage contracts
    needs: [scope, preflight]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' ||
      needs.scope.outputs.hiqlite_spike == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The M0 proof has its own manifest, but not its own dependency build.
      # Sharing the root target lets it reuse the Hiqlite/OpenRaft graph that
      # cluster-check just compiled instead of paying for ~400 crates twice.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: hiqlite-cluster-auth
      - name: Run separate-process replica and failure contracts
        if: needs.scope.outputs.cluster_auth == 'true'
        run: make cluster-check
      - name: Lint the isolated semantic harness
        if: needs.scope.outputs.hiqlite_spike == 'true'
        run: cargo clippy --locked --manifest-path spikes/hiqlite-m0/Cargo.toml --tests --no-deps -- -D warnings
      - name: Run the three-voter semantic proof
        if: needs.scope.outputs.hiqlite_spike == 'true'
        run: make hiqlite-spike

  web_layout:
    name: web layout and accessibility
    needs: [scope, preflight]
    if: needs.scope.outputs.web_layout == 'true'
    # Pinned for the same reason as `check`: a browser sweep still plays media
    # through ffmpeg. See .github/actions/ffmpeg.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-layout
      # Pinned so the browser-bundle cache key below is meaningful; bump both
      # together. A cache hit skips the ~150 MB Chromium download every run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Install browser prerequisites
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Check every affected web layout
        run: make ui-check

  android_jvm:
    name: Android JVM tests and lint
    needs: [scope, preflight]
    if: needs.scope.outputs.android_jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The toolchain image only changes when its Dockerfile does, yet both
      # Android jobs used to rebuild it from scratch — cmdline-tools plus four
      # sdkmanager downloads — on every run. Keyed on the Dockerfile hash, a
      # pull replaces the rebuild; any failure falls back to the local build.
      - name: Reuse the pinned Android toolchain image from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}/android-build:$(sha256sum clients/android/Dockerfile | cut -c1-16)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull "$tag"; then
            docker tag "$tag" plurx-android-build
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          else
            make android-image \
              && docker tag plurx-android-build "$tag" \
              && docker push "$tag" || true
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          fi
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            clients/android/.gradle-validation/caches
            clients/android/.gradle-validation/wrapper
          key: gradle-${{ hashFiles('clients/android/**/*.gradle*', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Run unit tests and lint in the pinned Android toolchain
        run: |
          mkdir -p target/validation/buildx
          BUILDX_CONFIG=target/validation/buildx make android-test

  apple:
    name: Apple iOS + tvOS tests
    needs: [scope, preflight]
    if: needs.scope.outputs.apple == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Warm Swift incrementals: the Makefile builds into
      # clients/apple/build/DerivedData precisely so this cache can restore it.
      # restore-keys accepts the newest prior entry when sources moved — an
      # incremental rebuild from a near miss still beats a cold compile, and a
      # poisoned cache only ever costs the rebuild we paid before caching.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: clients/apple/build/DerivedData
          key: apple-dd-${{ hashFiles('clients/apple/project.yml') }}-${{ hashFiles('clients/apple/Sources/**', 'clients/apple/Tests/**') }}
          restore-keys: |
            apple-dd-${{ hashFiles('clients/apple/project.yml') }}-
            apple-dd-
      - name: Select the pinned Xcode and install the project generator
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          sudo xcodebuild -runFirstLaunch
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          ios_id=$(xcrun simctl create \
            "plurx CI iPhone" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          ipad_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"]
                     for runtime, entries in devices.items()
                     if runtime.endswith("iOS-18-5")
                     for device in entries
                     if device["name"].startswith("iPad")))
          ')
          tvos_id=$(xcrun simctl create \
            "plurx CI Apple TV" \
            com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K \
            com.apple.CoreSimulator.SimRuntime.tvOS-18-5)
          echo "APPLE_IOS_SIM=platform=iOS Simulator,id=$ios_id" >> "$GITHUB_ENV"
          echo "APPLE_IPAD_SIM=platform=iOS Simulator,id=$ipad_id" >> "$GITHUB_ENV"
          echo "APPLE_TVOS_SIM=platform=tvOS Simulator,id=$tvos_id" >> "$GITHUB_ENV"
      - name: Run the shared XCTest suite on iPhone, iPad, and Apple TV
        run: make apple-test

  android_device:
    name: Android instrumented UI tests
    needs: [scope, preflight]
    if: needs.scope.outputs.android_device == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reuse the pinned Android toolchain image from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}/android-build:$(sha256sum clients/android/Dockerfile | cut -c1-16)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull "$tag"; then
            docker tag "$tag" plurx-android-build
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          else
            make android-image \
              && docker tag plurx-android-build "$tag" \
              && docker push "$tag" || true
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          fi
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            clients/android/.gradle-validation/caches
            clients/android/.gradle-validation/wrapper
          key: gradle-${{ hashFiles('clients/android/**/*.gradle*', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build app and instrumentation APKs in the pinned toolchain
        run: make android-instrumentation-build
      # Booting a cold AVD costs minutes; a cached snapshot boots in seconds.
      # The snapshot is created once per (api-level, profile) key by a throwaway
      # emulator run, then every later run restores it and boots with
      # -no-snapshot-save so test runs never mutate the cached image.
      - name: Cache the AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-pixel_7_pro
      - name: Create the AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."
      - name: Run the Compose and TV focus suite on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: PLURX_ANDROID_SERIAL="emulator-${EMULATOR_PORT}" make android-instrumentation-run
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            clients/android/app/build/reports/androidTests
            clients/android/app/build/outputs/androidTest-results
          if-no-files-found: warn

  coverage:
    name: coverage
    # Same suite as `check`, so the same pinned ffmpeg. See
    # .github/actions/ffmpeg.
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 30
    # PR coverage was a second run of the Rust suite whose result was discarded;
    # the badge is published only from the merged main branch.
    if: github.ref == 'refs/heads/main'
    # Self-hosted coverage badge — no codecov.io account or token. Measure line
    # coverage, write a shields.io endpoint JSON, and (on main only) force-push it
    # to an orphan `badges` branch that shields renders from raw.githubusercontent.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Instrumented or not, this runs the same suite as the check job, so it
      # needs the same ffmpeg.
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Measure line coverage
        run: cargo llvm-cov --workspace --summary-only --json --output-path cov.json
      - name: Build the shields.io badge JSON
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent' cov.json)
          msg=$(printf '%.1f' "$pct"); int=${msg%.*}
          if   [ "$int" -ge 90 ]; then color=brightgreen
          elif [ "$int" -ge 75 ]; then color=green
          elif [ "$int" -ge 55 ]; then color=yellowgreen
          elif [ "$int" -ge 40 ]; then color=yellow
          elif [ "$int" -ge 20 ]; then color=orange
          else color=red; fi
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$msg" "$color" | tee badge/coverage.json
      - name: Publish badge to the `badges` branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badge
          git init -q
          git checkout -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage badge"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  build:
    name: release build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [scope, preflight]
    if: needs.scope.outputs.release_build == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        # Full history + tags so the build script can stamp the binary with a
        # real `git describe`; the default shallow clone has no tags and every
        # release binary would report a bare hash.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # Also provides the C cross-compiler for rusqlite's bundled SQLite.
        run: |
          # ubuntu-latest can inherit an Azure mirror that accepts the runner
          # but never serves the archive. Pin the canonical mirror so apt does
          # not spend the entire job retrying a dead regional endpoint.
          sudo sed -i \
            's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gcc-aarch64-linux-gnu
      - run: cargo build --release -p plurxd --target ${{ matrix.target }}
        env:
          # Linker for the arm64 target (harmlessly unused on x86_64).
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: plurxd-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/plurxd

  # CD validates the tag in this workflow, then delegates artifact construction,
  # per-platform smoke, and alias publication to the manually recoverable release
  # workflow. A cancelled tag run can therefore be recovered without moving it.
  publish:
    name: publish image (ghcr)
    needs: [check, build]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-release.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  # PR / branch smoke test that the image both builds and runs, without publishing.
  docker:
    name: docker runtime smoke
    runs-on: ubuntu-latest
    needs: [scope, preflight]
    if: needs.scope.outputs.container == 'true' && !startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: plurx/plurxd:ci
          # The runtime stage's layers (two full ffmpeg stacks) depend only on
          # the Dockerfile, so the GHA layer cache spares their ~150 MB of
          # downloads on every run; the cargo builder layer still rebuilds on
          # source changes, which is exactly the part that must.
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Start, probe, restart, and re-probe the image
        run: scripts/container-smoke plurx/plurxd:ci

  # Configure this as the single required check for PRs AND the merge queue.
  # A conditional job is valid when it either passed or was skipped because
  # its surface was unaffected; on merge_group events nothing is skipped, so
  # a green queue run is the full cross-surface fan-out.
  pr_gate:
    name: PR validation gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - scope
      - mobile_version
      - preflight
      - check
      - cluster_auth
      - web_layout
      - android_jvm
      - apple
      - android_device
      - build
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected job to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MOBILE_VERSION_RESULT: ${{ needs.mobile_version.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CLUSTER_AUTH_RESULT: ${{ needs.cluster_auth.result }}
          WEB_LAYOUT_RESULT: ${{ needs.web_layout.result }}
          ANDROID_JVM_RESULT: ${{ needs.android_jvm.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          ANDROID_DEVICE_RESULT: ${{ needs.android_device.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          for result in \
            "$SCOPE_RESULT" "$MOBILE_VERSION_RESULT" \
            "$PREFLIGHT_RESULT" "$CHECK_RESULT" \
            "$CLUSTER_AUTH_RESULT" \
            "$WEB_LAYOUT_RESULT" \
            "$ANDROID_JVM_RESULT" "$APPLE_RESULT" "$ANDROID_DEVICE_RESULT" \
            "$BUILD_RESULT" "$DOCKER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A selected validation job ended with: $result"; exit 1 ;;
            esac
          done
