name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Same gate a developer runs locally (Makefile), so CI never diverges.
      - run: make check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: check
    # Self-hosted coverage badge — no codecov.io account or token. Measure line
    # coverage, write a shields.io endpoint JSON, and (on main only) force-push it
    # to an orphan `badges` branch that shields renders from raw.githubusercontent.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure line coverage
        run: cargo llvm-cov --workspace --summary-only --json --output-path cov.json
      - name: Build the shields.io badge JSON
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent' cov.json)
          msg=$(printf '%.1f' "$pct"); int=${msg%.*}
          if   [ "$int" -ge 90 ]; then color=brightgreen
          elif [ "$int" -ge 75 ]; then color=green
          elif [ "$int" -ge 55 ]; then color=yellowgreen
          elif [ "$int" -ge 40 ]; then color=yellow
          elif [ "$int" -ge 20 ]; then color=orange
          else color=red; fi
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$msg" "$color" | tee badge/coverage.json
      - name: Publish badge to the `badges` branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badge
          git init -q
          git checkout -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage badge"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  build:
    name: release build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        # Full history + tags so the build script can stamp the binary with a
        # real `git describe`; the default shallow clone has no tags and every
        # release binary would report a bare hash.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # Also provides the C cross-compiler for rusqlite's bundled SQLite.
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --workspace --target ${{ matrix.target }}
        env:
          # Linker for the arm64 target (harmlessly unused on x86_64).
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: plurxd-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/plurxd

  # CD: build and publish the multi-arch image to GHCR. Runs only on version
  # tags (e.g. `git tag v0.1.0 && git push --tags`), so the main branch stays
  # build-only and releases are deliberate.
  publish:
    name: publish image (ghcr)
    runs-on: ubuntu-latest
    needs: [check, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with Cargo.toml would ship an image labelled
      # v0.2.0 whose binary reports 0.1.0. Fail here, before anything is
      # published, rather than leaving that contradiction in a registry.
      - name: Tag must match the workspace version
        run: |
          cargo_ver=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_ver   tag: $tag_ver"
          test "$cargo_ver" = "$tag_ver" || {
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $cargo_ver — bump Cargo.toml or retag"
            exit 1
          }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `.git` is excluded from the build context, so stamp the binary from
          # the tag that triggered this run — otherwise released images report
          # build "unknown".
          build-args: |
            PLURX_BUILD_REF=${{ github.ref_name }}

  # PR / branch smoke test that the image builds, without publishing.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: plurx/plurxd:ci
