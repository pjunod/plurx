# plurx configuration — copy to plurx.toml (or /etc/plurx/plurx.toml).
# Every key is optional; these are the defaults. Env vars override the file:
#   PLURX_SERVER_NAME, PLURX_BIND, PLURX_DATA_DIR,
#   PLURX_SCAN_PRUNE_PERCENT, PLURX_CONFIG, PLURX_LOG

[server]
# Human-visible server name.
name = "plurx"
# Address:port the HTTP API binds to.
bind = "0.0.0.0:32400"

[storage]
# Where the database and caches live. Created if missing.
data_dir = "./data"
# A complete scan may remove at most this percentage of known files. Set 0 to
# require manual cleanup; values above 100 are rejected.
scan_prune_percent = 10

# [cluster]
# M2 uses both ports for the one-voter store but pins their listener hosts to
# loopback, regardless of the addresses below. M3 membership will make the
# hosts reachable and use the remaining peer/join settings.
# raft_bind = "0.0.0.0:32401"
# api_bind = "0.0.0.0:32402"
# Reserved for M3 membership:
# advertise_host = ""
# join_token_file = ""
# trusted_network = ""
