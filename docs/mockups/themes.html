<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cinemarr — theme sheet</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#08080a;font:14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#a9a9b4}
  .mtoolbar{position:sticky;top:0;z-index:99;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    padding:8px 14px;background:#0d0d11;border-bottom:1px solid #26262e;
    font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8b8b96}
  .mtoolbar .lbl{color:#5c5c66;text-transform:uppercase;letter-spacing:.08em;font-size:10px;margin-right:2px}
  .mtoolbar .grp{display:flex;gap:4px;align-items:center}
  .mtoolbar button{font:inherit;background:#17171d;color:#a9a9b4;border:1px solid #2b2b34;border-radius:6px;
    padding:4px 9px;cursor:pointer}
  .mtoolbar button.on{background:#e8e8ef;color:#101014;border-color:#e8e8ef;font-weight:600}
  .mtoolbar .note{margin-left:auto;color:#55555f}
  #stage{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:22px;padding:22px}
  .tcard{border-radius:14px;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:var(--font);border:1px solid #26262e;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .tcard .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
  .tcard .hd .nm{font-size:17px;font-weight:700}
  .tcard .hd .st{font:600 9.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .tcard .hd .st.new{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
  .tcard .hd .wm{margin-left:auto}
  .sw{display:flex;gap:4px;padding:0 16px 12px}
  .sw i{flex:1;height:26px;border-radius:5px;border:1px solid rgba(128,128,128,.25)}
  .sw i span{display:block;font:8px var(--font-mono);color:var(--muted);margin-top:28px;text-align:center;
    white-space:nowrap}
  .demo{padding:0 16px 16px;display:flex;flex-direction:column;gap:11px}
  .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:calc(var(--radius) - 2px);padding:8px 14px;background:var(--accent);
    color:var(--btn-ink);font:600 13px var(--font)}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .tag{font:600 10px/1 var(--font-mono);letter-spacing:.04em;padding:3px 7px;border-radius:4px;
    border:1px solid var(--line);color:var(--muted)}
  .tag.hi{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .tag.dv{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .scan{font:11px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;background:var(--panel);display:inline-flex;gap:7px;align-items:center}
  .scan i{width:6px;height:10px;background:var(--accent);border-radius:1px}
  .stat{display:flex;gap:8px}
  .stat span{font:600 10.5px var(--font-mono);padding:3px 8px;border-radius:4px}
  .pbar{flex:1;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;min-width:80px}
  .pbar i{display:block;height:100%;width:58%;background:var(--accent)}
  .minis{display:flex;gap:8px}
  .mini{width:64px;aspect-ratio:2/3;border-radius:6px;position:relative;overflow:hidden}
  .mini .pr{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.5)}
  .mini .pr i{display:block;height:100%;background:var(--accent)}
  .sig{font:11px var(--font-mono);color:var(--muted);border-top:1px solid var(--line);padding:10px 16px;
    background:color-mix(in srgb,var(--panel) 55%,transparent)}
  .sig b{color:var(--text);font-weight:600}
  .wm{font-weight:800;font-size:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tcard[data-th=noirr] .wm{background:none;color:var(--text);font:700 15px var(--font-mono)}
  .tcard[data-th=noirr] .wm .t{display:none}
  .tcard[data-th=noirr] .wm::before{content:"noirr"}
  .tcard[data-th=noirr] .wm::after{content:"";display:inline-block;width:9px;height:3px;margin-left:3px;
    background:var(--accent);border-radius:1px;vertical-align:-2px}
  .tcard[data-th=terminal] .wm{background:none;color:var(--text);font:700 13px var(--font-mono)}
  .tcard[data-th=terminal] .wm::before{content:":~$ "}
  .tcard[data-th=terminal] *{border-radius:0 !important}
  .pin{font:600 9px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);
    border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:4px;padding:2px 7px}
</style>
</head>
<body>
<div class="mtoolbar" id="bar"></div>
<div id="stage"></div>
<script>
"use strict";
const STATE={mode:"dark"};
const FONT_SANS="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
const FONT_SYS="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
const FONT_MONO="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace";
const THEMES={
  classic:{name:"Classic",status:"shipped",sig:"the neutral default — at home on every layout",
    dark:{bg:"#0e0f13",panel:"#171922",panel2:"#1e2230",line:"#2a2f3e",text:"#e8eaf0",muted:"#9aa2b4",accent:"#6ea8fe",accent2:"#8b7cf6",good:"#4ade80",bad:"#f87171",warn:"#fbbf24",radius:"12px",btnInk:"#07101f",font:FONT_SYS,mono:FONT_MONO},
    light:{bg:"#f6f7f9",panel:"#ffffff",panel2:"#eef1f6",line:"#dde2ea",text:"#1a1d24",muted:"#5b6472",accent:"#2f6fe0",accent2:"#6d5bd0",good:"#1a9d5a",bad:"#d64550",warn:"#b45309",radius:"12px",btnInk:"#ffffff",font:FONT_SYS,mono:FONT_MONO}},
  terminal:{name:"Terminal",status:"shipped",sig:"signature of the deck layout — green phosphor / Solarized",
    dark:{bg:"#050705",panel:"#0b100b",panel2:"#111a12",line:"#1e3020",text:"#c9e8c0",muted:"#7a9670",accent:"#3fe170",accent2:"#2aa858",good:"#3fe170",bad:"#ff7066",warn:"#d9c25a",radius:"0px",btnInk:"#041508",font:FONT_MONO,mono:FONT_MONO},
    light:{bg:"#eee8d5",panel:"#fdf6e3",panel2:"#e6dfc8",line:"#d5cdb4",text:"#073642",muted:"#657b83",accent:"#6e7f00",accent2:"#268bd2",good:"#859900",bad:"#dc322f",warn:"#b58900",radius:"0px",btnInk:"#fdf6e3",font:FONT_MONO,mono:FONT_MONO}},
  noirr:{name:"noirr",status:"shipped",sig:"the brand theme — midnight / matinee, kit-exact tokens",
    dark:{bg:"#0a0a0c",panel:"#101014",panel2:"#16161b",line:"rgba(255,255,255,.08)",text:"#ededef",muted:"#9a9aa3",accent:"#e5484d",accent2:"#8e1c22",good:"#5fb582",bad:"#ff7a66",warn:"#d9a05b",radius:"10px",btnInk:"#ffffff",font:FONT_SANS,mono:FONT_MONO},
    light:{bg:"#f2efe8",panel:"#faf8f2",panel2:"#ffffff",line:"rgba(24,22,20,.12)",text:"#1a1a1e",muted:"#5d5c63",accent:"#c2343a",accent2:"#8e1c22",good:"#35855c",bad:"#c96442",warn:"#a3742b",radius:"10px",btnInk:"#ffffff",font:FONT_SANS,mono:FONT_MONO}},
  amber:{name:"Amber",status:"proposed",sig:"signature of the plex layout — charcoal + gold",
    dark:{bg:"#191a1d",panel:"#212327",panel2:"#2a2d32",line:"#383c43",text:"#eceef0",muted:"#9aa0a7",accent:"#e5a00d",accent2:"#cc7b19",good:"#52b788",bad:"#e5534b",warn:"#f2c14e",radius:"8px",btnInk:"#1c1303",font:FONT_SYS,mono:FONT_MONO},
    light:{bg:"#f3f4f6",panel:"#ffffff",panel2:"#e9ebee",line:"#d5d9de",text:"#1e2124",muted:"#5f666d",accent:"#c8880a",accent2:"#a95f16",good:"#238a5e",bad:"#c93f38",warn:"#8a6116",radius:"8px",btnInk:"#ffffff",font:FONT_SYS,mono:FONT_MONO}},
  giallo:{name:"Giallo",status:"proposed",sig:"the kit's reserved amber showtime — noirr structure, amber heat",
    dark:{bg:"#0c0a06",panel:"#14100a",panel2:"#1c160d",line:"rgba(240,200,120,.10)",text:"#f2e9d8",muted:"#a89c85",accent:"#e8a33d",accent2:"#8a5a14",good:"#5fb582",bad:"#e5484d",warn:"#c9723a",radius:"10px",btnInk:"#1a1002",font:FONT_SANS,mono:FONT_MONO},
    light:{bg:"#f5eed9",panel:"#fbf7ea",panel2:"#ffffff",line:"rgba(90,70,30,.14)",text:"#241d10",muted:"#6e6350",accent:"#a8720c",accent2:"#7c4a05",good:"#35855c",bad:"#b23a35",warn:"#8a6116",radius:"10px",btnInk:"#ffffff",font:FONT_SANS,mono:FONT_MONO}},
  silver:{name:"Silver",status:"proposed",sig:"the kit's reserved B&W showtime — status colors stay quietly tinted",
    dark:{bg:"#0a0a0b",panel:"#131315",panel2:"#1b1b1e",line:"rgba(255,255,255,.10)",text:"#f2f2f2",muted:"#9a9a9e",accent:"#e8e8ea",accent2:"#8a8a8f",good:"#9fbfa8",bad:"#d09088",warn:"#c9b48c",radius:"6px",btnInk:"#0a0a0b",font:FONT_SANS,mono:FONT_MONO},
    light:{bg:"#f4f4f2",panel:"#ffffff",panel2:"#eaeae7",line:"rgba(20,20,20,.14)",text:"#141416",muted:"#66666a",accent:"#1a1a1c",accent2:"#5a5a5f",good:"#4a7a58",bad:"#a05248",warn:"#8a7442",radius:"6px",btnInk:"#ffffff",font:FONT_SANS,mono:FONT_MONO}},
  void:{name:"Void",status:"proposed",darkOnly:true,sig:"true black for OLED — midnight-only by design",
    dark:{bg:"#000000",panel:"#0a0a0a",panel2:"#131313",line:"rgba(255,255,255,.13)",text:"#e8e8e8",muted:"#8a8a8a",accent:"#4cc2ff",accent2:"#2f6fe0",good:"#34d399",bad:"#f87171",warn:"#fbbf24",radius:"12px",btnInk:"#001018",font:FONT_SYS,mono:FONT_MONO}},
  vhs:{name:"VHS",status:"proposed",darkOnly:true,sig:"tracking-line synthwave — the fun one, midnight-only",
    dark:{bg:"#140d22",panel:"#1d1430",panel2:"#291c42",line:"rgba(255,120,220,.16)",text:"#f4e9ff",muted:"#a78fc7",accent:"#ff4fd8",accent2:"#26e2ff",good:"#3ddc97",bad:"#ff5c7a",warn:"#ffb454",radius:"14px",btnInk:"#22041c",font:FONT_SANS,mono:FONT_MONO}},
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const POSTERS=[
  {h:355,bg:h=>`linear-gradient(160deg,hsl(${h} 28% 34%),hsl(${h} 34% 12%) 70%)`,prog:41},
  {h:95,bg:h=>`repeating-linear-gradient(180deg,hsl(${h} 45% 26%) 0 3px,hsl(${h} 50% 12%) 3px 6px)`,prog:0},
  {h:215,bg:h=>`linear-gradient(118deg,hsl(${h} 32% 30%) 0 55%,hsl(${(h+120)%360} 30% 24%) 55.2% 100%)`,prog:0},
];
function card(id){
  const th=THEMES[id];
  const pinned=th.darkOnly&&STATE.mode==="light";
  const v=th[th.darkOnly?"dark":STATE.mode]||th.dark;
  const vars=`--bg:${v.bg};--panel:${v.panel};--panel2:${v.panel2};--line:${v.line};--text:${v.text};
    --muted:${v.muted};--accent:${v.accent};--accent2:${v.accent2};--good:${v.good};--bad:${v.bad};
    --warn:${v.warn};--radius:${v.radius};--btn-ink:${v.btnInk};--font:${v.font};--font-mono:${v.mono}`;
  const sw=[["bg",v.bg],["panel",v.panel],["panel2",v.panel2],["text",v.text],["muted",v.muted],
    ["accent",v.accent],["accent2",v.accent2],["good",v.good],["warn",v.warn],["bad",v.bad]]
    .map(x=>`<i style="background:${x[1]}" title="${x[0]}: ${x[1]}"></i>`).join("");
  return `<div class="tcard" data-th="${id}" style="${vars}">
    <div class="hd"><span class="nm">${esc(th.name)}</span>
      <span class="st ${th.status==="proposed"?"new":""}">${th.status}</span>
      ${pinned?'<span class="pin">midnight-only</span>':""}
      <span class="wm"><span class="t">cinemarr</span></span></div>
    <div class="sw">${sw}</div>
    <div class="demo">
      <div class="drow"><button class="btn">▶ Resume · 58m</button>
        <button class="btn ghost">Start over</button>
        <span class="scan"><i></i>Scanning · 86%</span></div>
      <div class="drow"><span class="tag hi">4K</span><span class="tag">HEVC</span>
        <span class="tag dv">DV P7</span><span class="tag">TRUEHD</span><span class="tag hi">1080P</span>
        <span class="tag">H.264</span><div class="pbar"><i></i></div></div>
      <div class="drow stat">
        <span style="color:${v.good};border:1px solid color-mix(in srgb,${v.good} 45%,${v.line})">direct play</span>
        <span style="color:${v.warn};border:1px solid color-mix(in srgb,${v.warn} 45%,${v.line})">transcoding</span>
        <span style="color:${v.bad};border:1px solid color-mix(in srgb,${v.bad} 45%,${v.line})">failed</span>
        <span style="color:${v.muted};border:1px solid ${v.line}">idle</span></div>
      <div class="minis">${POSTERS.map(p=>`<span class="mini" style="background:${p.bg(p.h)}">
        ${p.prog?`<span class="pr"><i style="width:${p.prog}%"></i></span>`:""}</span>`).join("")}</div>
    </div>
    <div class="sig"><b>${esc(th.name)}</b> — ${esc(th.sig)}</div>
  </div>`;
}
function bar(){
  const b=(id,nm)=>`<button class="${STATE.mode===id?"on":""}" onclick="setMode('${id}')">${nm}</button>`;
  document.getElementById("bar").innerHTML=`
    <div class="grp"><span class="lbl">mode</span>${b("dark","Dark")}${b("light","Light")}</div>
    <span class="note">theme sheet — 3 shipped + 5 proposed · orthogonal to layouts (any theme on any layout)</span>`;
}
function setMode(m){STATE.mode=m;render();}
function setS(k,v){if(k==="mode")setMode(v);} // harness/back-compat alias
function render(){bar();document.getElementById("stage").innerHTML=Object.keys(THEMES).map(card).join("");}
window.addEventListener("DOMContentLoaded",render);
</script>
</body>
</html>
