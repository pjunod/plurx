# XcodeGen spec — generates plurx.xcodeproj with an iOS app and a tvOS app that
# share every Swift file under Sources/. Build:
#   brew install xcodegen        # once
#   cd clients/apple && xcodegen generate && open plurx.xcodeproj
# then set your Signing Team on both targets and Run.
name: plurx
options:
  bundleIdPrefix: tv.plurx
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.6"
    CURRENT_PROJECT_VERSION: "26"
    # Paul Junod's paid Apple Developer Program team. Automatic signing creates
    # and refreshes development profiles for both platform targets.
    DEVELOPMENT_TEAM: "YHK542LK23"
    CODE_SIGN_STYLE: Automatic

targets:
  plurx-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets        # iOS app icon
      - path: Resources/PrivacyInfo.xcprivacy  # required-reason API manifest
    settings:
      base:
        PRODUCT_NAME: plurx
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/iOS-Info.plist
      properties:
        CFBundleDisplayName: Noirr Cinema
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # The Audio, AirPlay, and Picture in Picture background mode lets the
        # native PiP window keep its AVPlayer alive after leaving the app.
        UIBackgroundModes:
          - audio
        # Home servers are usually plain http on the LAN — permit it. The
        # narrower NSAllowsLocalNetworking is NOT a substitute: it misses
        # Tailscale's 100.64/10 and, on iOS 10+, its mere presence makes
        # NSAllowsArbitraryLoads be ignored. See docs/PUBLISHING.md §4.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Without this iOS silently refuses connections to 192.168.x.x —
        # a functional bug, not paperwork.
        NSLocalNetworkUsageDescription: "Cinema connects to your media server on your local network."
        NSCameraUsageDescription: "Cinema scans a QR code containing your media server address."
        # Browsing is also the permission preflight: it makes iOS ask before a
        # login request can race the system sheet. The value must match the
        # service plurxd publishes through DNS-SD.
        NSBonjourServices:
          - _plurx._tcp
        # Skips the export-compliance questionnaire on every upload.
        ITSAppUsesNonExemptEncryption: false

  plurx-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources/tvOS.xcassets          # layered Brand Assets + Top Shelf
      - path: Resources/PrivacyInfo.xcprivacy  # required-reason API manifest
    settings:
      base:
        PRODUCT_NAME: plurx
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app
        # Names tvOS.brandassets inside Resources/tvOS.xcassets. Without it the
        # tvOS archive cannot be uploaded at all.
        ASSETCATALOG_COMPILER_APPICON_NAME: tvOS
    info:
      path: Support/tvOS-Info.plist
      properties:
        CFBundleDisplayName: Noirr Cinema
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes:
          - audio
        # Same reasoning as iOS above — docs/PUBLISHING.md §4.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Cinema connects to your media server on your local network."
        NSBonjourServices:
          - _plurx._tcp
        ITSAppUsesNonExemptEncryption: false

  plurx-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: plurx-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app.tests.ios
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/plurx.app/plurx"
        BUNDLE_LOADER: "$(TEST_HOST)"

  plurx-tvOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
    dependencies:
      - target: plurx-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app.tests.tvos
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/plurx.app/plurx"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  plurx-iOS:
    build:
      targets:
        plurx-iOS: all
        plurx-iOSTests: [test]
    test:
      targets:
        - plurx-iOSTests

  plurx-tvOS:
    build:
      targets:
        plurx-tvOS: all
        plurx-tvOSTests: [test]
    test:
      targets:
        - plurx-tvOSTests
