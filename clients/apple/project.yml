# XcodeGen spec — generates plurx.xcodeproj with an iOS app and a tvOS app that
# share every Swift file under Sources/. Build:
#   brew install xcodegen        # once
#   cd clients/apple && xcodegen generate && open plurx.xcodeproj
# then set your Signing Team on both targets and Run.
name: plurx
options:
  bundleIdPrefix: tv.plurx
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here (or per-target in Xcode's Signing tab).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  plurx-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets        # iOS app icon
      - path: Resources/PrivacyInfo.xcprivacy  # required-reason API manifest
    settings:
      base:
        PRODUCT_NAME: plurx
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Support/iOS-Info.plist
      properties:
        CFBundleDisplayName: plurx
        # Home servers are usually plain http on the LAN — permit it. The
        # narrower NSAllowsLocalNetworking is NOT a substitute: it misses
        # Tailscale's 100.64/10 and, on iOS 10+, its mere presence makes
        # NSAllowsArbitraryLoads be ignored. See docs/PUBLISHING.md §4.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Without this iOS silently refuses connections to 192.168.x.x —
        # a functional bug, not paperwork.
        NSLocalNetworkUsageDescription: "plurx connects to your media server on your local network."
        # Skips the export-compliance questionnaire on every upload.
        ITSAppUsesNonExemptEncryption: false

  plurx-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources/tvOS.xcassets          # layered Brand Assets + Top Shelf
      - path: Resources/PrivacyInfo.xcprivacy  # required-reason API manifest
    settings:
      base:
        PRODUCT_NAME: plurx
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app
        # Names tvOS.brandassets inside Resources/tvOS.xcassets. Without it the
        # tvOS archive cannot be uploaded at all.
        ASSETCATALOG_COMPILER_APPICON_NAME: tvOS
    info:
      path: Support/tvOS-Info.plist
      properties:
        CFBundleDisplayName: plurx
        # Same reasoning as iOS above — docs/PUBLISHING.md §4.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "plurx connects to your media server on your local network."
        ITSAppUsesNonExemptEncryption: false
