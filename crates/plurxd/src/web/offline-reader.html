<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'self'">
  <title>Cinema offline reader</title>
  <style>
    :root{font:16px/1.4 system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#11110f;--surface:#24231f;--text:#f4efe6;--muted:#aaa49a;--accent:#e7bd72;--line:#3d3a33}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}button,select,input{font:inherit}
    body{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
    header,footer{display:flex;align-items:center;gap:.55rem;padding:max(.55rem,env(safe-area-inset-top)) max(.65rem,env(safe-area-inset-right)) .55rem max(.65rem,env(safe-area-inset-left));background:var(--surface);z-index:2}
    footer{padding:.55rem max(.65rem,env(safe-area-inset-right)) max(.55rem,env(safe-area-inset-bottom)) max(.65rem,env(safe-area-inset-left));justify-content:center}
    button{min-width:2.75rem;min-height:2.75rem;border:1px solid var(--line);border-radius:.65rem;background:#2e2c27;color:var(--text);padding:.45rem .7rem}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    button.primary{color:#1b1710;background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.4}.grow{flex:1;min-width:0}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:.82rem}
    main{position:relative;min-height:0}iframe{width:100%;height:100%;border:0;background:#fffdf8}.loading,.error{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:2rem;background:var(--bg);z-index:1}.error{color:#ffb3ac}.hidden{display:none!important}
    dialog{width:min(34rem,calc(100% - 1.2rem));max-height:80%;border:1px solid var(--line);border-radius:.9rem;background:var(--surface);color:var(--text);padding:1rem}dialog::backdrop{background:#000b}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:1rem}.toc,.search-results{display:grid;gap:.35rem;max-height:55vh;overflow:auto}.toc button,.search-results button{text-align:left;background:transparent}.toc button[aria-current=true]{border-color:var(--accent);color:var(--accent)}
    .search{display:flex;gap:.5rem;margin-bottom:.8rem}.search input{min-height:2.75rem;min-width:0;flex:1;border:1px solid var(--line);border-radius:.65rem;background:var(--bg);color:var(--text);padding:.55rem}.search-results button{display:grid;gap:.2rem}.result-title{font-weight:700}.result-snippet{color:var(--muted);font-size:.88rem}
    .settings{display:grid;grid-template-columns:minmax(7rem,1fr) minmax(10rem,2fr);align-items:center;gap:.8rem}.settings input,.settings select{width:100%}#location{min-width:8rem;text-align:center}
    @media(max-width:620px){header .word{display:none}.title{font-size:.9rem}#location{min-width:5.4rem}.settings{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header aria-label="Reader controls">
    <button id="close" aria-label="Close book">Close</button>
    <div class="grow"><div class="title" id="title">Book</div><div class="muted" id="progress">Opening…</div></div>
    <button id="toc" aria-label="Table of contents"><span class="word">Contents</span><span aria-hidden="true">☰</span></button>
    <button id="search" aria-label="Search this book"><span class="word">Search</span><span aria-hidden="true">⌕</span></button>
    <button id="settings" aria-label="Reading settings"><span class="word">Settings</span><span aria-hidden="true">Aa</span></button>
    <button id="finished" aria-pressed="false">Finish</button>
  </header>
  <main>
    <iframe id="page" title="Book page" sandbox="allow-same-origin"></iframe>
    <div class="loading" id="loading" role="status">Opening book…</div>
    <div class="error hidden" id="error" role="alert"></div>
  </main>
  <footer>
    <button id="previous" aria-label="Previous page">Previous</button>
    <div id="location" aria-live="polite">—</div>
    <button class="primary" id="next" aria-label="Next page">Next</button>
  </footer>
  <dialog id="toc-dialog"><div class="panel-title"><h2>Contents</h2><button data-close="toc-dialog">Done</button></div><div class="toc" id="toc-list"></div></dialog>
  <dialog id="search-dialog"><div class="panel-title"><h2>Search this book</h2><button data-close="search-dialog">Done</button></div><form class="search" id="search-form"><input id="search-query" type="search" minlength="2" autocomplete="off" placeholder="Words in this publication" aria-label="Search this book"><button class="primary" type="submit">Search</button></form><div class="search-results" id="search-results" aria-live="polite"><div class="muted">Search stays on this device.</div></div></dialog>
  <dialog id="settings-dialog"><div class="panel-title"><h2>Reading settings</h2><button data-close="settings-dialog">Done</button></div><div class="settings">
    <label for="font">Typeface</label><select id="font"><option value="publisher">Publisher</option><option value="serif">Serif</option><option value="sans">Sans serif</option><option value="accessible">Accessible</option></select>
    <label for="font-size">Text size</label><input id="font-size" type="range" min="70" max="220" step="5">
    <label for="line-height">Line height</label><input id="line-height" type="range" min="1.1" max="2.4" step=".05">
    <label for="margin">Margins</label><input id="margin" type="range" min="2" max="18" step="1">
    <label for="theme">Page</label><select id="theme"><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select>
    <label for="flow">Layout</label><select id="flow"><option value="paginated">Paginated</option><option value="scrolled">Scrolled</option></select>
  </div></dialog>
  <script src="reader.js"></script>
  <script src="offline-reader.js"></script>
</body>
</html>
