// The failure every per-frame counter forgives: hardware decode, a full
// buffer, and the presentation clock quietly running at three-quarter speed.
// No frame drops, no stall fires, and `slow` hitches accumulate on healthy
// sessions too — so the one session that LOOKED like buffering reported
// nothing. Seen live (Tron, 2026-07-30): 18.2 fps rendered at 75.8% speed,
// 9 s buffered, VideoToolbox decoding in hardware per chrome://media-internals
// — and not one line in the log ring. The realized rate over the detector's
// ~10 s window is the clean signal: the window already clears on pause and
// seek, and requiring a healthy runway keeps supply stalls out (those belong
// to endWait, and only those should send anyone looking at pacing).
function reportRateChase(v){
  const p=PLAYER; if(!p||!p.hitches) return;
  const h=p.hitches, want=(v.playbackRate||1);
  if(h.rate==null || !(h.rate>0) || want<=0 || h.rate>=want*CHASE_RATE_MAX) return;
  const runway=bufferRunway(v);
  if(runway<CHASE_RUNWAY_SECS) return;       // starved — endWait's case, not this one
  const now=performance.now();
  if(p._chaseAt && now-p._chaseAt<CHASE_REPORT_MS) return;
  p._chaseAt=now;
  clientLog(Object.assign({level:"warn",event:"rate_chase",
    detail:`rate=${h.rate.toFixed(3)} of ${want} fps=${h.renderedFps!=null?h.renderedFps.toFixed(1):"?"} runway=${runway}s slow=${h.slow} late=${h.late||0}`,
    message:`presenting at ${(h.rate*100/want).toFixed(1)}% speed with ${runway}s buffered now — the window may be digesting a stall just before this (check stall/player_event lines)`},
    playbackContext(), {runway}));
}
// The buffer stopped growing, and this says why. `quota` is the interesting
// one: it is the browser refusing more data, which is the actual ceiling on a
// 4K forward buffer and the number the buffer settings can't argue with. Rate
// limited per session — a full buffer re-fires on every append attempt, and a
// thousand identical log lines would bury the first one.
// Reported once a pattern exists rather than per hitch: one beacon per frame
// would be a denial of service on the log ring, and a single hitch is noise —
// what identifies a cause is the count and the spacing.
function reportHitches(){
  const p=PLAYER; if(!p||!p.hitches) return;
  const h=p.hitches, n=h.back+h.held+(h.late||0)+(h.drop||0)+h.gap;
  if(n<5 || p._hitchReported===n) return;
  if(n!==5 && n%50!==0) return;
  p._hitchReported=n;
  const iv=hitchInterval();
  const blame=hitchBlame();
  clientLog(Object.assign({level:"warn",event:"hitch",
    detail:`back=${h.back} held=${h.held} late=${h.late||0} drop=${h.drop||0} skip=${h.gap} slow=${h.slow}${h.fps?` fps=${h.fps.toFixed(2)}`:''}${h.rate!=null?` rate=${h.rate.toFixed(3)}`:''}`,
    message:`${n} frame hitches${iv?`, one every ~${iv.toFixed(1)}s`:''}${blame?` — ${blame}`:''} — ${h.last||''}`},
    playbackContext()));
}
function reportBufferLimit(kind, d){
  const p=PLAYER; if(!p) return;
  p.bufferLimits=p.bufferLimits||{};
  p.bufferLimits[kind]=(p.bufferLimits[kind]||0)+1;
  const n=p.bufferLimits[kind];
  if(n!==1 && n%25!==0) return;
  const ctx=playbackContext();
  clientLog(Object.assign({level:"warn",event:"buffer_limit",detail:kind,
    message:`${kind} after ${ctx.runway}s buffered (x${n})`,
    // What the player ASKED for, beside what it got — the comparison that
    // says whether our seconds target or the browser's quota is the limit.
    // Read from the live config rather than restated: a hardcoded 60 here
    // would have kept claiming 60 long after the target became bitrate-aware.
    target:(p.hls&&p.hls.config&&p.hls.config.maxBufferLength)||null}, ctx));
}
// Durations. Home video made this care about seconds: a 6-second phone clip
// reading "0m" is worse than saying nothing.
function fmtDur(ms){ if(!ms) return ""; const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  if(s<60) return `${Math.max(1,s)}s`;
  return h?`${h}h ${m}m`:`${m}m`; }
function fmtSize(b){ if(!b) return ""; const g=b/(1024**3); return g>=1?g.toFixed(1)+" GB":Math.round(b/(1024**2))+" MB"; }
function fmtUptime(s){ const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return d?`${d}d ${h}h`:(h?`${h}h ${m}m`:`${m}m`); }
function fmtTs(ms){ const d=new Date(ms); return d.toLocaleTimeString([], {hour12:false})+"."+String(ms%1000).padStart(3,"0"); }
function fmtAgo(unix){ if(!unix) return ""; const s=Math.max(0,Math.floor(Date.now()/1000)-unix);
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }
// HTML-escape for text and attribute values. Escapes BOTH quote characters:
// `'` matters because inline on* handlers are single-quoted, and an unescaped
// apostrophe in interpolated data (e.g. a title like "Can't") closes the
// attribute early and silently breaks the handler. Compose with JSON.stringify
// for a JS string inside an attribute: esc(JSON.stringify(value)).
function esc(s){ return (s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// A recorded/EXIF date for display. Parsed by hand rather than through
// `new Date("2019-06-14")`, which is UTC midnight and shows the day before in
// every western timezone.
function fmtDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");
  if(!m) return "";
  return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]))
    .toLocaleDateString([], {year:"numeric",month:"short",day:"numeric"});
}
// Artwork with a graceful fallback: initials on a tinted card when there's
// no poster (so a seasons grid never shows blank rectangles).
function artHtml(it, cls){
  // A photo whose thumbnail hasn't been generated yet still has itself to
  // show — the endpoint falls back to the original.
  const src=it.poster||it.backdrop||(it.kind==='photo'?`/api/v1/items/${it.id}/photo?size=thumb`:null);
  if(src) return `<img class="art ${cls||''}" loading="lazy" src="${esc(tok(src))}" alt="">`;
  if(it.kind==='season' && it.season_number!=null)
    return `<div class="art ph season ${cls||''}"><div class="snum">${it.season_number}</div><div class="sl">Season</div></div>`;
  if(it.kind==='audiobook') return `<div class="art ph ${cls||''}" aria-label="Audiobook">♫</div>`;
  if(it.kind==='book') return `<div class="art ph ${cls||''}" aria-label="Ebook">Aa</div>`;
  const label=(it.title||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"?";
  return `<div class="art ph ${cls||''}">${esc(label)}</div>`;
}

function logout(){
  if(READER) destroyReader(false);
  TOKEN=null; ME=null;
  if(!NATIVE_READER_BOOT) localStorage.removeItem("plurx_token");
  clearInterval(ACT_TIMER); ACT_TIMER=null; document.documentElement.classList.remove("working");
  if(NATIVE_READER_BOOT){ nativeReaderPost("session-ended"); return; }
  render();
}
let SERVER=null;   // last /server response (name, version, android_app, …)
async function boot(){
  // Before anything can build a /decision URL: the MediaCapabilities refinement
  // of PLAY_CAPS is async, and the server hears one capability answer per
  // session with no way to correct it afterwards. Awaiting here — ahead of even
  // the /server call — means the setup and login paths, which reach render()
  // without coming back through boot(), are covered too.
  try{ await PLAY_CAPS_READY; }catch(e){}
  let server;
  try{ server=await api("/server"); SERVER=server; }catch(e){
    document.getElementById("app").innerHTML=`<div class="center"><div class="card">Server unreachable.</div></div>`;
    if(NATIVE_READER_BOOT) nativeReaderPost("error","Cinema server unreachable.");
    return;
  }
  if(server.setup_required){
    if(NATIVE_READER_BOOT){ nativeReaderPost("error","Finish setting up this Cinema server before reading."); return; }
    return renderSetup(server);
  }
  if(!TOKEN){
    if(NATIVE_READER_BOOT){ nativeReaderPost("session-ended"); return; }
    return renderLogin(server);
  }
  try{ ME=await api("/me"); }catch(e){ return NATIVE_READER_BOOT?undefined:renderLogin(server); }
  location.hash=location.hash||"#/";
  render();
}

// The first account, and the one place a typo is unrecoverable from inside the
// product: there is no other admin to reset it and no email to recover to. A
// mistyped password here locks the owner out of their own server, and the only
// way back is `plurxd reset-password` on the console — which someone who just
// installed this has no reason to know exists. Hence the confirm field, and
// hence the length check running here rather than only at the server: the
// server's "at least 8 characters" arrives as a red line under a form whose
// contents are already gone.
function renderSetup(){
  authShell("Welcome","Create your admin account to get started.",
    `<label for="u">Username</label><input id="u" autocomplete="username" required>
     <label for="p">Password</label><input id="p" type="password" autocomplete="new-password" required placeholder="at least 8 characters">

      if(p.value!==p2.value){ p2.value=""; p2.focus(); throw new Error("Those two passwords don't match. Try again."); }
      const r=await api("/setup",{method:"POST",body:{username:u.value.trim(),password:p.value}});

function renderLogin(){

    `<label for="u">Username</label><input id="u" autocomplete="username" required>

// Only layouts this surface can actually run are offered — an entry the device

// it, nothing changes, and the menu goes on claiming it is selected.
function layoutMenuHtml(){
  const cur=layoutId(), here=surfaceClass();

// A layout change repaints everything, chrome included — unlike a theme, which
// only swaps CSS variables on an already-painted page. render() is the honest
// way to do that: it re-runs the current route through the new layout.
// Where the reader was, carried across a re-render that is not a navigation.
// Consume-once: a scroll position restored on a route the user actually
// navigated to would be worse than the reset it replaces.
let PENDING_SCROLL=null;
function restoreScroll(){
  if(PENDING_SCROLL===null) return;

  // through yet and the browser clamps the offset to zero.

  // route with the same content is about to be rebuilt from scratch, and
  // dumping the reader at the top of a 200-item library is a real loss.

// ---- global activity indicator --------------------------------------------
// Always-visible pill: whatever the server is doing right now (scans,
// metadata, streams — later: moves, backups). Empty response = hidden.
let ACT_TIMER=null;
async function pollActivity(){
  if(!TOKEN||!ME) return;
  const el=document.getElementById("activity");
  if(!el) return;
  try{
    const acts=await api("/activity");
    // the cursor is the status light: blinking = working, solid = idle (noirr)
    document.documentElement.classList.toggle("working", acts.length>0);
    if(!acts.length){ el.style.display="none"; el.innerHTML=""; return; }
    const a=acts[0];
    const bits=[esc(a.label)];
    if(a.detail) bits.push(esc(a.detail));
    if(a.percent!=null) bits.push(a.percent+"%");
    const extra=acts.length>1?` &nbsp;+${acts.length-1}`:"";
    el.innerHTML=`<span class="spin"></span><span>${bits.join(" · ")}${extra}</span>`;
    el.style.display="flex";
  }catch(e){}
}

// ---- cards ----------------------------------------------------------------
function progressPct(w){ if(!w||!w.duration_ms||!w.position_ms) return 0; return Math.min(100,100*w.position_ms/w.duration_ms); }
// Time-left + projected finish clock ("ends ~10:45 PM"), in the browser's local
// time. new Date()/Date.now() are fine here — this is browser JS, not a workflow.
function itemDurMs(it){ return (it&&it.watch&&it.watch.duration_ms) || (it&&it.runtime_ms) || 0; }
function fmtClock(d){ try{ return d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
function endsAt(remMs){ if(!remMs||remMs<0) return ""; return fmtClock(new Date(Date.now()+remMs)); }
// "2022-02-18" → "Feb 18, 2022" (plain text; callers escape). Falls back to the
// raw string for anything that isn't an ISO date.
function fmtDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); if(!m) return s||"";
  const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][(+m[2])-1]||""; return `${mo} ${+m[3]}, ${m[1]}`; }
// The 4-digit year from an ISO date/timestamp, or null.
function airYear(s){ const m=/^(\d{4})/.exec(s||""); return m?+m[1]:null; }
// One meta line for a card in a watch-oriented row (Continue watching / Next up):
// time left on a partial item (or full runtime), plus when it would finish now.
function watchLine(it, watchCtx){
  if(!watchCtx) return "";
  const dur=itemDurMs(it); if(!dur) return "";
  const w=it.watch;
  if(w && w.watched) return "";
  const partial = w && w.position_ms>3000;
  const rem = partial ? Math.max(0, dur - w.position_ms) : dur;
  const end = endsAt(rem);
  return `<div class="cleft">${partial?fmtDur(rem)+" left":fmtDur(rem)}${end?" · ends ~"+end:""}</div>`;
}
// Resolution helpers. `resolution` is the item's best file height (movies only,
// on the library grid). Labels reuse resLabel() (height-only here) so a card's
// badge and its section header read the same as the video spec badges.
// Tier class for the badge/dot colour ramp. Thresholds match resLabel() exactly
// so the colour and the text can never disagree.
function resClass(h){ h=h||0;
  return h>=1700?"r4k" : h>=1300?"r1440" : h>=900?"r1080" : h>=650?"r720" : h>=400?"r480" : ""; }
function resBucket(it){ const h=it.resolution||0;
  const r = h>=1700?0 : h>=1300?1 : h>=900?2 : h>=650?3 : h>=400?4 : h>0?5 : 6;
  return { r, l: h?resLabel(0,h):"Unknown resolution", c: resClass(h) }; }
// Group items (already server-sorted height-desc) into resolution sections.
function resSections(items){
  const groups=new Map();
  for(const it of items){ const b=resBucket(it); if(!groups.has(b.r)) groups.set(b.r,{l:b.l,c:b.c,items:[]}); groups.get(b.r).items.push(it); }
  return [...groups.keys()].sort((a,b)=>a-b).map(r=>{ const g=groups.get(r);
    return `<h2 class="section ressection"><span class="resdot resgrad ${g.c}"></span>${esc(g.l)}<span class="muted" style="font-size:12px">${g.items.length}</span></h2>${grid(g.items)}`;
  }).join("");
}
function card(it, watchCtx){
  // Home-library cards: a folder leads with what's inside, a clip with when it
  // was taken and how long it runs, a photo with a square thumb you click to
  // open full-screen.
  if(it.kind==='folder'||it.kind==='photo') return homeCard(it);
  const img = artHtml(it);
  const resb = it.resolution
      ? `<span class="resbadge resgrad ${resClass(it.resolution)}">${esc(resLabel(0,it.resolution))}</span>` : "";
  // On rail cards the series is the headline and the episode (SxEy · name) is
  // the secondary line — a show's name matters more than which episode this is.
  // `show_title` is only set on rail rows; the season page renders episodes via
  // episodeRow() (no show_title), so those keep the episode name as the title.
  const isEp = it.kind==='episode';
  const ep = isEp ? `S${it.season_number||0}E${it.episode_number||0}` : '';
  const main = isEp && it.show_title ? it.show_title : it.title;
  const sub = isEp
      ? esc(it.show_title ? (it.title ? `${ep} · ${it.title}` : ep) : ep)
      : it.kind==='video'
        ? esc(fmtDate(it.recorded_at))
        : it.kind==='audiobook'
          ? esc([it.author||'Audiobook',it.runtime_ms?fmtDur(it.runtime_ms):''].filter(Boolean).join(' · '))
        : it.kind==='book'
          ? esc(it.author||'Ebook')
        : esc(it.year? String(it.year): (it.kind==='show'?'Series':''));
  const dur = (it.kind==='video'||it.kind==='audiobook')&&it.runtime_ms? `<span class="durbadge">${esc(fmtDur(it.runtime_ms))}</span>`:"";
  const pct = progressPct(it.watch);
  const watched = it.watch&&it.watch.watched? `<span class="badge">✓</span>`:"";
  const prog = pct>0&&pct<100? `<div class="prog"><i style="width:${pct}%"></i></div>`:"";
  // Watch state and item kind as classes, so a layout that marks unwatched
  // titles can ask a question instead of inferring the answer from which
  // children happen to be absent. The :not(:has(.badge)):not(:has(.prog))…
  // chain this replaces was both fragile and wrong: a folder card has no watch
  // state either, so it got flagged as unwatched.
  const cls = `poster k-${esc(it.kind||"item")}${(!watched&&!prog)?" unw":""}`;
  return `<div class="${cls}" onclick="location.hash='#/item/${it.id}'">
    <div class="artbox">${img}${dur}${watched}</div><div class="meta"><div class="t">${esc(main)}</div><div class="s"><span class="stxt">${sub}</span>${resb}</div>${watchLine(it,watchCtx)}</div>${prog}</div>`;
}
// Folder and photo cards. A folder opens its page; a photo opens the lightbox
// in place, because paging through a shoebox of stills via a detail page each
// time is nobody's idea of looking at photos.
function homeCard(it){
  if(it.kind==='folder'){
    const n=it.child_count;
    const sub=n==null? "Folder" : `${n} item${n===1?'':'s'}`;
    return `<div class="poster k-folder" onclick="location.hash='#/item/${it.id}'">
      <div class="artbox">${artHtml(it)}</div>
      <div class="meta"><div class="t">${esc(it.title)}</div><div class="s"><span class="stxt">${esc(sub)}</span></div></div></div>`;
  }
  return `<div class="poster k-photo" onclick="openLightbox(${it.id})">
    <div class="artbox">${artHtml(it,'sq')}</div>
    <div class="meta"><div class="t">${esc(it.title)}</div><div class="s"><span class="stxt">${esc(fmtDate(it.recorded_at))}</span></div></div></div>`;
}
function grid(items){
  // Remember this grid's photos so the lightbox can walk them with ←/→.
  PHOTO_SET=(items||[]).filter(i=>i.kind==='photo').map(i=>({id:i.id,title:i.title,recorded_at:i.recorded_at}));
  return items.length? `<div class="grid">${items.map(i=>card(i)).join("")}</div>` : `<div class="empty">Nothing here yet.</div>`;
}

// ---- photo lightbox -------------------------------------------------------
// Full-screen original, ←/→ through the photos of whatever grid you opened it
// from (videos are skipped — they belong to the player, not here), Esc closes,
// swipe on touch. Neighbours are preloaded so paging doesn't flash.
let PHOTO_SET=[], LB_AT=-1;
function photoUrl(id,size){ return tok(`/api/v1/items/${id}/photo${size?`?size=${size}`:""}`); }
function openLightbox(id){
  if(!PHOTO_SET.some(p=>p.id===id)) PHOTO_SET=[{id,title:"",recorded_at:null}];
  LB_AT=PHOTO_SET.findIndex(p=>p.id===id);
  let box=document.getElementById("lightbox");
  if(!box){
    box=document.createElement("div");
    box.id="lightbox"; box.className="lightbox";
    box.innerHTML=`<img id="lbimg" alt="">
      <button class="lbx" aria-label="Close (Esc)" title="Close (Esc)" onclick="closeLightbox()">✕</button>
      <button class="lbprev" aria-label="Previous photo" onclick="lbStep(-1)">‹</button>
      <button class="lbnext" aria-label="Next photo" onclick="lbStep(1)">›</button>
      <div class="lbcap" id="lbcap"></div>`;
    box.addEventListener("click",e=>{ if(e.target===box) closeLightbox(); });
    box.addEventListener("touchstart",e=>{ LB_TOUCH=e.changedTouches[0].clientX; },{passive:true});
    box.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-LB_TOUCH;
      if(Math.abs(dx)>50) lbStep(dx<0?1:-1);
    },{passive:true});
    document.body.appendChild(box);
  }
  document.body.style.overflow="hidden";
  paintLightbox();
}
let LB_TOUCH=0;
function paintLightbox(){
  const p=PHOTO_SET[LB_AT]; if(!p) return closeLightbox();
  const img=document.getElementById("lbimg"); if(img) img.src=photoUrl(p.id);
  const cap=document.getElementById("lbcap");
  const many=PHOTO_SET.length>1? ` · ${LB_AT+1} of ${PHOTO_SET.length}`:"";
  if(cap) cap.innerHTML=`<b>${esc(p.title||"")}</b> ${esc(fmtDate(p.recorded_at))}${esc(many)}`;
  for(const n of [LB_AT-1,LB_AT+1]){
    const q=PHOTO_SET[n]; if(q){ const pre=new Image(); pre.src=photoUrl(q.id); }
  }
  const one=PHOTO_SET.length<2;
  for(const c of ["lbprev","lbnext"]){
    const b=document.querySelector(`.lightbox .${c}`); if(b) b.style.display=one?"none":"";
  }
}
function lbStep(d){
  if(!PHOTO_SET.length) return;
  LB_AT=(LB_AT+d+PHOTO_SET.length)%PHOTO_SET.length;
  paintLightbox();
}
function closeLightbox(){
  const box=document.getElementById("lightbox"); if(box) box.remove();
  document.body.style.overflow="";
  LB_AT=-1;
}
function lightboxOpen(){ return !!document.getElementById("lightbox"); }

// ---- views ----------------------------------------------------------------
// ---- get-the-app install prompt -------------------------------------------
// Android can sideload the native APK (served by this server when published);
// iOS can't, so it gets "Add to Home Screen" (PWA) + a pointer to the Xcode
// source. Shown as a dismissible home banner and a header button.
function appPlatform(){
  const ua=navigator.userAgent||"";
  if(/android/i.test(ua)) return /(\btv\b|bravia|shield|aft[a-z]|googletv|chromecast)/i.test(ua)?"androidtv":"android";
  if(/iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)) return "ios";
  return "other";
}
function appStandalone(){
  try{ return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true; }catch(e){ return false; }
}
function installAvailable(){
  if(appStandalone()) return false;
  const p=appPlatform();
  if(p==="ios") return true;                                   // Add to Home Screen
  if(p==="android"||p==="androidtv") return !!(SERVER&&SERVER.android_app);
  return false;
}
function installDismissed(){ try{ return localStorage.getItem("plurx_getapp_dismissed")==="1"; }catch(e){ return false; } }
function dismissInstall(){ try{ localStorage.setItem("plurx_getapp_dismissed","1"); }catch(e){} const b=document.getElementById("getapp"); if(b) b.remove(); }
function showInstall(){ try{ localStorage.removeItem("plurx_getapp_dismissed"); }catch(e){} location.hash="#/"; render(); }
function installBannerHtml(){
  if(!installAvailable()||installDismissed()) return "";
  const p=appPlatform();
  if(p==="android"||p==="androidtv"){
    const tvNote = p==="androidtv"
      ? `On Android TV, sideload it with the <b>Downloader</b> app (enter this server's address) or <code>adb install</code>.`
      : `Open the downloaded file to install — allow installs from your browser if prompted.`;
    return `<div class="getapp" id="getapp">
      <div><b>Get the Cinema Android app</b><div class="muted" style="font-size:13px">Native playback — direct-plays MKV · HEVC · 4K that a browser can't. ${tvNote}</div></div>
      <div class="row" style="gap:8px">
        <a class="btn" href="/download/plurx-android.apk">Download APK</a>
        <button class="ghost sm" onclick="dismissInstall()">Dismiss</button>
      </div></div>`;
  }
  return `<div class="getapp" id="getapp">
      <div><b>Install Cinema</b><div class="muted" style="font-size:13px">Tap <b>Share</b> → <b>Add to Home&nbsp;Screen</b> for a full-screen app. A native iOS / Apple&nbsp;TV app can be built from <code>clients/apple</code> in the source (Xcode).</div></div>
      <button class="ghost sm" onclick="dismissInstall()">Dismiss</button></div>`;
}

// Home library grouping: "category" (Movies / TV Shows, merging shares of the
// same kind — the default, since what you want to watch is a kind of thing, not
// a share name) or "share" (one section per library). Persisted in localStorage
// like the other viewing prefs.
// A coming-soon card.
//
// There is still nothing to PLAY — the file does not exist yet — but there is
// something to show. The server prefers a local poster resolved by external
// id, then downloads and caches the provider poster path monarr supplied. The
// browser only ever sees plurx's image route; a title whose provider named no
// poster gets the same initials tile the grids use.
//
// It clicks through to the item when there is one, and is inert when there is
// not: a card that navigates nowhere is worse than one that plainly cannot.
function comingCard(e){
  const when = e.has_file ? "Arrived early" : expectedOn(e.date);
  const chip = e.has_file ? "Here" : shortWhen(e.date);
  const art = artHtml({poster:e.poster, title:e.title, kind:"soon"});
  const go = e.item_id ? ` onclick="location.hash='#/item/${e.item_id}'" style="cursor:pointer"`
                       : ' style="cursor:default"';
  return `<div class="poster"${go}>
    <div class="artbox">${art}<div class="soonwhen${e.has_file?" here":""}" title="${esc(when)}">${esc(chip)}</div></div>
    <div class="meta">
      <div class="t" title="${esc(e.title||"")}">${esc(e.title||"")}</div>
      <div class="cleft soondetail">${esc(e.detail||"")}</div>
    </div>
  </div>`;
}

// The chip form: just the when, because the rail above it already says
// "Coming soon" and a badge 120px wide cannot spend 60 of them on the word
// "Expected" without truncating the part that carries the information. The
// full sentence stays in the tooltip.
function shortWhen(date){
  const full = expectedOn(date);
  return full.replace(/^Expected /, "").replace(/^expected /, "") || full;
}

// "Expected Friday" beats "expected 2026-08-01" for anything inside a week —
// that is the horizon a person actually holds in their head.
function expectedOn(date){
  if(!date) return "Expected";
  const d = new Date(date+"T00:00:00");
  if(isNaN(d)) return "Expected "+date;
  const days = Math.round((d - new Date(new Date().toDateString()))/86400000);
  if(days<=0) return "Expected today";
  if(days===1) return "Expected tomorrow";
  if(days<7) return "Expected "+d.toLocaleDateString(undefined,{weekday:"long"});
  return "Expected "+d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function homeGroup(){ try{ return localStorage.getItem("plurx_home_group")||"category"; }catch(e){ return "category"; } }
function setHomeGroup(v){ try{ localStorage.setItem("plurx_home_group",v); }catch(e){} viewHome(); }
function libCategory(lib){
  if(lib.kind==="movie"||lib.kind==="movies") return {key:"movie", name:"Movies"};
  if(lib.kind==="show"||lib.kind==="shows")   return {key:"show",  name:"TV Shows"};
  if(lib.kind==="book"||lib.kind==="books")   return {key:"book",  name:"Books"};
  if(lib.kind==="home")  return {key:"home",  name:"Home videos"};
  const k=lib.kind||"other";
  return {key:k, name:k.charAt(0).toUpperCase()+k.slice(1)};
}
function catOrder(key){ return key==="movie"?0:key==="show"?1:key==="book"?2:key==="home"?3:4; }
function groupToggleHtml(group){
  return `<div class="libbar" style="margin-top:22px"><div class="row">
    <span class="lbl">Group by</span>
    <select onchange="setHomeGroup(this.value)">${libOpt("category","Category",group)}${libOpt("share","Share name",group)}</select>
  </div></div>`;
}
// ---- the page-model seam --------------------------------------------------
// Every converted route splits in two: a loader that fetches and returns a
// plain JSON-shaped object (no DOM, no HTML), and a layout renderer that turns
// that object into markup. Shared behaviour wiring runs after, once, for every
// layout.
//
//   hash route ─▶ loadPage(route) ─▶ page model ─▶ LAYOUTS[cur].views.x(page)
//                    (fetches)      (plain data)      (body HTML)
//                                                          │
//                                                          ▼
//                                                  shared wiring
//
// Why the split rather than a chrome callback around the existing views: the
// views own the whole sequence today — install chrome, fetch, assemble, replace
// #main, wire. A registry wrapped around that either fetches twice or has each
// layout renderer reaching into route-specific globals. Route by route, Home
// first; activity, settings, search, auth and the player keep their existing
// renderers behind the layout chrome until a gate converts them.
//
// The hard rule for a conversion: it must not change the route's network
// behaviour. Same endpoints, same counts, same order, before and after — which
// is why loadHome() reproduces the original's awkward sequencing (one awaited
// batch per category, or one awaited request per share) rather than tidying it
// into a single Promise.all. Tidying it would be a performance change smuggled
// in under a refactor, and it would show up as a diff in the request log the
// gate compares.
async function loadHome(){
  // coming-soon is fetched with the rest but never allowed to fail the page:
  // it depends on another application, and the home screen must not.
  const [libs, hubs, soon] = await Promise.all([
    api("/libraries"), api("/hubs"),
    api("/coming-soon").catch(()=>({configured:false,entries:[]})),
  ]);
  const group=homeGroup();
  const sections=[];
  if(libs.length){
    if(group==="category"){
      // Bucket libraries by category, keeping Movies before TV before others.
      const order=[], byKey={};
      for(const lib of libs){ const c=libCategory(lib); if(!byKey[c.key]){ byKey[c.key]={cat:c,libs:[]}; order.push(c.key); } byKey[c.key].libs.push(lib); }
      order.sort((a,b)=>catOrder(a)-catOrder(b)||a.localeCompare(b));
      for(const key of order){
        const g=byKey[key];
        const pages=await Promise.all(g.libs.map(l=>api(`/libraries/${l.id}/items?limit=24&sort=added`)));
        sections.push({
          key,
          name:g.cat.name,
          items:[].concat(...pages.map(p=>p.items)).slice(0,24),
          total:pages.reduce((n,p)=>n+(p.total||0),0),
          // One share in this category → link straight to it; several → merged category page.
          href:g.libs.length===1 ? `#/library/${g.libs[0].id}` : `#/category/${encodeURIComponent(key)}`,
        });
      }
    } else {
      for(const lib of libs){
        const page=await api(`/libraries/${lib.id}/items?limit=24&sort=added`);
        sections.push({key:String(lib.id), name:lib.name, items:page.items, total:page.total, href:`#/library/${lib.id}`});
      }
    }
  }
  return {kind:"home", hubs, soon, libs, group, sections};
}
async function viewHome(){
  layoutChrome("home", `<div id="hubs"><div class="empty">Loading…</div></div>`);
  const page=await loadHome();
  document.getElementById("main").innerHTML=layoutView("home",page)||`<div class="empty">Nothing here yet.</div>`;
  wireRails();
  restoreScroll();
}
// ---- layout renderers -----------------------------------------------------
// Attached to the registry declared in the <head> script. A layout supplies a
// chrome() (the shell) and a views map (one body builder per converted route);
// anything it does not supply falls through to classic's, so a new layout is
// only as big as the parts it actually changes.
LAYOUTS.classic.chrome=classicChrome;
LAYOUTS.classic.views={
  home:classicHomeBody,
  item:classicItemBody,
  // Region-shaped rather than a single function: library is the app's one
  // incremental route (§3.2) and its regions are redrawn independently.
  library:{shell:classicLibraryShell, items:classicLibraryItems, count:classicLibraryCount},
};
// Resolve through the active layout, then classic. Two lookups rather than one
// because a layout that only redefines Home must still get the classic body for
// every route it has not converted — a missing renderer is normal, not an error.
function layoutChrome(active, inner){
  const L=LAYOUTS[layoutId()];
  return (L&&L.chrome?L.chrome:classicChrome)(active, inner);
}
function layoutView(name, page){
  const L=LAYOUTS[layoutId()];
  const fn=(L&&L.views&&L.views[name])||LAYOUTS.classic.views[name];
  return fn(page);
}
// Region resolution for incremental routes. Falls back per REGION, not per
// view: a layout that only wants its own shell (to move the A-Z rail mount, or
// to add a tab strip) inherits classic's items and count untouched, which is
// the difference between overriding a detail and reimplementing a route.
function layoutRegion(name, region, model){
  const L=LAYOUTS[layoutId()];
  const own=L&&L.views&&L.views[name];
  const fn=(own&&own[region])||LAYOUTS.classic.views[name][region];
  return fn(model);
}
// Classic's Home body — byte-for-byte the markup this app has always emitted.
// It is the zero-diff baseline every other layout is measured against, so this
// function changes only when the shipped app is meant to change.
function classicHomeBody(p){
  let html=installBannerHtml();
  // The first two rails pass watchCtx: those rows are about where you are in
  // something, so the card carries "23m left" / "watched Tuesday".
  if(p.hubs.continue_watching.length){ html+=rail("Continue watching", p.hubs.continue_watching.map(i=>card(i,true)).join("")); }
  if(p.hubs.next_up && p.hubs.next_up.length){ html+=rail("Next up", p.hubs.next_up.map(i=>card(i,true)).join("")); }
  if(p.hubs.recently_added.length){ html+=rail("Recently added", p.hubs.recently_added.map(i=>card(i)).join("")); }
  // Coming soon: what monarr expects. Absent entirely when nothing is paired
  // or monarr had nothing to say — an empty rail is worse than no rail.
  if(p.soon && p.soon.entries && p.soon.entries.length){
    html+=rail("Coming soon", p.soon.entries.map(comingCard).join(""));
  }
  if(p.libs.length){
    html+=groupToggleHtml(p.group);
    for(const s of p.sections){
      html+=`<h2 class="section">${esc(s.name)} <a class="muted" style="font-size:12px" href="${s.href}">· view all (${s.total})</a></h2>${grid(s.items)}`;
    }
  } else {
    html+=`<div class="empty">No libraries yet.${ME.is_admin?' Add one in <a href="#/settings">Settings</a>.':''}</div>`;
  }
  return html;
}
// One rail: a heading, and a strip with an arrow at each end.
//
// A helper rather than four copies of the markup, because the arrows need a
// wrapper the strip cannot provide — they are positioned against it, and the
// hover that reveals the scrollbar has to cover them too.
function rail(heading, cards){
  return `<h2 class="section">${heading}</h2>
    <div class="railbox">
      <button class="railarrow l" aria-label="Scroll left" onclick="railScroll(this,-1)">‹</button>
      <div class="rowscroll">${cards}</div>
      <button class="railarrow r" aria-label="Scroll right" onclick="railScroll(this,1)">›</button>
    </div>`;
}
// Just under a full view, so the card at the edge stays on screen and you keep
// your place. A whole-width jump loses the thing you were looking at, which is
// the complaint people have about carousels that page.
function railScroll(btn, dir){
  const strip=btn.parentElement.querySelector(".rowscroll"); if(!strip) return;
  strip.scrollBy({left:dir*Math.max(160,strip.clientWidth*0.85),behavior:"smooth"});
}
// Which arrows apply right now. Recomputed on scroll and on resize: a window
// that grows can turn a scrollable rail into one that fits, and an arrow that
// scrolls nothing is worse than no arrow.
function railSync(box){
  const strip=box.querySelector(".rowscroll"); if(!strip) return;

  // scrollLeft rarely lands exactly on the end, and testing for equality
  // leaves a live arrow at the last position of every rail.
  const max=strip.scrollWidth-strip.clientWidth;

// Called after any render that emits rails. Idempotent: a re-render replaces

// "" means "whatever suits this library" — home libraries are about when

// default: 300 cards is a slow first paint on a TV browser and an easy scroll
// on a desktop, and only the person looking at it knows which they are.
// Remembered per browser — someone who wants 20 at a time wants it every time.
const LIB_SIZES=[20,50,100,200];

  try{ const v=localStorage.getItem("plurx_perpage"); if(v==="all"||LIB_SIZES.includes(+v)) return v==="all"?"all":+v; }catch(e){}

// The list page you came from is not derivable from an item's own data (an item
// belongs to a library, but you may have reached it from a category or a
// search), so the router remembers it. Item→item hops keep it, which is what
// makes Movies → Show → Season → Episode still offer "Movies"; anything that
// leaves the drill-in (home, activity, settings) clears it.
let NAV_ORIGIN=null;

// Build one header for every drill-in page. `trail` is [{href,label},…] ending
// with the current page; back points at the level above it, so the button and
// the trail can never disagree about where "up" is.
function pageHead(trail,title){
  const parent=trail.length>1? trail[trail.length-2] : {href:"#/",label:"Home"};
  const back=`<a class="pgback" href="${parent.href}" aria-label="Back to ${esc(parent.label)}" title="Back to ${esc(parent.label)}">←</a>`;

// ---- library grids --------------------------------------------------------
// One page of items per request, and every page fetched.
//
// The server caps a page at 200 and should — a library is unbounded, and "send
// me everything at once" is a request that gets slower every time somebody adds
// a film. What was wrong was the client asking for one page, showing it, and
// saying "(first 200 of 321)" as though that were a state of affairs rather
// than a bug: 121 films with no way to reach them, no pagination, no scroll.
//
// The filter made it worse and quieter. Show → Unwatched filters what has been
// LOADED, so on a 321-item library it silently searched the first 200 — a film
// you own and have not watched simply not appearing in a list of films you have
// not watched, with nothing on screen to suggest the list was partial.
const LIB_PAGE=200;
// Which listing is current. Changing sort or filter, or leaving the page,
// abandons whatever pages are still in flight for the previous one — without
// this a slow second page from the old view lands in the new one.
let LIB_LOAD=0;

// Fetch every page of every listed library, handing each batch over as it
// arrives so the first screenful paints while the rest is still coming.
// Returns false if this load was superseded or failed.
async function eachItemPage(libIds, sort, gen, onBatch){
  // Summed across libraries as each one's first page reveals its size, so a
  // category's "of N" is right from its second batch rather than only at the
  // end.
  let total=0;
  for(const id of libIds){
    for(let offset=0;; offset+=LIB_PAGE){
      let page;
      try{
        page=await api(`/libraries/${id}/items?limit=${LIB_PAGE}&offset=${offset}&sort=${sort}`);
      }catch(e){
        if(LIB_LOAD===gen) toast(e.message);
        return false;
      }
      // Superseded, or the view is simply no longer on screen. Checking the
      // DOM as well as the token is what stops a big library fetching pages
      // into nothing after the user has navigated away.
      if(LIB_LOAD!==gen || !document.getElementById("libbody")) return false;
      const got=page.items||[];
      const libTotal=page.total||0;
      if(offset===0) total+=libTotal;
      onBatch(got, total);
      if(!got.length || offset+LIB_PAGE>=libTotal) break;
    }
  }
  return true;
}

// The shared body of both library views: a sort/filter bar, a grid that grows

// which libraries they read and what their controls re-invoke — and a grid that
// pages correctly in one of them and not the other is exactly the kind of
// difference nobody notices until a library gets big.
// Classic's library shell: the sort/filter/per-page bar, the page head, and
// the three region mounts. Rendered ONCE per entry — see the note on the
// piecewise contract above libraryView().
function classicLibraryShell(m){
  const sort=m.sort;
  const bar=`<div class="libbar">
    <div class="row">
      <span class="lbl">Sort</span>
      <select onchange="LIB_SORT=this.value;${m.reload}">
        ${libOpt("title","Title (A–Z)",sort)}${libOpt("added","Recently added",sort)}${libOpt("recorded","Date recorded",sort)}${libOpt("year","Year",sort)}${libOpt("resolution","Resolution",sort)}</select>

    `<div id="libpager"></div><div id="librail"></div>`;

// The items region. Re-rendered per arriving batch into #libbody, which is why

function classicLibraryCount(m){

      ? `${m.from+1}–${m.from+m.items.length} of ${m.shown}${m.shown!==m.total?` (${m.total} in all)`:""}`

// The shared body of both library views: a sort/filter bar, a grid that grows
// as pages land, and an A–Z rail.
//
// This is the app's one INCREMENTAL route, and that is why it uses the
// region-shaped seam (§3.2) rather than home's single body builder. Pages
// arrive in a loop and only the regions that changed are rewritten; a
// `body(model) → html` contract would replace the whole body on every batch
// and throw away the reader's scroll position each time a page landed, which
// is precisely the behaviour the piecewise draw exists to avoid.
async function libraryView(o){
  layoutChrome("home",`<div class="empty">Loading…</div>`);
  const gen=++LIB_LOAD;
  // Every entry here is a fresh listing — a different library, a new sort, a
  // new filter — and page 3 of a list you have just reordered is not a place.
  // Paging itself does not come through here; `libGoPage` redraws in place.
  LIB_PAGE_AT=0;
  const sort=o.sort;
  setOrigin(o.href,o.title);
  document.getElementById("main").innerHTML=
    layoutRegion("library","shell",{kind:"library",title:o.title,href:o.href,sort,reload:o.reload});

  let all=[], total=0;
  const draw=(done)=>{
    const body=document.getElementById("libbody"); if(!body) return;
    let items=all;
    // Sorting the merged set matters only for a category, whose shares are
    // each sorted on their own; a single library arrives in order.
    if(o.resort) items=o.resort(items.slice(), sort);
    // Filter before paging, always. The other order gives "50 films, of which
    // the unwatched ones" — which is why an unwatched film could be missing
    // from a list of unwatched films.
    if(LIB_FILTER!=="all") items=items.filter(it=>matchWatch(it,LIB_FILTER));
    const shown=items.length;
    LIB_VIEW={draw, done, shown};
    const pages=libPageCount(shown);
    if(LIB_PAGE_AT>=pages) LIB_PAGE_AT=pages-1;   // the filter shrank the list under us
    const from=LIB_PER==="all"?0:LIB_PAGE_AT*LIB_PER;
    const page=LIB_PER==="all"?items:items.slice(from, from+LIB_PER);

    // One model, three regions. `loaded` is the raw arrival count and `shown`
    // the count after filtering — the loading line reports the former because
    // it is describing progress, not results.
    const m={kind:"library", title:o.title, href:o.href, sort, filter:LIB_FILTER,
      per:LIB_PER, pageAt:LIB_PAGE_AT, pages, from, items:page,
      loaded:all.length, shown, total, done, reload:o.reload};
    body.innerHTML=layoutRegion("library","items",m);
    const pager=document.getElementById("libpager");
    if(pager) pager.innerHTML = done? pagerHtml(shown) : "";
    // The A–Z rail maps to what is on screen, so it describes this page. Its
    // mount is placed by the shell, so a layout that wants it on the right edge
    // moves the mount rather than reimplementing the rail.
    const rail=document.getElementById("librail");
    if(rail) rail.innerHTML=alphaRailHtml(page, sort);
    const count=document.getElementById("libcount");
    if(count) count.innerHTML=layoutRegion("library","count",m);
    tagAlpha(page, sort);
  };

  const complete=await eachItemPage(o.libIds, sort, gen, (batch, t)=>{
    all=all.concat(batch);
    total=t;
    draw(false);
  });
  if(LIB_LOAD!==gen) return;
  draw(complete);
  restoreScroll();
}

async function viewLibrary(id){
  const lib=(await libsCached()).find(l=>l.id==id);
  await libraryView({
    libIds:[id],
    sort:sortFor(lib),
    title:lib?lib.name:'Library',
    href:`#/library/${id}`,
    reload:`viewLibrary(${Number(id)})`,
  });
}
// "View all" for a category that spans more than one share: merge their items,
// then apply the same client-side sort/filter as a single library.
async function viewCategory(key){
  const libs=(await libsCached()).filter(l=>libCategory(l).key===key);
  if(!libs.length){
    layoutChrome("home",`<div class="empty">No libraries in this category.</div>`);
    return;
  }
  const cat=libCategory(libs[0]);
  await libraryView({
    libIds:libs.map(l=>l.id),
    sort:sortFor(libs[0]),
    title:cat.name,
    href:`#/category/${encodeURIComponent(key)}`,
    reload:`viewCategory(${esc(JSON.stringify(key))})`,
    resort:(items,sort)=>{
      // Each share is server-sorted; the merged set needs re-sorting for the
      // fields the client holds.
      if(sort==="title") items.sort((a,b)=>sortKey(a.title).localeCompare(sortKey(b.title)));
      else if(sort==="year") items.sort((a,b)=>(b.year||0)-(a.year||0));
      else if(sort==="resolution") items.sort((a,b)=>(b.resolution||0)-(a.resolution||0));
      else if(sort==="recorded") items.sort((a,b)=>(b.recorded_at||"").localeCompare(a.recorded_at||""));
      return items;
    },
  });
}
async function viewSearch(q){

  const head=pageHead([{href:"#/",label:"Home"},{label:`Search “${q}”`}],`Results for “${q}”`);

// Video-type badges from a file's probed specs. hdr_format carries the rich
// label (Dolby Vision profile etc.); DV gets its own gold badge.
// Use both edges so portrait metadata such as 1080×1920 stays 1080p,
// while a cropped 3840×1608 scope encode still identifies as 2160p.
function resLabel(w,h){ w=w||0; h=h||0;
  const short=w&&h?Math.min(w,h):(h||w), long=w&&h?Math.max(w,h):short;
  if(long>=3200||short>=1700) return '2160p';
  if(long>=2300||short>=1300) return '1440p';
  if(long>=1600||short>=900) return '1080p';
  if(long>=1100||short>=650) return '720p';
  if(long>=700||short>=400) return '480p';
  return short?short+'p':null; }

// (the spelled-out string lives in the Video detail row and the hover title).
function hdrChip(f){
  const s=f.hdr_format||"", cls=(f.hdr==='dolby_vision'?'dv':'hdr');
  if(f.hdr==='dolby_vision'||/dolby/i.test(s)){
    const m=/profile\s*(\d+)/i.exec(s);
    return {cls:'dv', text:m?('DV P'+m[1]):'DV', full:s||'Dolby Vision'};
  }
  if(s) return {cls, text:s, full:s};                    // HDR10+ / HDR10 / HLG are already short

// ---- dynamic range: source vs delivered vs rendered ------------------------
// MEDIA-BADGES-PLAN.md §2. The chip above answers "what is this file?"; during
// playback the viewer is asking "what am I getting?", and those two answers
// differ constantly — a DV disc remux tone-mapped to an SDR H.264 transcode
// still showed a full-colour "DV P7".
//
// Asked LIVE, not read from PLAY_CAPS: the probe's copy is the boot-time
// answer the server was given, and a window dragged from an HDR laptop panel
// to an SDR external monitor changes what is being rendered without changing
// one thing about the session. A browser too old for matchMedia answers no —
// which is exactly what the server was told, so the two stay consistent.
function displayIsHdr(){
  try{ return !!(window.matchMedia && window.matchMedia("(dynamic-range: high)").matches); }
  catch(e){ return false; }

  const bits=[ep.episode_number!=null?`Episode ${ep.episode_number}`:'',ep.air_date?fmtDate(ep.air_date):'',fmtDur(ep.runtime_ms)].filter(Boolean).map(m=>`<span>${esc(m)}</span>`);
  const epw=ep.watch, epdur=itemDurMs(ep);
  if(epw && !epw.watched && epw.position_ms>3000 && epdur) bits.push(`<span class="epleft">${esc(fmtDur(Math.max(0,epdur-epw.position_ms))+" left")}</span>`);
  if(ep.watch&&ep.watch.watched) bits.push('<span class="epwatched">✓ Watched</span>');
  return `<div class="eprow" onclick="location.hash='#/item/${ep.id}'">
    ${epThumb(ep)}
    <div style="min-width:0">
      <div class="eptitle">${ep.episode_number!=null?esc(ep.episode_number+". "):""}${esc(ep.title)}</div>
      <div class="epmeta">${bits.join("")}</div>
      ${ep.overview?`<div class="epov">${esc(ep.overview)}</div>`:""}
    </div>
    <button class="ghost sm epplay" title="Play" onclick="event.stopPropagation();AUTOPLAY=${ep.id};location.hash='#/item/${ep.id}'">▶</button>
  </div>`;
}
// Set by an episode-row play button so the target item auto-plays on arrival.
let AUTOPLAY=null;

// Item detail is a whole-body route (§3.2): one fetch, one model, one render.
// The file-to-item mapping is registered here rather than in a renderer — the
// player resolves it later regardless of which layout drew the page, so it is
// data, not presentation, and a layout that forgot to do it would break
// playback rather than just look different.
async function loadItem(id){
  const [d, libs]=await Promise.all([api(`/items/${id}`), libsCached()]);
  const it=d.item;
  // A pre-play track choice belongs to the item it was made on. Arriving at
  // another one starts from the server's defaults again — the alternative is a
  // French audio track chosen for one film quietly applying to the next.
  clearPrePlay();
  const lib=libs.find(l=>l.id===it.library_id);
  d.files.forEach(f=>ITEM_FOR_FILE[f.id]=Number(id));
  const files=d.files, children=d.children||[], ancestors=d.ancestors||[];
  const best=files[0], multi=files.length>1;
  const runtime=it.runtime_ms||(best&&best.duration_ms)||0;
  // Resume threshold in ONE place. Three seconds is "you actually started it"
  // rather than "you tapped it"; it appears on the button label, on the start-
  // over affordance and in the autoplay path, and a layout that rounded it
  // differently would offer to resume something the player restarts.
  const resume=it.watch&&it.watch.position_ms>3000&&!it.watch.watched?it.watch.position_ms:0;
  // The years a container spans, gathered from its seasons' air dates plus its
  // own. A show wears a range; a season wears one year; everything else wears
  // its year. Derived here because it is a fact about the item, not a choice
  // about how to draw it.
  let years=null;
  if(it.kind==='show'){
    const ys=children.map(c=>airYear(c.air_date)).filter(Boolean);
    if(it.year) ys.push(it.year);
    const y0=airYear(it.air_date); if(y0) ys.push(y0);
    if(ys.length) years={from:Math.min(...ys), to:Math.max(...ys)};
  } else if(it.kind==='season'){
    const y=it.year||airYear(it.air_date); if(y) years={from:y,to:y};
  } else if(it.year){ years={from:it.year,to:it.year}; }
  // What this page IS, so a body builder switches on a name instead of
  // re-deriving the same cascade of length checks. `folder` covers both the
  // empty folder and the mirrored one, distinguished by children.length.
  const shape = it.kind==='photo' ? "photo"
    : it.kind==='book' && files.length ? "book"
    : it.kind==='audiobook' && files.length ? "audiobook"
    : files.length ? "versions"
    : (children.length && children[0].kind==='episode') ? "episodes"
    : children.length ? "children"
    : it.kind==='folder' ? "folder" : "empty";
  const available=files.filter(f=>f.available);
  // A multipart audiobook owns one global timeline. Pick the part containing
  // the saved item position and hand the player a local offset inside it.
  let playable=available[0]||null, playStart=resume;
  // A book can carry several original formats. The server registry, not list
  // order or an extension guess, decides which file owns the built-in action.
  if(it.kind==='book') playable=available.find(canReadBookFile)||playable;
  if(it.kind==='audiobook' && available.length){
    playable=available[0];
    for(const f of available){
      const off=f.part_offset_ms||0, end=off+(f.duration_ms||0);
      if(resume>=off && (!end||resume<end)) { playable=f; break; }
      if(resume>=off) playable=f;
    }
    playStart=Math.max(0,resume-(playable.part_offset_ms||0));
  }
  return {kind:"item", id:Number(id), item:it, files, ancestors, children,
    editions:d.editions||[], lib,
    best, multi, runtime, resume, years, shape, reading:d.reading||null,
    // The one file a Play button should reach for, and the label for the
    // children grid — both were computed identically in two bodies.
    playable, playStart,
    childLabel: it.kind==='folder' ? 'Contents'
      : (children[0]&&children[0].kind==='season') ? 'Seasons' : 'Episodes',
    meta: playerMeta(it, ancestors),
    // Metadata editing is a home-library affair: elsewhere the provider agent
    // owns the fields and would overwrite a hand edit on the next refresh.
    editable: !!(ME&&ME.is_admin&&lib&&lib.kind==="home")};
}

// Player metadata for an audiobook carries the complete ordered part list.
// That lets the existing player keep one resume/progress timeline while it
// changes source files at part boundaries or when the scrubber crosses one.
function playbackMetaFor(p,file){
  const m=Object.assign({},p.meta||{});
  if(p.item.kind!=='audiobook') return m;
  m.audiobook=true;
  m.part_offset_ms=file.part_offset_ms||0;
  m.book_duration_ms=p.runtime||0;
  m.poster=p.item.poster||p.item.backdrop||null;
  m.book_parts=p.files.filter(f=>f.available).map((f,i)=>({
    id:f.id, title:f.filename||`Part ${i+1}`, duration_ms:f.duration_ms||0,
    part_offset_ms:f.part_offset_ms||0
  }));
  return m;
}
function playCall(p,file,startMs){
  return `play(${file.id},${esc(JSON.stringify(p.item.title))},${Math.max(0,startMs||0)},${file.duration_ms||0},${esc(JSON.stringify(playbackMetaFor(p,file)))})`;
}
function bookContentUrl(file){ return tok(`/api/v1/files/${file.id}/content`); }
function isEpubFile(file){ return !!(file&&/\.epub$/i.test(file.filename||"")); }
function readerAction(file,surface,mode){
  const capability=file&&file.reader&&file.reader[surface];
  if(capability&&typeof capability[mode]==="string") return capability[mode];
  // Compatibility with a server old enough not to advertise the registry.
  return isEpubFile(file)?"read":"open_in";
}
function canReadBookFile(file){ return !!(file&&file.available&&readerAction(file,"web","online")==="read"); }
function readerFile(p){ return p.files.find(canReadBookFile)||null; }
function readingLabel(p,file){
  const state=p.reading;
  if(!state||state.file_id!==file.id) return "Read";
  const pct=Math.max(0,Math.min(100,Math.round((state.progression||0)*100)));
  return state.completed?"Read again · finished":`Resume reading · ${pct}%`;
}
function bookActions(p){
  // Television surfaces deliberately have no reader or external-handler
  // action. A D-pad document reader is outside the product contract; phone,
  // tablet and desktop keep both the built-in action and the escape hatch.
  if(surfaceClass()==="tv") return "";
  const original=p.playable, readable=readerFile(p);
  if(!original) return `<div class="filemissing">⚠ No book file is currently available on the server.</div>`;
  const read=readable?`<button class="btnplay" onclick="location.hash='#/read/${p.id}/${readable.id}'">${esc(readingLabel(p,readable))}</button>`:"";
  return `<div class="actions">${read}
    <a class="ghost" href="${esc(bookContentUrl(original))}" target="_blank" rel="noopener">Open in…</a>
    <a class="ghost" href="${esc(bookContentUrl(original))}" download="${esc(original.filename||p.item.title)}">Download original</a></div>`;
}
function bookVersions(p){
  return p.files.map(v=>`<div class="version">${bookSpecBlock(v)}${!v.available&&ME.is_admin&&v.missing_path?`<div class="problem">${esc(v.missing_path)}</div>`:''}</div>`).join("");
}
function bookEditionSection(p){
  return p.editions&&p.editions.length
    ? `<h2 class="section" style="margin-top:18px">Other editions</h2>${grid(p.editions)}`
    : '';
}
function bookByline(it){
  return (it.kind==='book'||it.kind==='audiobook')&&it.author
    ? `<div class="muted" style="margin-top:4px">By ${esc(it.author)}</div>` : '';
}
function chapterList(p){
  const rows=[];
  for(const f of p.files){
    for(const c of (f.chapters||[])){
      const at=(f.part_offset_ms||0)+(c.start_ms||0);
      rows.push(`<button class="ghost sm" onclick='${playCall(p,f,c.start_ms||0)}'>${esc(c.title||`Chapter ${c.index+1}`)} <span class="muted">${esc(fmtDur(at))}</span></button>`);
    }
  }
  return rows.length?`<div class="chapters"><h2 class="section">Chapters</h2><div class="row" style="align-items:flex-start">${rows.join('')}</div></div>`:'';
}
async function viewItem(id){
  layoutChrome("home",`<div class="empty">Loading…</div>`);
  const page=await loadItem(id);
  document.getElementById("main").innerHTML=layoutView("item",page);
  restoreScroll();
  // One-click play from an episode list lands here and starts immediately.
  if(AUTOPLAY===Number(id)){
    AUTOPLAY=null;
    // Same file, same resume point, same metadata the buttons would have used:
    // the autoplay path is a third caller of the model, not a third derivation.
    const it=page.item, pf=page.playable;
    if(pf) play(pf.id, it.title, page.playStart, pf.duration_ms||0, playbackMetaFor(page,pf));
  }
}
// Classic's item body — byte-for-byte what this app has always emitted.
function classicItemBody(p){
  const d={files:p.files, ancestors:p.ancestors, children:p.children};
  const it=p.item, id=p.id, editable=p.editable;
  // Offered on every item, not only the ones that look broken: an admin who
  // wants a different poster than the one that landed has no other way to ask
  // for it short of refreshing the whole library.
  const artBtn = ME&&ME.is_admin
    ? ` <button class="ghost sm" title="Re-fetch this item's poster and backdrop" aria-label="Refresh artwork" onclick="refreshArtwork(${it.id},this)">⟳ Refresh artwork</button>`
    : '';

  // Breadcrumb trail: Home / <list you came from> / Show / Season / …, every
  // level clickable. The middle entry is what makes "back" return to the full
  // Movies page rather than dumping you at Home.
  const trail=[{href:"#/",label:"Home"}]
    .concat(NAV_ORIGIN?[{href:NAV_ORIGIN.href,label:NAV_ORIGIN.label}]:[])
    .concat((d.ancestors||[]).map(a=>({href:`#/item/${a.id}`,label:a.title})))
    .concat([{label:it.title}]);
  const crumbs=pageHead(trail);

  const best=p.best, multi=p.multi, runtime=p.runtime;
  const chips=[];
  if(it.recorded_at){ chips.push(`<span>${esc(fmtDate(it.recorded_at))}</span>`); }
  if(p.years){ const y=p.years; chips.push(`<span>${y.from}${y.to>y.from?'–'+y.to:''}</span>`); }
  if(runtime) chips.push(`<span>${fmtDur(runtime)}</span>`);
  if(it.kind) chips.push(`<span>${esc(it.kind)}</span>`);
  // A container has no watch flag of its own, so say what it's made of:
  // "3 of 10 watched" is the thing the mark-watched buttons below act on.
  if(it.rollup&&it.rollup.leaves){
    const r=it.rollup;
    chips.push(`<span>${r.watched===r.leaves?`all ${r.leaves} watched`:`${r.watched} of ${r.leaves} watched`}</span>`);
  }
  // Video badges show once: in the hero for a single version; per-version below
  // when there are several (so nothing is duplicated).
  const heroBadges = (best && !multi) ? specBadges(best) : "";

  let body="";
  if(p.shape==="photo"){
    // A photo is a picture, not a playback session: show it, and let a click
    // open the same full-screen view the grid uses.
    PHOTO_SET=[{id:it.id,title:it.title,recorded_at:it.recorded_at}];
    body+=`<div class="actions"><button class="btnplay" onclick="openLightbox(${it.id})">View full size</button></div>
      <img class="art" style="aspect-ratio:auto;max-height:60vh;width:auto;border-radius:var(--radius);cursor:zoom-in"
           src="${esc(photoUrl(it.id,'thumb'))}" alt="" onclick="openLightbox(${it.id})">`;
  } else if(p.shape==="book"){
    body+=bookActions(p)+bookVersions(p);
  } else if(p.shape==="audiobook"){
    const playable=p.playable, resume=p.resume, start=p.playStart;
    const watchBtn=watchControls(it);
    if(playable){
      body+=`<div class="actions">
        <button class="btnplay" onclick='${playCall(p,playable,start)}'>▶ ${resume?`Resume · ${fmtDur(resume)}`:'Play audiobook'}</button>
        ${resume?`<button class="ghost" onclick='${playCall(p,p.files.find(f=>f.available),0)}'>Start over</button>`:''}
        ${watchBtn}</div>`;
      const rem=resume?Math.max(0,runtime-resume):runtime, pend=endsAt(rem);
      if(rem) body+=`<div class="playinfo">${resume?fmtDur(rem)+" left":fmtDur(rem)}${pend?" · ends ~"+pend:""}</div>`;
    } else {
      body+=`<div class="filemissing">⚠ No audiobook part is currently available on the server.</div><div class="actions">${watchBtn}</div>`;
    }
    body+=d.files.map((v,i)=>{
      const miss=!v.available, part=d.files.length>1?`Part ${i+1}`:'Audiobook';
      const head=`<div class="vh"><span class="vbadges"><span class="vt">${esc(part)}</span>${specBadges(v)}${miss?'<span class="missbadge">missing</span>':''}</span>${!miss?`<button class="ghost sm" onclick='${playCall(p,v,0)}'>▶ Play</button>`:''}</div>`;
      return `<div class="version">${head}${specBlock(v)}${miss&&ME.is_admin&&v.missing_path?`<div class="problem">${esc(v.missing_path)}</div>`:''}${unprobedNote(v,it.id)}</div>`;
    }).join("");
    body+=chapterList(p);
  } else if(p.shape==="versions"){
    // Movie / episode: play the best *available* version + labeled specs.
    // The player's info panel is fed from here — the detail response is the only
    // place that carries the synopsis and the show/season ancestry together.
    const pmeta=p.meta, resume=p.resume;
    const watchBtn=watchControls(it);
    const playable=p.playable;
    if(playable){
      body+=`<div class="actions">
        <button class="btnplay" onclick='${playCall(p,playable,resume)}'>▶ ${resume?`Resume · ${fmtDur(resume)}`:'Play'}</button>
        ${resume?`<button class="ghost" onclick='${playCall(p,playable,0)}'>Start over</button>`:''}
        ${watchBtn}</div>`;
      const pdur=playable.duration_ms||runtime||0, prem=resume?Math.max(0,pdur-resume):pdur, pend=endsAt(prem);
      if(prem) body+=`<div class="playinfo">${resume?fmtDur(prem)+" left":fmtDur(prem)}${pend?" · ends ~"+pend:""}</div>`;
    } else {
      const p=best.missing_path;
      body+=`<div class="filemissing">⚠ This file is missing on the server, so it can’t be played — its library path may be unmounted, moved, or renamed${ME.is_admin&&p?`:<br><code>${esc(p)}</code>`:'.'}</div><div class="actions">${watchBtn}</div>`;
    }
    body+=d.files.map(v=>{
      const miss=!v.available;
      // Header (badges + per-version play) only when there are multiple versions
      // to tell apart, or when a file is missing. A single version is already
      // badged in the hero, so its block is just the spec detail.
      const header=(multi||miss)
        ? `<div class="vh"><span class="vbadges">${specBadges(v)||`<span class="vt">${esc(v.filename)}</span>`}${miss?'<span class="missbadge">missing</span>':''}</span>${(!miss&&multi)?`<button class="ghost sm" onclick='${playCall(p,v,resume)}'>▶ Play</button>`:''}</div>`
        : '';
      return `<div class="version">${header}${specBlock(v)}${miss&&ME.is_admin&&v.missing_path?`<div class="problem">${esc(v.missing_path)}</div>`:''}${unprobedNote(v,it.id)}</div>`;
    }).join("");
  } else if(p.shape==="episodes"){
    // Season: episodes as a list.
    const acts=watchControls(it);
    body+=`${acts?`<div class="actions">${acts}</div>`:''}
      <h2 class="section" style="margin:18px 0 0">${d.children.length} episode${d.children.length>1?'s':''}</h2>
      <div class="eplist">${d.children.map(episodeRow).join("")}</div>`;
  } else if(p.shape==="children"){
    // Show, season, or a mirrored folder: children as a grid.
    const label = it.kind==='folder'? 'Contents'
                : p.childLabel==='Seasons'? 'Seasons' : 'Episodes';
    const acts=watchControls(it);
    body+=`${acts?`<div class="actions">${acts}</div>`:''}
      <h2 class="section" style="margin:18px 0 12px">${label}</h2>${grid(d.children)}`;
  } else if(p.shape==="folder"){
    body+=`<div class="empty">This folder is empty.</div>`;
  }
  body+=bookEditionSection(p);

  const bg=it.backdrop?`<div class="herobg" style="background-image:url(${esc(tok(it.backdrop))})"></div>`:'';
  return `<div class="hero">${bg}
    <div class="dwrap">
      <div class="poster">${artHtml(it)}</div>
      <div class="dhead">${crumbs}<h1>${esc(it.title)}${editable?` <button class="ghost sm" title="Edit details" aria-label="Edit details" onclick='openEdit(${esc(JSON.stringify(it))})'>✎ Edit</button>`:''}${artBtn}</h1>${bookByline(it)}
        <div class="chips">${chips.join("")}</div>
        ${(it.tags&&it.tags.length)?`<div class="chips">${it.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:''}
        ${heroBadges?`<div class="vbadges" style="margin-top:10px">${heroBadges}</div>`:''}
        ${it.overview?`<p class="overview">${esc(it.overview)}</p>`:''}
        ${body}</div>
    </div></div>`;
}

// ---- edit details (home libraries, admin) ---------------------------------
// The DB is the only truth for home items — there is no agent to overwrite
// what you type here, and plurx never writes back to the .nfo (or anything
// else) in your media folder.
let EDIT_TAGS=[];
function openEdit(it){
  EDIT_TAGS=(it.tags||[]).slice();
  const wrap=document.createElement("div");
  wrap.className="editwrap"; wrap.id="editwrap";
  wrap.innerHTML=`<div class="editcard">
    <h2 class="section" style="margin-top:0">Edit details</h2>
    <label for="ed-title">Title</label>
    <input id="ed-title" value="${esc(it.title||"")}">
    <label for="ed-date">Date recorded</label>
    <input id="ed-date" type="date" value="${esc((it.recorded_at||"").slice(0,10))}">
    <label for="ed-over">Description</label>
    <textarea id="ed-over" rows="3">${esc(it.overview||"")}</textarea>
    <label for="ed-tag">Tags</label>
    <div class="chips-in" id="ed-chips" onclick="document.getElementById(\'ed-tag\').focus()"></div>
    <div class="hint">Enter or comma adds a tag; tags are searchable.</div>
    <div class="err" id="ed-err"></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="ghost" onclick="closeEdit()">Cancel</button>
      <button onclick="saveEdit(${it.id})">Save</button>
    </div></div>`;
  wrap.addEventListener("click",e=>{ if(e.target===wrap) closeEdit(); });
  document.body.appendChild(wrap);
  paintTagChips();
  const t=document.getElementById("ed-title"); if(t) t.focus();
}
function paintTagChips(){
  const box=document.getElementById("ed-chips"); if(!box) return;
  box.innerHTML=EDIT_TAGS.map((t,i)=>`<span class="chip">${esc(t)}<b onclick="dropTag(${i})" title="Remove">×</b></span>`).join("")
    +`<input id="ed-tag" placeholder="${EDIT_TAGS.length?"":"beach, kids"}" onkeydown="tagKey(event)">`;
}
function dropTag(i){ EDIT_TAGS.splice(i,1); paintTagChips(); document.getElementById("ed-tag").focus(); }
function tagKey(e){
  const el=e.target;
  if(e.key==="Enter"||e.key===","){
    e.preventDefault();
    const v=(el.value||"").trim();
    if(v && !EDIT_TAGS.some(t=>t.toLowerCase()===v.toLowerCase())) EDIT_TAGS.push(v);
    el.value=""; paintTagChips(); document.getElementById("ed-tag").focus();
  } else if(e.key==="Backspace" && !el.value && EDIT_TAGS.length){
    EDIT_TAGS.pop(); paintTagChips(); document.getElementById("ed-tag").focus();
  }
}
function closeEdit(){ const w=document.getElementById("editwrap"); if(w) w.remove(); }
async function saveEdit(id){
  const title=(document.getElementById("ed-title").value||"").trim();
  const date=(document.getElementById("ed-date").value||"").trim();
  const over=(document.getElementById("ed-over").value||"").trim();
  const pending=(document.getElementById("ed-tag").value||"").trim();
  const tags=EDIT_TAGS.slice();
  // Don't lose a tag someone typed but didn't commit with Enter.
  if(pending && !tags.some(t=>t.toLowerCase()===pending.toLowerCase())) tags.push(pending);
  const err=document.getElementById("ed-err"); if(err) err.textContent="";
  // null clears a field; an empty date/description means "clear it".
  const body={ title, recorded_at: date||null, overview: over||null, tags };
  try{
    await api(`/items/${id}`,{method:"PATCH",body});
    closeEdit(); toast("Saved"); viewItem(id);
  }catch(e){ if(err) err.textContent=e.message; }
}

// The mark-watched control(s) for a detail page. A movie or episode is binary,
// so it gets one button that flips it. A show, season, or folder is not: it can
// sit at seven of ten, where "Mark watched" and "Mark unwatched" both do
// something real and a single toggle would have to lie about one of them. So a
// container gets whichever of the two actually changes anything.
function watchControls(it){
  const r=it.rollup;
  if(r){
    if(!r.leaves) return "";   // nothing playable underneath — nothing to mark
    const noun = it.kind==='show'?'series' : it.kind==='season'?'season' : 'folder';
    const btns=[];
    if(r.watched<r.leaves) btns.push(`<button class="ghost sm" onclick="setWatched(${it.id},1)">Mark ${noun} watched</button>`);
    if(r.watched>0)        btns.push(`<button class="ghost sm" onclick="setWatched(${it.id},0)">Mark ${noun} unwatched</button>`);
    return btns.join("");
  }
  const w=!!(it.watch&&it.watch.watched);
  return `<button class="ghost sm" onclick="setWatched(${it.id},${w?0:1})">${w?'Mark unwatched':'Mark watched'}</button>`;
}

// `watched` is the state to move to, not the state you're in — the container
// buttons name an outcome rather than a flip, and one meaning for the argument
// is worth more than a shorter call site.
async function setWatched(id, watched){
  try{
    const r=await api(`/items/${id}/${watched?'scrobble':'unscrobble'}`,{method:"POST"});
    // The count matters on a series: it's the difference between "did that do
    // anything?" and "26 episodes marked watched".
    const n=(r&&r.updated)||0;
    toast(n>1 ? `${n} items marked ${watched?'watched':'unwatched'}`
              : (watched?"Marked watched":"Marked unwatched"));
    viewItem(id);
  }catch(e){ toast(e.message); }
}

// ---- player ---------------------------------------------------------------
// Three playback methods (server /decision picks one):
//  direct_play → native <video>, client-side seek/resume
//  remux       → progressive fMP4 from ffmpeg, server fast-seek for resume

  // one-second stats panel follows the new truth. That is how "DV P7 → HDR10"
  // sat beside "Dynamic range: SDR" on a tone-mapped Dexter episode: both
  // surfaces call dynamicRangeBadge() with the same arguments, but only the
  // panel repaints. renderPlayerInfo() is otherwise painted once, at session
  // open — before the route is chosen and before the forced-burn override.
  // MEDIA-BADGES-PLAN.md requires the chip and the panel row to agree.
  if(t===PLAYER) renderPlayerInfo();

// Tell the server we are finished with a stream. Without this the encoder
// lives on for the idle timeout plus a reaper tick — over a minute of a
// hardware slot held for nobody — every time a player closes or replaces its
// stream. `keepalive` is what makes it survive the page going away, and is
// also why the route authenticates by session id rather than by header.
function releaseSession(sessionId){
  if(!sessionId) return;
  try{
    fetch(API+`/hls/${sessionId}`,{method:"DELETE",keepalive:true,
      headers:TOKEN?{"authorization":"Bearer "+TOKEN}:{}}).catch(()=>{});
  }catch(e){}

// ---- runtime playback capabilities ----------------------------------------
// What THIS browser can actually decode, probed once. Sent on every decision so
// the server direct-plays/remuxes whatever the browser supports and only
// transcodes what it genuinely can't — Safari keeps HEVC, everyone keeps their
// own audio codecs, etc. HDR is claimed only on an HDR display (else the server
// tone-maps, since HDR-on-SDR looks washed-out).

// ---- HEVC decode tiers -----------------------------------------------------
// The one question this file used to ask about HEVC was `hvc1.1.6.L93.B0` —
// Main, 8-bit, level 3.1 (720p-class) — and a yes was reported to the server as
// blanket `hevc` support with no height at all. That is probe-low/claim-high,
// the exact shape that already cost this project a black picture with working
// sound once (see MSE_VIDEO's comment further down for the transport half of
// the same story): a 4K 10-bit Main10 stream handed to a decoder that only does
// 8-bit at 720p is accepted by every layer above the decoder and rendered as
// nothing. No error fires, so nothing falls back.
//
// So ask the two questions the server actually needs answered — how many
// pixels, and how many bits — instead of one question that answers neither.
// The profile field in the codec string is the ONLY place a decoder's answer
// distinguishes bit depth (`hvc1.1.6.*` is Main/8-bit, `hvc1.2.4.*` is Main10),
// and the level field is the height axis: L93 = 3.1 (720p), L120 = 4.0 (1080p),
// L153 = 5.1 (4K). The 8-bit rungs above L93 are here so an ordinary 8-bit-only
// decoder still reports the 1080p/4K ceiling it really has rather than being
// pinned at 720p by the lowest rung we happen to ask about first.
//
// width/height/bitrate/framerate are only read by the MediaCapabilities path
// (they are required members of its VideoConfiguration); the isTypeSupported
// fallback has nowhere to put them.
const HEVC_TIERS=[
  {codec:"hvc1.1.6.L93.B0",  depth:8,  width:1280, height:720,  bitrate:4000000},
  {codec:"hvc1.1.6.L120.B0", depth:8,  width:1920, height:1080, bitrate:8000000},
  {codec:"hvc1.1.6.L153.B0", depth:8,  width:3840, height:2160, bitrate:25000000},
  {codec:"hvc1.2.4.L120.B0", depth:10, width:1920, height:1080, bitrate:10000000},
  {codec:"hvc1.2.4.L153.B0", depth:10, width:3840, height:2160, bitrate:30000000},
];
// Fold a per-tier pass/fail table into the three facts that go on the wire.
//
// `maxheight` is deliberately the height at which EVERY claimed HEVC profile
// decodes, not the height of the tallest rung that passed. The server's
// `max_height` is one codec-agnostic number (plurx-core/src/playback: a file
// taller than it is transcoded, whatever its codec), so a client that decodes
// 8-bit at 4K but Main10 only at 1080p cannot say "2160" and "hevc10" in the
// same breath — that pair is precisely the black-screen claim. Taking the min
// costs such a device a needless transcode of 4K 8-bit HEVC; over-claiming
// costs it the picture. `pqPassed` is null when the probe had no way to ask
// about the transfer function (isTypeSupported has no such axis).
function hevcTierSummary(passed, pqPassed){
  let depth8=0, depth10=0, pq=0;
  HEVC_TIERS.forEach((t,i)=>{
    if(!passed||!passed[i]) return;
    if(t.depth>=10){
      if(t.height>depth10) depth10=t.height;
      if(pqPassed&&pqPassed[i]&&t.height>pq) pq=t.height;
    }else if(t.height>depth8) depth8=t.height;
  });
  const maxheight=(depth8&&depth10)?Math.min(depth8,depth10):(depth8||depth10);
  return {depth8, depth10, maxheight, pq10:!!(maxheight&&pq>=maxheight)};
}
// The fallback probe: `canPlayType`/`isTypeSupported`, one call per rung. Both
// are synchronous and neither knows anything about transfer functions, so this
// path can establish depth and height and never HDR presentation.
function hevcTiersSync(can, mse){
  return HEVC_TIERS.map(t=>{
    const type=`video/mp4; codecs="${t.codec}"`;
    return can(type)||mse(type);
  });
}
// The real probe. `navigator.mediaCapabilities.decodingInfo` is the only API
// that takes a resolution, a bitrate and a transfer function and answers about
// the combination — which is what a decoder ceiling actually is. Each Main10
// rung is asked twice: once plain (does the decoder do 10-bit at this size?)
// and once with `transferFunction:'pq'` (can this machine PRESENT HDR10 at that
// size?). Those differ: a 10-bit SDR anime rip decodes on hardware that cannot
// put PQ on the wire, and folding the two together would either lose that file
// to a transcode or claim HDR the display never gets.
//
// Returns null when the API is missing or every single query threw, which is
// the caller's signal to use the synchronous ladder instead. It is async, and
// that is why CAPS_Q is rebuilt rather than computed once: see PLAY_CAPS_READY.
async function hevcTiersMediaCapabilities(){
  let mc=null;
  try{ mc=navigator&&navigator.mediaCapabilities; }catch(e){}
  if(!mc||typeof mc.decodingInfo!=="function") return null;
  let answered=false;
  // `media-source` first because segmented remuxes are the demanding path, then
  // `file` for progressive direct play — the same OR the sync probe does across
  // isTypeSupported/canPlayType, so the two paths cannot disagree by shape.
  const ask=async(t,pq)=>{
    const video={contentType:`video/mp4; codecs="${t.codec}"`, width:t.width,
      height:t.height, bitrate:t.bitrate, framerate:24};
    if(pq) video.transferFunction="pq";
    for(const type of ["media-source","file"]){
      try{
        const r=await mc.decodingInfo({type, video});
        answered=true;
        if(r&&r.supported) return true;
      }catch(e){}
    }
    return false;
  };
  const passed=[], pqPassed=[];
  for(const t of HEVC_TIERS){
    const ok=await ask(t,false);
    passed.push(ok);
    pqPassed.push(!!(ok&&t.depth>=10&&await ask(t,true)));
  }
  return answered?{passed, pqPassed}:null;
}
function buildPlayCaps(hevc){
  let v=null; try{ v=document.createElement("video"); }catch(e){}
  const can=t=>{ try{ return !!v && v.canPlayType(t)!==""; }catch(e){ return false; } };
  const mse=t=>{ try{ return !!(window.MediaSource && MediaSource.isTypeSupported(t)); }catch(e){ return false; } };
  const vc=["h264"];
  // `hevc` still means "there is an HEVC decoder" and is what the server matches
  // against ffprobe's codec_name; `hevc10` is the bit-depth half of the same
  // answer, named to match the MSE_VIDEO ladder key so the two vocabularies stay
  // one vocabulary. Sending 8-bit-only as bare `hevc` is what stops a Main10
  // source from being direct-played to a decoder that would render it black.
  if(hevc.depth8||hevc.depth10) vc.push("hevc");
  if(hevc.depth10) vc.push("hevc10");
  if(can('video/mp4; codecs="av01.0.05M.08"')||mse('video/mp4; codecs="av01.0.05M.08"')) vc.push("av1");
  if(can('video/webm; codecs="vp9"')||mse('video/webm; codecs="vp9"')) vc.push("vp9");
  if(can('video/webm; codecs="vp8"')) vc.push("vp8");
  const ac=["aac","mp3"];
  if(can('audio/mp4; codecs="opus"')||mse('audio/webm; codecs="opus"')) ac.push("opus");

  // it rides in CAPS_Q and there is no way to re-tell it mid-session. The badge
  // re-asks per render via the same displayIsHdr(); see its comment.
  const hdrDisplay=displayIsHdr();
  const hdr=hdrDisplay && (vc.includes("hevc")||vc.includes("av1"));
  // Dolby Vision, asked separately from HDR because the two answers differ
  // and the difference is a whole class of failure. A DV disc remux usually
  // carries an HDR10-compatible base layer, so a browser that reports HDR
  // looks able to take it — and Chrome then refuses the track outright
  // (MEDIA_ERR_DECODE), because what reaches its decoder is flagged Dolby
  // Vision whatever the base layer looks like. Safari decodes those. Without
  // this probe the server could not tell the two apart, remuxed to both, and
  // the error-fallback quietly re-encoded a 4K disc remux down to the Auto
  // rung on Chrome. `dvh1`/`dvhe` are the DV sample entries; a browser that
  // claims either can take the stream as it stands.
  const dvCan=p=>[`dvh1.${p}`,`dvhe.${p}`]
