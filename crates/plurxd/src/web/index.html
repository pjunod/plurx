     rest — smaller, and without the dark wash that would fight the artwork on
     every card in the grid. */
  @media (hover:none){
    [data-layout=catalog] .poster .artbox::before{
      opacity:.6;font-size:11px;
      background:radial-gradient(circle at 50% 50%, var(--accent) 0 13px, transparent 13px)}
  }
  /* The shipped .poster lift is a transform on every hover; catalog keeps it but
     swaps the border flash for an inset accent outline so
     the card edge does not appear to grow by a pixel. */
  [data-layout=catalog] .poster:hover{border-color:color-mix(in srgb, var(--accent) 60%, var(--line))}
  [data-layout=catalog] .poster .artbox{overflow:hidden;border-radius:max(0px, calc(var(--radius) - 5px)) max(0px, calc(var(--radius) - 5px)) 0 0}

  /* ---- home: section headers and hub rows ------------------------------- */
  /* Catalog hub titles use quiet sentence case with the "see all" on the right,
     not classic's uppercase rules-and-borders. Flex here is compatible with
     .ressection, which already relies on it. */
  [data-layout=catalog] h2.section{
    display:flex;align-items:center;gap:10px;
    font-size:15px;font-weight:650;letter-spacing:0;text-transform:none;
    border-top:0;padding-top:0;margin:24px 2px 12px}
  [data-layout=catalog] h2.section:first-child{margin-top:6px}
  [data-layout=catalog] .px-seeall{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    font:500 12px var(--font);letter-spacing:0;text-transform:none;color:var(--muted)}
  [data-layout=catalog] .px-seeall::after{content:"›";font-size:15px;line-height:1}
  [data-layout=catalog] .px-seeall:hover{color:var(--accent)}
  /* The count rides the link rather than the heading: "Movies · See all 210"
     puts the number next to the thing that acts on it. */
  [data-layout=catalog] .px-seeall .px-n{font:11px var(--font-mono);opacity:.85}
  [data-layout=catalog] .libbar{margin-top:26px}

  /* ---- classic bodies rendered inside catalog chrome -----------------------
     Library, category, search, item, activity and settings are not converted
     at G2: they emit their shipped markup into catalog's #main. The rules below
     exist only where a shipped rule assumed classic's page box. */
  /* Both bleed to the edge with negative margins sized for classic's
     `main{padding:22px 20px}`. Under catalog's 24/28 they would leave a 8px lip
     on one side and overhang on the other. */
  [data-layout=catalog] .hero{margin:-24px -28px 22px}
  [data-layout=catalog] .getapp{margin:0 0 18px}
  /* The A–Z scrubber is fixed to the viewport edge, which is correct here too;
     it only needs to clear catalog's wider gutter. */
  [data-layout=catalog] .azbar{right:8px}

  /* ---- bottom tabs (declared for every surface, shown only when narrow) -- */
  [data-layout=catalog] .px-tabs{display:none}
  [data-layout=catalog] .px-sheetx{display:none}

  /* =========================== narrow / phone ==============================
     899px is not a guess: surfaceClass() calls a coarse pointer under 900px
     "mobile", so every device the app treats as a phone is inside this query —
     and a mouse-driven window dragged this narrow gets the same shape, which
     is the point of doing it in CSS. The sidebar is not hidden; it is
     re-flowed into the phone header the app already ships (wordmark + controls
     on row 1, search full width below), so the search box stays in exactly one
     place in the DOM and #q is never duplicated. */
  @media (max-width:899px){
    [data-layout=catalog] .px-shell{display:block}
    [data-layout=catalog] .px-side{
      position:sticky;top:0;width:auto;height:auto;flex:none;
      flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;
      padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);
      /* Opaque, and deliberately NOT backdrop-filtered like the shipped phone
         header: a filter on this element would make it the containing block
         for its own position:fixed descendants, and the library sheet below is
         one — it would render as a 140px flap under the header instead of a
         full-screen panel. The mix of two opaque tokens is already opaque, so
         the blur bought nothing anyway. */
      background:color-mix(in srgb, var(--bg) 88%, var(--panel))}
    /* display:contents dissolves the two band wrappers so their children
       become items of the header row directly — the alternative is a second
       markup path for phones, which is how layouts start forking. */
    [data-layout=catalog] .px-head,[data-layout=catalog] .px-foot{display:contents}
    [data-layout=catalog] .px-brand{order:1;padding:0}
    [data-layout=catalog] .px-ctl{order:2;margin-left:auto;gap:6px}
    [data-layout=catalog] .px-user{order:3;flex:none}
    [data-layout=catalog] .px-user .pname{display:none}     /* matches the shipped phone header */
    [data-layout=catalog] .px-head .search{order:4;flex-basis:100%}
    [data-layout=catalog] .px-foot .activity{order:5;flex-basis:100%}
    [data-layout=catalog] .px-foot .amenu{top:calc(100% + 6px);bottom:auto;right:0;left:auto}
    /* The library list becomes a full-screen sheet behind the Libraries tab.
       Full screen rather than a drawer so there is no "outside" to mis-tap,
       and it closes itself on navigation because routing rebuilds the chrome. */
    [data-layout=catalog] .px-scroll{display:none}
    [data-layout=catalog] .px-shell.px-open .px-scroll{
      display:block;position:fixed;inset:0;z-index:40;
      background:var(--bg);padding:14px 14px 90px;overflow-y:auto}
    [data-layout=catalog] .px-shell.px-open .px-sheetx{
      display:inline-flex;align-items:center;justify-content:center;
      position:fixed;top:10px;right:12px;z-index:41;width:38px;height:38px;font-size:17px}
    [data-layout=catalog] main#main{padding:16px 14px 96px}
    [data-layout=catalog] .hero{margin:-16px -14px 18px}
    /* Bottom tabs. Fixed, safe-area aware — an iPhone home indicator otherwise
       sits on top of the Activity tab. */
    [data-layout=catalog] .px-tabs{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;
      background:color-mix(in srgb, var(--panel) 92%, var(--bg));
      border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom,0px)}
    [data-layout=catalog] .px-tab{
      flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:8px 4px 7px;border:0;background:transparent;
      color:var(--muted);font:500 10.5px/1.2 var(--font);
      border-top:2px solid transparent;margin-top:-1px}
    [data-layout=catalog] .px-tab .px-ico{width:20px;height:20px}
    /* Same rule as the sidebar: tint plus an edge plus weight, never colour
       alone. */
    [data-layout=catalog] .px-tab.on{color:var(--text);font-weight:700;border-top-color:var(--accent);
      background:color-mix(in srgb, var(--accent) 12%, transparent)}
    [data-layout=catalog] .px-tab.on .px-ico{color:var(--accent)}
    /* pollActivity() toggles html.working when the server is busy. A dot on
       the Activity tab carries that fact to a phone, where the status pill has
       been pushed off the header by the search box. */
    [data-layout=catalog] .px-tabs .px-tab[data-tab=activity]{position:relative}
    /* Both attributes live on <html>, so this is one compound selector, not a
       descendant pair — the usual mistake here renders nothing at all. */
    html.working[data-layout=catalog] .px-tabs .px-tab[data-tab=activity]::after{
      content:"";position:absolute;top:7px;right:calc(50% - 15px);
      width:7px;height:7px;border-radius:50%;background:var(--accent)}
    [data-layout=catalog] .azbar{right:2px}
  }

  /* ============================== television ===============================
     Same test surfaceClass() uses for "tv": no pointing device at all, or a
     coarse hoverless pointer on a very wide screen (a remote driving a
     cursor). The sidebar collapses to an icon rail and expands over the
     content on focus — it is fixed, not sticky, so expanding never reflows the
     grid behind it (a D-pad user watching every poster jump sideways as focus
     enters the rail is the failure this prevents). Labels stay in the DOM
     while collapsed, clipped rather than display:none, so a screen reader and
     the focus order still see them. */
  @media (pointer:none), (hover:none) and (pointer:coarse) and (min-width:1280px){
    [data-layout=catalog] .px-side{position:fixed;left:0;top:0;bottom:0;height:100dvh;width:76px;flex-basis:76px}
    [data-layout=catalog] main#main{margin-left:76px;padding:30px 40px 90px;font-size:16px}
    [data-layout=catalog] .px-side .px-lbl,
    [data-layout=catalog] .px-side .px-n,
    [data-layout=catalog] .px-side .px-sec,
    [data-layout=catalog] .px-side .pname,
    [data-layout=catalog] .px-side .activity,
    [data-layout=catalog] .px-head .search{
      opacity:0;width:0;height:0;overflow:hidden;padding:0;margin:0;border:0;flex-basis:0}
    [data-layout=catalog] .px-brand .logo{font-size:0}
    [data-layout=catalog] .px-brand .logo::first-letter{font-size:24px}
    [data-layout=catalog] .px-nav a{justify-content:center;gap:0}
    [data-layout=catalog] .px-side:hover,[data-layout=catalog] .px-side:focus-within{
      width:264px;flex-basis:264px;box-shadow:0 0 40px color-mix(in srgb, var(--bg) 70%, transparent)}
    [data-layout=catalog] .px-side:hover .px-lbl,[data-layout=catalog] .px-side:focus-within .px-lbl,
    [data-layout=catalog] .px-side:hover .px-n,[data-layout=catalog] .px-side:focus-within .px-n,
    [data-layout=catalog] .px-side:hover .px-sec,[data-layout=catalog] .px-side:focus-within .px-sec,
    [data-layout=catalog] .px-side:hover .pname,[data-layout=catalog] .px-side:focus-within .pname,
    [data-layout=catalog] .px-side:hover .activity,[data-layout=catalog] .px-side:focus-within .activity,
    [data-layout=catalog] .px-side:hover .search,[data-layout=catalog] .px-side:focus-within .search{
      opacity:1;width:auto;height:auto;flex-basis:auto;overflow:visible}
    [data-layout=catalog] .px-side:hover .px-sec,[data-layout=catalog] .px-side:focus-within .px-sec{padding:16px 13px 6px}
    [data-layout=catalog] .px-side:hover .search,[data-layout=catalog] .px-side:focus-within .search{padding:8px 11px;border-width:1px}
    [data-layout=catalog] .px-side:hover .activity,[data-layout=catalog] .px-side:focus-within .activity{padding:6px 10px}
    [data-layout=catalog] .px-side:hover .px-nav a,[data-layout=catalog] .px-side:focus-within .px-nav a{justify-content:flex-start;gap:11px}
    [data-layout=catalog] .px-side:hover .px-brand .logo,[data-layout=catalog] .px-side:focus-within .px-brand .logo{font-size:21px}
    /* …and put the initial back to the size of the rest of the wordmark, or an
       expanded rail spells the product name with an oversized first letter. */
    [data-layout=catalog] .px-side:hover .px-brand .logo::first-letter,
    [data-layout=catalog] .px-side:focus-within .px-brand .logo::first-letter{font-size:inherit}
    /* 10-foot focus: a 2px hairline is invisible from a sofa. */
    [data-layout=catalog] .px-nav a:focus-visible,[data-layout=catalog] .poster:focus-visible{outline-width:4px;outline-offset:4px}
  }

  /* ============================ reduced motion =============================
     Every animation in this layout is decorative and every one of them is
     opt-in here. The information each carries is present without it: the play
     circle still appears (it just does not fade), the rail still expands (it
     just does not slide), the hover lift still marks the card under the
     pointer (via the border tint, which is not animated). */
  @media (prefers-reduced-motion: no-preference){
    [data-layout=catalog] .poster .artbox::before{transition:opacity .14s ease-out}
    [data-layout=catalog] .px-nav a{transition:background-color .12s ease-out, color .12s ease-out}
    [data-layout=catalog] .px-side{transition:width .16s ease-out, flex-basis .16s ease-out}
    [data-layout=catalog] .px-seeall{transition:color .12s ease-out}
  }
  /* The shipped .poster rule animates transform unconditionally; catalog cannot
     edit it, so it opts out here for anyone who asked for less motion. The
     hover state stays legible because the border tint above does not move. */
  @media (prefers-reduced-motion: reduce){
    [data-layout=catalog] .poster{transition:none}
    [data-layout=catalog] .poster:hover{transform:none}
  }

  /* ============================ forced colours =============================
     In forced-colors mode the UA replaces author colours wholesale, which
     silently erases anything that carried meaning as a tint: the selected
     library, the focus ring, the unwatched flag and the resume bar. System
     keywords are the sanctioned way to put them back, so each one is restated
     against Highlight / CanvasText here. */
  @media (forced-colors: active){
    [data-layout=catalog] .px-side{border-right:1px solid CanvasText}
    /* The idle rows reserve their marker with a transparent left border, and
       forced colours repaints EVERY border in the element's forced colour —
       so without this each row grows a LinkText bar and the selected row stops
       being the one with a bar. Canvas paints the gutter as background. */
    [data-layout=catalog] .px-nav a{border-left-color:Canvas}
    /* forced-color-adjust:none on the selected row is not an opt-out of forced
       colours — every colour it then uses is a system keyword. It is there to
       stop Chromium painting its text "backplate" (a Canvas-coloured rectangle
       it puts behind text sitting on an author background) which lands black
       ink on a black plate on top of Highlight and erases the label of the one
       row the user is on. */
    [data-layout=catalog] .px-nav a.on,
    [data-layout=catalog] .px-tab.on{forced-color-adjust:none}
    [data-layout=catalog] .px-nav a.on{background:Highlight;color:HighlightText;border-left-color:Highlight}
    [data-layout=catalog] .px-nav a.on .px-ico,
    [data-layout=catalog] .px-nav a.on .px-n{color:HighlightText}
    [data-layout=catalog] .px-tab.on{background:Highlight;color:HighlightText;border-top-color:Highlight}
    [data-layout=catalog] .px-tab.on .px-ico{color:HighlightText}
    [data-layout=catalog] .px-nav a:focus-visible,
    [data-layout=catalog] .px-tab:focus-visible,
    [data-layout=catalog] .px-seeall:focus-visible,
    [data-layout=catalog] .px-sheetx:focus-visible,
    [data-layout=catalog] .poster:focus-visible,
    [data-layout=catalog] .px-side button:focus-visible,
    [data-layout=catalog] .px-side input:focus-visible{outline:3px solid Highlight;outline-offset:2px}
    /* The flag is a clip-path so the shape survives; only its fill needs
       restating. forced-color-adjust:none keeps the UA from flattening it back
       to Canvas, which would leave an invisible triangle. The :not() chain is
       repeated verbatim rather than simplified: the rule that paints the flag
       carries four class selectors of specificity, and a shorter selector here
       loses to it and leaves the triangle in the theme accent. */
    [data-layout=catalog] .poster.unw .artbox::after{
      background:Highlight;forced-color-adjust:none}
    /* Progress is a 5px bar whose fill and track both collapse to the same
       system colour otherwise — i.e. "how far in am I" disappears entirely. */
    [data-layout=catalog] .poster .prog{background:Canvas;border:1px solid CanvasText;forced-color-adjust:none}
    [data-layout=catalog] .poster .prog>i{background:Highlight;box-shadow:none;forced-color-adjust:none}
    /* The play circle is drawn with a radial gradient, which forced colours
       does not repaint — it would render as a grey blob over the art. Drop the
       fill and keep the glyph, which is text and is repainted correctly. */
    [data-layout=catalog] .poster .artbox::before{background:none;color:CanvasText}
    [data-layout=catalog] .px-tabs{border-top:1px solid CanvasText}
    [data-layout=catalog] .px-foot{border-top:1px solid CanvasText}
  }
  /* ====================== catalog layout — G2b additions =======================
     Appended to the existing catalog block. Nothing here restates a G2 rule; the
     G2 rules this file depends on being ABOVE it are:
       [data-layout=catalog] .hero{margin:-24px -28px 22px}   (and the narrow one)
       [data-layout=catalog] h2.section{...}                  (flex, sentence case)
       [data-layout=catalog] .azbar{right:8px}
       the focus-ring list, the reduced-motion block, the forced-colours block
     Same rules as before, same reasons:
       - structural colour is a token mix over --panel/--bg/--accent/--line,
         never a literal hex. The catalogue is now ten themes × light/dark
         (classic, terminal, noirr, amber, giallo, silver, void, vhs, paper,
         tide) and one hardcoded dark hex is a black box on five of them.
       - every transition is inside prefers-reduced-motion:no-preference, and
         nothing is only legible while it moves.
       - every selector is scoped under [data-layout=catalog].
     ========================================================================= */

  /* Screen-reader-only text. Used by the disabled tabs/toggle so the reason
     they are dead is not a mouse-only tooltip. */
  [data-layout=catalog] .px-sr{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

  /* ---- library: Library / Collections / Categories ----------------------- */
  [data-layout=catalog] .px-ltabs{
    display:flex;align-items:flex-end;gap:4px;margin:2px 2px 14px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  [data-layout=catalog] .px-ltab{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 12px 9px;margin-bottom:-1px;
    font:600 13.5px/1.2 var(--font);color:var(--muted);
    border-bottom:2px solid transparent}
  [data-layout=catalog] a.px-ltab:hover{color:var(--text)}
  /* Selected: an underline AND a weight AND a colour. Three signals, because
     the underline is the only one that survives forced colours and the only
     one that reads for someone who cannot separate accent from muted. */
  [data-layout=catalog] .px-ltab.on{
    color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
  /* Not ready. Grey is the least of it: the cursor says no, the "soon" chip
     says why in one word, title= and .px-sr say why in a sentence, and the
     element is a <span> so there is nothing to press or tab to. */
  [data-layout=catalog] .px-ltab.off,
  [data-layout=catalog] .px-vt.off{
    color:color-mix(in srgb, var(--muted) 62%, transparent);
    cursor:not-allowed;user-select:none}
  [data-layout=catalog] .px-soon{
    font:700 9px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
    padding:3px 5px;border-radius:999px;
    color:var(--muted);
    background:color-mix(in srgb, var(--panel2) 70%, transparent);
    border:1px dashed color-mix(in srgb, var(--muted) 45%, transparent)}

  /* ---- library: toolbar -------------------------------------------------- */
  /* The shipped .libbar is a space-between row; catalog keeps that and only
     tightens it against the tab strip above, which now carries the page
     identity the bar used to have to. */
  [data-layout=catalog] .px-libbar{margin-top:0}
  [data-layout=catalog] .px-libbar .row{gap:8px;flex-wrap:wrap;align-items:center}
  [data-layout=catalog] .px-libbar #libcount{white-space:nowrap}
  /* Grid / List. A segmented control in shape, but only one segment is a
     state and the other is disabled — see .px-ltab.off above. */
  [data-layout=catalog] .px-view{
    display:inline-flex;align-items:center;gap:2px;margin-right:6px;
    padding:2px;border:1px solid var(--line);
    border-radius:max(0px, calc(var(--radius) - 4px));
    background:color-mix(in srgb, var(--panel2) 55%, transparent)}
  [data-layout=catalog] .px-vt{
    display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
    font:600 12.5px/1 var(--font);color:var(--muted);
    border-radius:max(0px, calc(var(--radius) - 6px))}
  [data-layout=catalog] .px-vt.on{
    color:var(--text);background:var(--panel);
    box-shadow:0 1px 2px color-mix(in srgb, var(--bg) 55%, transparent)}
  [data-layout=catalog] .px-vt .px-soon{font-size:8.5px;padding:2px 4px}

  /* ---- library: the grid row and the A–Z scrubber ------------------------
     #libbody and #librail are siblings the SHELL owns. The loader only ever
     rewrites their innerHTML, so the row — and the document scroll position
     with it — survives every batch. #libbody is not itself a scroller: the
     window is, exactly as in classic, which is what keeps the shipped
     scroll-spy (one window listener) and alphaJump()'s scrollIntoView working
     and keeps the pager reachable. */
  [data-layout=catalog] .px-libwrap{display:block}
  [data-layout=catalog] .px-libwrap>#libbody{min-width:0}
  /* An empty rail is a real state (a non-title sort, or a library whose titles
     all start with the same letter) and an empty flex item still eats the gap. */
  [data-layout=catalog] .px-librail:empty{display:none}
  @media (min-width:900px){
    [data-layout=catalog] .px-libwrap{display:flex;align-items:flex-start;gap:12px}
    [data-layout=catalog] .px-libwrap>#libbody{flex:1 1 auto}
    /* The rail moves out of the viewport gutter and onto the right edge of the
       CONTENT — catalog's own idiom, and it stops the scrubber from floating over
       the pager and the page footer on a short library. Sticky rather than
       fixed so it rides with the grid it describes. */
    [data-layout=catalog] .px-librail{
      flex:0 0 auto;position:sticky;top:14px;z-index:15}
    [data-layout=catalog] .px-librail .azbar{
      position:static;transform:none;top:auto;right:auto;
      background:color-mix(in srgb, var(--panel) 78%, var(--bg));
      border:1px solid var(--line);
      border-radius:max(0px, calc(var(--radius) - 2px))}
  }
  /* The active letter ships as white-on-accent, which is a guess about the
     accent that is wrong on the light themes whose accent is pale. --btn-ink
     is the token that means "text on an accent fill" and every theme sets it. */

  /* ---- detail: the backdrop hero ---------------------------------------- */
  /* The backdrop fills the hero rather than the shipped fixed 360px. Both were
     tried: a fixed height overflows the hero on a page with little metadata
     (the scrim's last stop is opaque --bg, so it painted over the first version
     card — caught in the harness, not reasoned about), and clipping it with
     overflow:hidden leaves a hard edge where the picture stops. Tying it to
     the hero's own box means the fade always lands exactly on the seam.
     .herobg keeps its shipped mask, opacity and the noirr grain overlay. */
  [data-layout=catalog] .px-hero .herobg{height:100%}
  /* The scrim. A --bg mix, so on Paper-light or Silver-light it LIGHTENS the
     bottom of the backdrop into the page instead of painting the black band
     that the 2026-07-22 regression shipped. Three stops: a flat wash for
     legibility, the fade into the page, and a soft left edge under the poster. */
  [data-layout=catalog] .px-scrim{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--bg) 18%, transparent) 0%,
        color-mix(in srgb, var(--bg) 62%, transparent) 58%,
        var(--bg) 100%),
      linear-gradient(90deg,
        color-mix(in srgb, var(--bg) 45%, transparent) 0%,
        transparent 62%)}
  /* No backdrop, no scrim: a gradient to --bg over --bg is invisible work, and
     on the themes with a --shadow token it is a faint band for no reason. */
  [data-layout=catalog] .px-hero.px-noart .px-scrim{display:none}
  [data-layout=catalog] .px-hero .dwrap{
    grid-template-columns:212px minmax(0,1fr);gap:32px;
    padding:38px 28px 26px;max-width:1240px;margin:0}
  [data-layout=catalog] .px-hero .poster{border-radius:var(--radius)}
  /* Oversized title, and it has to survive a 68-character one: anywhere-break
     rather than a clip, because a detail page that hides half its own title is
     worse than a page with a three-line heading. */
  [data-layout=catalog] .px-hero .dhead h1{
    font-size:clamp(26px,3.6vw,44px);line-height:1.04;letter-spacing:-.02em;
    font-weight:800;margin:6px 0 12px;overflow-wrap:anywhere}
  /* The kicker catalog puts above the title: the item's kind, which classic
     carries as a pill in the middle of the metadata row. */
  [data-layout=catalog] .px-kick{
    font:700 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin:14px 0 0}
  /* Metadata as pills. The shipped .chips is a plain flex row of bare spans;
     catalog gives each span the .pill treatment without touching the markup. */
  [data-layout=catalog] .px-hero .chips>span{
    padding:3px 11px;border-radius:999px;
    border:1px solid color-mix(in srgb, var(--line) 90%, var(--text));
    background:color-mix(in srgb, var(--panel) 60%, transparent);
    color:var(--text)}
  [data-layout=catalog] .px-hero .chips{margin-top:2px}
  [data-layout=catalog] .px-hero .px-tags{margin-top:8px}
  [data-layout=catalog] .px-hero .px-tags>span{
    color:var(--muted);background:transparent;
    border-style:dashed}
  [data-layout=catalog] .px-hero .overview{max-width:64ch}
  /* The Play lockup: a pill, weightier, with a bloom in the theme accent (the
     "amber Play" of §3.2 is the Amber theme's --accent — no colour is spelled
     out here, so every theme gets its own). */
  [data-layout=catalog] .px-hero .btnplay{
    border-radius:999px;padding:12px 26px;font-weight:750;font-size:15.5px;
    box-shadow:0 6px 20px color-mix(in srgb, var(--accent) 34%, transparent)}
  [data-layout=catalog] .px-hero .actions .ghost{border-radius:999px;padding:10px 18px}
  [data-layout=catalog] .px-hero .actions{margin-top:22px}
  /* Admin buttons ride inside the h1, which is now up to 44px — button{font:
     inherit} would blow them up to match. .sm sets 13px; this pins the line
     box so a two-button h1 does not become three lines tall. */
  [data-layout=catalog] .px-hero .dhead h1 .ghost.sm{
    font-size:13px;line-height:1.2;vertical-align:middle;font-weight:600}

  /* ---- detail: everything below the hero -------------------------------- */
  /* Version cards, episode lists and children grids get the full width here
     rather than the hero's text column. */
  [data-layout=catalog] .px-detail{max-width:1240px;margin:0;padding:0 8px 8px}
  [data-layout=catalog] .px-detail>h2.section:first-child{margin-top:4px}
  [data-layout=catalog] .px-detail .version{
    border-radius:max(0px, calc(var(--radius) - 1px));
    background:color-mix(in srgb, var(--panel) 88%, var(--bg))}
  [data-layout=catalog] .px-detail .eplist{border-radius:max(0px, calc(var(--radius) - 1px))}
  [data-layout=catalog] .px-photo{display:block;margin:4px 0 0}

  /* ============================ television =================================
     Same test surfaceClass() uses for "tv" — this is the query the G2 block
     already uses, repeated verbatim so the two can never disagree.

     No admin surfaces on a television (proposal rule, and the plan's TV mockup
     caption: "no admin anywhere"). This is a media query and not a JS branch
     for the same reason the rest of the layout is: it is a statement about the
     surface, it updates live, and it cannot go stale behind a render.
     display:none also takes each of these out of the tab order, so a D-pad
     cannot land on one — which `visibility` or an opacity trick would not.

     What is hidden: the sidebar Settings row, the Settings entry in the
     account popover, the Edit / Refresh-artwork buttons on a detail page, the
     Reanalyze button in an unprobed-file note, and the "Add one in Settings"
     link in the empty-home state. What is NOT hidden, and is flagged in
     NOTES §5: the admin-only file PATHS that classicItemBody and .problem
     print. Those are disclosures rather than affordances, they are gated on
     ME.is_admin inside shipped helpers, and blanking them from CSS would
     leave the sentence around them dangling. */
  @media (pointer:none), (hover:none) and (pointer:coarse) and (min-width:1280px){
    [data-layout=catalog] .px-nav a[href="#/settings"],
    [data-layout=catalog] .px-admin,
    [data-layout=catalog] .unprobed button,
    [data-layout=catalog] .empty a[href="#/settings"],
    /* Couples to profileMenuHtml()'s shipped markup: the Settings entry is the
       one button in the popover whose handler routes to #/settings. */
    [data-layout=catalog] #profilemenu button[onclick*="#/settings"]{display:none}
    /* The tab strip and the toolbar are readable from a sofa or they are not
       there at all. */
    [data-layout=catalog] .px-ltab{font-size:16px;padding:10px 16px 11px}
    [data-layout=catalog] .px-vt{font-size:15px}
    [data-layout=catalog] .px-hero .dwrap{padding:44px 40px 30px}
  }

  /* ============================= narrow / phone ============================ */
  @media (max-width:899px){
    [data-layout=catalog] .px-ltabs{
      margin:0 0 12px;gap:2px;flex-wrap:nowrap;overflow-x:auto;
      scrollbar-width:none;-webkit-overflow-scrolling:touch}
    [data-layout=catalog] .px-ltabs::-webkit-scrollbar{display:none}
    [data-layout=catalog] .px-ltab{white-space:nowrap;padding:9px 10px}
    [data-layout=catalog] .px-libbar .row{gap:6px}
    /* Below 900px the rail is the shipped viewport-edge scrubber again (the
       min-width:900px block above simply does not apply), so the row is a
       plain block and #librail contributes nothing to the flow. */
    [data-layout=catalog] .px-hero .dwrap{padding:22px 14px 18px;gap:18px}
    [data-layout=catalog] .px-hero .dhead h1{font-size:clamp(22px,6.4vw,30px)}
    [data-layout=catalog] .px-hero .btnplay{width:100%;justify-content:center}
    [data-layout=catalog] .px-detail{padding:0}
  }
  @media (max-width:720px){
    /* .dwrap collapses to one column at 720px (shipped), and a 212px poster
       above a 30px title reads as a card, not a hero. */
    [data-layout=catalog] .px-hero .dwrap{grid-template-columns:minmax(0,1fr)}
    [data-layout=catalog] .px-hero .poster{max-width:148px}
  }

  /* ============================ reduced motion ============================= */
  @media (prefers-reduced-motion: no-preference){
    [data-layout=catalog] .px-ltab{transition:color .12s ease-out, border-color .12s ease-out}
    [data-layout=catalog] .px-hero .btnplay{transition:box-shadow .14s ease-out, transform .12s ease-out}
    [data-layout=catalog] .px-hero .btnplay:hover{transform:translateY(-1px)}
  }

  /* ============================ forced colours =============================
     The three new pieces of state that are carried by colour and would
     otherwise vanish: the selected tab, the disabled controls, and the
     scrubber's in-flow frame. */
  @media (forced-colors: active){
    [data-layout=catalog] .px-ltabs{border-bottom:1px solid CanvasText}
    [data-layout=catalog] .px-ltab.on{border-bottom:3px solid Highlight;color:CanvasText}
    /* GrayText is the system colour that MEANS disabled, and the only one a
       forced-colours user's own palette maps to that idea. */
    [data-layout=catalog] .px-ltab.off,
    [data-layout=catalog] .px-vt.off{color:GrayText}
    [data-layout=catalog] .px-soon{border:1px dashed GrayText;color:GrayText}
    [data-layout=catalog] .px-view{border:1px solid CanvasText}
    [data-layout=catalog] .px-vt.on{border:1px solid Highlight}
    [data-layout=catalog] .px-librail .azbar{border:1px solid CanvasText;background:Canvas}
    [data-layout=catalog] .azbar button.active{
      background:Highlight;color:HighlightText;forced-color-adjust:none}
    [data-layout=catalog] .azbar .off{color:GrayText}
    /* The backdrop is a background IMAGE, which forced colours does not
       repaint — it survives as the one author-coloured thing on the page, with
       an oversized title sitting on it. Chromium's text backplate keeps that
       legible, but a backplate behind every line of a synopsis is not reading;
       the picture is decoration, so it goes, and the scrim with it. */
    [data-layout=catalog] .px-hero .herobg,
    [data-layout=catalog] .px-scrim{display:none}
    /* The pills are not decoration — without a border they collapse into a
       run-on line of words. */
    [data-layout=catalog] .px-hero .chips>span{border:1px solid CanvasText;background:Canvas}
    [data-layout=catalog] .px-kick{color:CanvasText}
  }
/* ========================== theater layout =================================
   G4. Paste into the stylesheet block of crates/plurxd/src/web/index.html,
   after the catalog layout block and just before the closing style tag. (Written
   without the literal closing tag on purpose: inside a raw-text element that
   sequence ends the stylesheet, and the rest of this file then renders as a
   wall of visible prose. Found the hard way in this gate's harness.)

   Structure only. EVERY selector in this file is scoped under
   [data-layout=theater] — one unscoped rule reaches classic, and
   `scripts/ui-baseline --check` now sweeps every registered layout and
   compares a structural golden, so an unscoped rule fails the gate on a
   layout it was never meant to touch.

   Colour rule, without exception: structural surfaces are token mixes
   (color-mix over --bg / --panel / --panel2 / --accent), never literal hex.
   On 2026-07-22 a set of hardcoded dark hexes shipped and every light theme
   grew black boxes. Ten themes x light/dark ship today and a full-bleed hero
   with a scrim is the single highest-risk surface in the app for that bug:
   the mockup's `linear-gradient(180deg,rgba(0,0,0,.55),transparent)` top bar
   is exactly the defect, and it is NOT reproduced here. Every scrim stop
   below is a --bg mix, so the wash darkens on a dark palette and lightens on
   a light one, and on Void (--bg #000) it degrades to a true-black fade
   rather than a grey band. The only literal colours in this file are inside
   @media (forced-colors: active), where system keywords are the required
   spelling.

   Shape is decided by width/pointer media queries rather than by
   surfaceClass() in JS: theaterChrome() emits the desktop nav AND the phone
   pill bar on every surface and CSS decides which is real, so a dragged
   window changes shape live with no re-render and no stale JS branch.

   Two geometry variables carry the whole layout so the fixed bar, the
   negative hero margins and the sticky chip bar can never disagree:
     --th-top   the height of the fixed top bar
     --th-gut   the page gutter
   ========================================================================= */

[data-layout=theater]{--th-top:64px; --th-gut:34px; --th-lead:74px}

/* ---- shell ------------------------------------------------------------ */
/* main is the full width of the window: this layout has no measure. The lead
   padding clears the fixed bar; the art-fronted views cancel it with a
   matching negative margin (the pattern classic's .hero already uses), which
   is what lets a hero run under a translucent bar with no JS. */
[data-layout=theater] main#main{
  max-width:none; margin:0; padding:var(--th-lead) var(--th-gut) 96px}

/* The bar. Fixed, not sticky: sticky would occupy layout space at the top of
   the document and push the hero down, and the whole point of theater is that
   the art starts at pixel row 0 and the chrome floats on it.

   The background is a two-stop --bg mix rather than a solid: over artwork it
   reads as a fade (the "translucent top bar that fades over art" of plan
   §3.3), over a plain page it reads as the page. backdrop-filter is a
   progressive enhancement — where it is unsupported the mix alone still
   separates the bar from the art. */
[data-layout=theater] .th-top{
  position:fixed; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:center; gap:20px;
  min-height:var(--th-top); padding:0 var(--th-gut);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--bg) 78%, transparent) 0%,
    color-mix(in srgb, var(--bg) 52%, transparent) 55%,
    transparent 100%);
  -webkit-backdrop-filter:blur(10px) saturate(1.05);
  backdrop-filter:blur(10px) saturate(1.05)}
/* Every label in the bar may sit on arbitrary artwork, so each one carries a
   halo in the PAGE background colour. On a dark theme that is a dark glow
   behind light text; on a light theme a light glow behind dark text. Same
   declaration, opposite effect, which is the only way one rule survives ten
   palettes. */
[data-layout=theater] .th-top .logo,
[data-layout=theater] .th-nav a,
[data-layout=theater] .th-top .pname{
  text-shadow:0 1px 10px color-mix(in srgb, var(--bg) 82%, transparent)}
[data-layout=theater] .th-top .logo{font-size:19px}
[data-layout=theater] .th-nav{display:flex; gap:4px; align-items:center}
[data-layout=theater] .th-nav a{
  padding:7px 12px; border-radius:999px; color:var(--muted); font-weight:600; font-size:14px;
  letter-spacing:.01em}
[data-layout=theater] .th-nav a:hover{
  color:var(--text); background:color-mix(in srgb, var(--text) 10%, transparent)}
/* Current page: tint AND weight AND a dot. Never colour alone — Silver's
   accent is near-white at night and near-black by day, so a colour-only
   "current" state is invisible in one of its two modes. */
[data-layout=theater] .th-nav a.on{
  color:var(--text); font-weight:700;
  background:color-mix(in srgb, var(--accent) 20%, transparent)}
[data-layout=theater] .th-nav a.on::after{
  content:""; display:block; width:5px; height:5px; margin:3px auto -6px;
  border-radius:50%; background:var(--accent)}
[data-layout=theater] .th-top .spacer{flex:1}
[data-layout=theater] .th-top .search{
  max-width:210px;
  background:color-mix(in srgb, var(--panel2) 72%, transparent);
  border-color:color-mix(in srgb, var(--text) 20%, transparent)}
[data-layout=theater] .th-ctl{display:flex; align-items:center; gap:14px}
[data-layout=theater] .th-pop{position:relative}
/* The shipped .activity pill is display:none until pollActivity() fills it;
   in the bar it needs to sit on art like everything else. */
[data-layout=theater] .th-top .activity{
  background:color-mix(in srgb, var(--panel2) 78%, transparent)}
/* The bar's ghost buttons are on art too — the shipped --panel2 fill is
   opaque and reads as a chip, which is what we want; only the border needs
   lifting so it does not vanish on a bright frame. */
[data-layout=theater] .th-ctl .ghost{
  border-color:color-mix(in srgb, var(--text) 18%, var(--line))}

/* The phone pill nav. Present in the DOM on every surface, revealed by the
   narrow query below — see the shell comment. */
[data-layout=theater] .th-pills{display:none}

/* ---- focus, on a bar that floats over artwork ------------------------------
   This is theater's one genuinely new accessibility problem and it does not
   inherit a solution: a 2px accent outline on a translucent bar is drawn
   against whatever frame of whatever film happens to be behind it, so its
   contrast is not a property of the theme at all.

   The fix is three channels, none of them colour on its own:
     1. an accent outline (the shipped focus vocabulary),
     2. a HALO in --bg painted behind the outline via box-shadow, which gives
        the ring a known-contrast plate no matter what the art is doing, and
     3. an opaque backing plate on the focused control itself, so its LABEL is
        legible and not only its border.
   Because the halo and the plate are --bg mixes they invert with the palette,
   and because they are geometry (a ring and a filled box) they survive
   forced-colors, where the block at the end of this file restates them. */
[data-layout=theater] .th-top a:focus-visible,
[data-layout=theater] .th-top button:focus-visible,
[data-layout=theater] .th-top input:focus-visible,
[data-layout=theater] .th-pills a:focus-visible,
[data-layout=theater] .th-hero a:focus-visible,
[data-layout=theater] .th-hero button:focus-visible,
[data-layout=theater] .th-chips select:focus-visible,
[data-layout=theater] .poster:focus-visible{
  outline:3px solid var(--accent); outline-offset:2px;
  box-shadow:0 0 0 6px color-mix(in srgb, var(--bg) 88%, transparent)}
[data-layout=theater] .th-top a:focus-visible,
[data-layout=theater] .th-pills a:focus-visible{
  color:var(--text);
  background:color-mix(in srgb, var(--bg) 92%, var(--panel))}
[data-layout=theater] .poster:focus-visible{border-color:var(--accent)}
/* Focus inside the hero lands on art, so the hero's own buttons get the plate
   treatment too — a ghost button over a bright frame is otherwise a ring
   round an unreadable word. */
[data-layout=theater] .th-hero .ghost:focus-visible{
  background:color-mix(in srgb, var(--bg) 90%, var(--panel)); color:var(--text)}

/* ---- the hero ------------------------------------------------------------
   Full-bleed: the negative margin cancels main's gutter and lead padding so
   the art reaches all four edges of the window and passes under the bar.

   The element carries a token gradient as its OWN background and the backdrop
   image rides in a child on top of it. That is the artwork budget from the
   gate, in two parts: the wash is painted at first paint from tokens (nothing
   to load, so the hero is never a blank rectangle while a JPEG decodes), and
   an item with no backdrop at all — most home media, and every photo library
   — simply keeps the wash instead of falling back to a blown-up poster,
   which would be a second full-resolution fetch AND a 2:3 image stretched to
   21:9. */
[data-layout=theater] .th-hero{
  position:relative; overflow:hidden;
  margin:calc(-1 * var(--th-lead)) calc(-1 * var(--th-gut)) 0;
  padding:calc(var(--th-top) + 26px) var(--th-gut) 34px;
  min-height:64vh; display:flex; align-items:flex-end;
  background:
    radial-gradient(120% 120% at 78% 12%,
      color-mix(in srgb, var(--accent) 26%, transparent) 0%, transparent 62%),
    linear-gradient(150deg,
      color-mix(in srgb, var(--accent2, var(--accent)) 16%, var(--panel)) 0%,
      var(--bg) 72%)}
/* The backdrop. background-image on a div, exactly like the shipped .herobg,
   so it is ONE request for ONE URL and the item's own detail page reuses the
   same cached bytes when you click through. The mask lets the wash beneath
   show at the bottom edge, which is what makes the picture dissolve into the
   page rather than stop at a line. */
/* The mask stops are written against --text rather than the shipped .herobg's
   #000 / rgba(0,0,0,.55). A mask uses ONLY the alpha channel, so the colour is
   arbitrary and both spellings render identically — but "no literal hex
   outside forced-colors" is a grep, not a judgement call, and a hex that is
   provably harmless still has to be explained to every future reader and every
   future gate. --text is opaque in all twenty palettes, so it is a free
   opaque carrier. */
[data-layout=theater] .th-hero .th-bg{
  position:absolute; inset:0; background-size:cover; background-position:center 22%;
  -webkit-mask-image:linear-gradient(180deg, var(--text) 0%, var(--text) 46%,
    color-mix(in srgb, var(--text) 55%, transparent) 78%, transparent 100%);
  mask-image:linear-gradient(180deg, var(--text) 0%, var(--text) 46%,
    color-mix(in srgb, var(--text) 55%, transparent) 78%, transparent 100%)}
/* The scrim. Two gradients, every stop a --bg mix:
     vertical   dims under the bar, clears the middle so the picture is
                actually visible, then closes to solid --bg at the floor so
                the hero and the rails below it are one surface;
     horizontal backs the text column on the left and releases by 78%.
   On a light theme these mixes LIGHTEN, so the text column sits on a pale
   wash and --text stays legible; on Void every stop resolves toward #000 and
   the fade is true black. That is the whole reason there is not a single
   rgba(0,0,0,x) in this file. */
[data-layout=theater] .th-hero .th-scrim{
  position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--bg) 62%, transparent) 0%,
      color-mix(in srgb, var(--bg) 14%, transparent) 34%,
      color-mix(in srgb, var(--bg) 84%, transparent) 80%,
      var(--bg) 100%),
    linear-gradient(90deg,
      color-mix(in srgb, var(--bg) 88%, transparent) 0%,
      color-mix(in srgb, var(--bg) 46%, transparent) 46%,
      transparent 78%)}
[data-layout=theater] .th-hero .th-fg{position:relative; z-index:1; max-width:min(660px,88%)}
/* Uppercase micro-label, the rail heading's voice at hero scale. */
[data-layout=theater] .th-kick{
  font:700 11px/1 var(--font-mono); letter-spacing:.22em; text-transform:uppercase;
  color:var(--accent); margin:0 0 12px}
[data-layout=theater] .th-title{
  margin:0 0 10px; font-weight:800; line-height:1.02; letter-spacing:-.015em;
  font-size:clamp(30px, 4.4vw, 54px);
  /* Very long titles are a named degenerate state: three lines, then ellipsis,
     so a 90-character home-video filename cannot push the buttons off screen. */
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  text-shadow:0 2px 22px color-mix(in srgb, var(--bg) 78%, transparent)}
[data-layout=theater] .th-meta{
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  font:13px var(--font-mono); color:var(--muted);
  text-shadow:0 1px 10px color-mix(in srgb, var(--bg) 80%, transparent)}
[data-layout=theater] .th-desc{
  color:var(--prose); margin:12px 0 0; max-width:56ch;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  text-shadow:0 1px 10px color-mix(in srgb, var(--bg) 80%, transparent)}
[data-layout=theater] .th-hero .actions{margin:20px 0 0}
[data-layout=theater] .th-hero .btnplay{border-radius:999px; padding:12px 26px}
/* The pill treatment is for the LOCKUP only. Scoped to .actions because the
   admin buttons ride in the <h1> — Refresh artwork is a `.ghost.sm` and an
   unscoped rule here made it the same size as Play, which is a lie about what
   the page is for. */
[data-layout=theater] .th-hero .actions .ghost{
  border-radius:999px; padding:12px 22px;
  background:color-mix(in srgb, var(--panel2) 62%, transparent);
  border-color:color-mix(in srgb, var(--text) 26%, transparent)}
[data-layout=theater] .th-hero h1 .ghost.sm{
  border-radius:999px; vertical-align:middle;
  background:color-mix(in srgb, var(--panel2) 70%, transparent)}
/* The hero's own progress bar: the one thing on the page that says "you are
   58 minutes in", drawn as geometry so it survives forced colours. */
[data-layout=theater] .th-hprog{
  position:relative; width:min(300px,60%); height:4px; margin:16px 0 0;
  border-radius:999px; background:color-mix(in srgb, var(--text) 24%, transparent)}
[data-layout=theater] .th-hprog>i{
  display:block; height:100%; border-radius:999px; background:var(--accent)}

/* ---- rails ---------------------------------------------------------------
   card() is not forked and neither is rail() or grid(). Everything below is
   the same markup wearing theater's vocabulary: uppercase micro-labels,
   larger posters, captions on hover. That is the thesis the G4 gate exists to
   test, and a second card function is how five layouts become five apps. */
[data-layout=theater] .th-rails{position:relative; padding:22px 0 0}
[data-layout=theater] h2.section{
  border-top:0; padding-top:0; margin:30px 2px 12px;
  font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted)}
[data-layout=theater] h2.section:first-child{margin-top:6px}

/* Larger posters. Note the variable: the SHIPPED name is --poster (set on
   <html> by applyPosterSize() from the user's icon-size preference), not the
   mockup's --w. Multiplying it rather than replacing it is deliberate — a
   layout that hardcodes a poster width silently overrides a preference the
   user set in the menu that is still on screen. Read on a DESCENDANT, so
   there is no self-reference and no custom-property cycle. */
[data-layout=theater] .th-rails .rowscroll{
  grid-auto-columns:calc(var(--poster,120px) * 1.34); gap:20px}
[data-layout=theater] .th-grid .grid,
[data-layout=theater] .th-rails .grid{
  grid-template-columns:repeat(auto-fill,minmax(calc(var(--poster,120px) * 1.34),1fr));
  gap:22px 20px}

/* Cards, theater vocabulary. The card is edgeless here: the artwork is the
   object and the panel border round it is exactly the density theater is
   spending.

   The flex column is not cosmetic. The shipped .prog bar is absolutely
   positioned against the CARD, which in classic is fine because the caption
   is opaque and the bar sits on the bottom edge of a solid box. Here the card
   is transparent and the caption is invisible at rest, so the bar floated in
   a gap below the artwork with nothing under it, reading as a stray line
   rather than as this film's progress. Ordering the three children puts it
   back where it belongs — directly under the picture it describes — with no
   change to card(). */
[data-layout=theater] .poster{
  background:transparent; border-color:transparent; border-radius:calc(var(--radius) + 2px);
  display:flex; flex-direction:column}
[data-layout=theater] .poster .artbox{order:1}
[data-layout=theater] .poster .prog{order:2; position:static; height:4px; margin-top:4px;
  border-radius:999px; background:color-mix(in srgb, var(--text) 24%, transparent)}
[data-layout=theater] .poster .prog>i{border-radius:999px}
[data-layout=theater] .poster .meta{order:3}
[data-layout=theater] .poster .artbox{
  overflow:hidden; border-radius:calc(var(--radius) + 2px);
  box-shadow:0 6px 20px color-mix(in srgb, var(--bg) 70%, transparent)}
[data-layout=theater] .poster:hover{
  border-color:transparent}
[data-layout=theater] .poster:hover .artbox{
  box-shadow:0 14px 34px color-mix(in srgb, var(--bg) 78%, transparent),
             0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent)}
[data-layout=theater] .poster .meta{padding:9px 2px 4px}

/* Hover captions.
   Captions are hidden at REST and revealed on hover / focus-within, which is
   the immersive-wall look plan §3.3 asks for. Three constraints on that:

   1. It is opacity, never display or visibility. The text stays in the
      accessibility tree and in the DOM digest, and the box keeps its height,
      so nothing reflows when a caption appears and the structural golden sees
      the same tree it always did.
   2. It is inside @media (hover:hover) and (pointer:fine) ONLY. On touch and
      on a television there is no hover, so there is no "at rest" state a
      caption could hide in — those surfaces keep every caption visible. The
      television block below re-asserts that.
   3. Watch state does NOT live in the caption. The progress bar (.prog), the
      watched tick (.badge) and the duration chip are on the artwork, outside
      .meta, so what the card says about where you are in something is visible
      statically whatever the pointer is doing.
   This is a deliberate, logged density trade — see NOTES §7. */
@media (hover:hover) and (pointer:fine){
  [data-layout=theater] .th-rails .poster .meta,
  [data-layout=theater] .th-grid .poster .meta{opacity:.0}
  [data-layout=theater] .th-rails .poster:hover .meta,
  [data-layout=theater] .th-rails .poster:focus-visible .meta,
  [data-layout=theater] .th-rails .poster:focus-within .meta,
  [data-layout=theater] .th-grid .poster:hover .meta,
  [data-layout=theater] .th-grid .poster:focus-visible .meta,
  [data-layout=theater] .th-grid .poster:focus-within .meta{opacity:1}
  /* …and a card with NO artwork keeps its caption at rest, always. The
     initials tile identifies nothing — hiding the only text on a card whose
     picture is two letters on a flat fill leaves a wall of blank rectangles,
     which is the "no art" degenerate state, not a design. */
  [data-layout=theater] .poster:has(.art.ph) .meta{opacity:1}
}

/* ---- library: the floating filter-chip bar -------------------------------
   The controls are classic's three <select>s, re-emitted verbatim by
   theaterLibraryShell() including their onchange strings — behaviour is not a
   layout's to retype. What is a layout's is the shape, so here they are
   painted as pills in a bar that floats under the top chrome.

   Sticky at exactly --th-top so it comes to rest against the fixed bar rather
   than under it or in front of it. The gradient tail is what makes the grid
   dissolve as it scrolls beneath instead of clipping on a hard edge. */
[data-layout=theater] .th-chips{
  position:sticky; top:var(--th-top); z-index:25;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  margin:0 calc(-1 * var(--th-gut)) 6px; padding:12px var(--th-gut) 16px;
  background:linear-gradient(180deg, var(--bg) 62%, transparent)}
[data-layout=theater] .th-chips .lbl{
  font:600 10.5px/1 var(--font-mono); letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:0}
[data-layout=theater] .th-chips select{
  width:auto; min-width:0; border-radius:999px; padding:7px 14px; font-size:13px;
  background:color-mix(in srgb, var(--panel2) 88%, var(--bg));
  border:1px solid color-mix(in srgb, var(--text) 16%, var(--line)); color:var(--text)}
[data-layout=theater] .th-chips select:hover{
  border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
[data-layout=theater] .th-chips .th-cpair{display:inline-flex; align-items:center; gap:7px}
[data-layout=theater] .th-chips #libcount{
  margin-left:auto; font:12px var(--font-mono); color:var(--muted)}
[data-layout=theater] .th-grid{padding:6px 0 0}
/* The A–Z rail is a fixed gutter element; it only needs to clear theater's
   wider gutter. Its mount is placed by the shell — the rail markup is still
   alphaRailHtml()'s. */
[data-layout=theater] .azbar{right:10px}

/* ---- item detail: full-screen backdrop, facts in the lower third ---------
   Same hero element, taller, and the facts sit at the bottom because that is
   where the eye ends up after the picture. min-height is the viewport less
   the lead, so the backdrop owns the first screen and the version cards /
   episode list begin below the fold. */
[data-layout=theater] .th-detail{min-height:calc(100vh - 40px); align-items:flex-end}
/* An item with NO backdrop reserves no screen for one. min-height is an
   artwork budget and there is no artwork: a season with only a poster would
   otherwise open on two thirds of a screen of empty wash, which on a light
   theme is indistinguishable from a page that failed to load. The home hero
   keeps presence (it is the featured item) but stops short of full-bleed. */
[data-layout=theater] .th-hero.th-noart{min-height:44vh}
[data-layout=theater] .th-detail.th-noart{min-height:auto}
[data-layout=theater] .th-detail .th-fg{max-width:min(820px,92%)}
[data-layout=theater] .th-detail .pagehead{margin-bottom:16px}
[data-layout=theater] .th-detail .crumbs,
[data-layout=theater] .th-detail .pgback{
  text-shadow:0 1px 10px color-mix(in srgb, var(--bg) 82%, transparent)}
[data-layout=theater] .th-detail .pgback{
  background:color-mix(in srgb, var(--panel) 76%, transparent)}
[data-layout=theater] .th-detail h1{
  margin:0 0 10px; font-weight:800; line-height:1.04; letter-spacing:-.015em;
  font-size:clamp(26px, 3.6vw, 46px);
  text-shadow:0 2px 22px color-mix(in srgb, var(--bg) 78%, transparent)}
[data-layout=theater] .th-detail .chips{
  font:13px var(--font-mono);
  text-shadow:0 1px 10px color-mix(in srgb, var(--bg) 80%, transparent)}
[data-layout=theater] .th-detail .chips>span{
  background:color-mix(in srgb, var(--panel2) 60%, transparent);
  border:1px solid color-mix(in srgb, var(--text) 16%, transparent);
  border-radius:999px; padding:3px 11px}
[data-layout=theater] .th-detail .overview{
  max-width:64ch; margin:14px 0 0;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  text-shadow:0 1px 10px color-mix(in srgb, var(--bg) 80%, transparent)}
[data-layout=theater] .th-detail .vbadges{margin-top:12px}
[data-layout=theater] .th-detail .playinfo{
  text-shadow:0 1px 10px color-mix(in srgb, var(--bg) 80%, transparent)}
/* The poster rides beside the facts. Small, because the backdrop is already
   doing the work of identifying the film; it is here because a season or a
   folder often has no backdrop at all and the wash alone identifies nothing. */
[data-layout=theater] .th-dposter{
  flex:0 0 auto; width:150px; align-self:flex-end; margin-right:26px;
  border-radius:var(--radius); overflow:hidden;
  box-shadow:0 14px 40px color-mix(in srgb, var(--bg) 76%, transparent)}
[data-layout=theater] .th-dposter .art{aspect-ratio:2/3; width:100%; object-fit:cover; display:block}
[data-layout=theater] .th-dwrap{
  position:relative; z-index:1; display:flex; align-items:flex-end; width:100%}
/* Everything under the fold — version cards, episode list, children grid —
   gets the full width, the same split catalog made. Nothing MOVES between the
   two that changes what is on the page. */
[data-layout=theater] .th-rest{padding:34px 0 0}
[data-layout=theater] .th-rest .eplist,
[data-layout=theater] .th-rest .version{
  background:color-mix(in srgb, var(--panel) 88%, var(--bg))}

/* ---- classic bodies rendered inside theater chrome -----------------------
   Activity, Settings, Search and Auth are unconverted: they emit their
   shipped markup into theater's #main. Two rules keep them from looking
   broken in a wider gutter. */
[data-layout=theater] .getapp{margin:0 0 20px}
/* classic's item hero would otherwise re-apply its own -22px/-20px margins
   inside theater's gutter and leave a lip. Theater converts the item route,
   so this only fires if a future route reuses .hero. */
[data-layout=theater] .hero:not(.th-hero){margin:0 0 22px}

/* ============================ narrow / phone ==============================
   899px because surfaceClass() calls a coarse pointer under 900px "mobile",
   so every device the app treats as a phone is inside this query — and a
   mouse-driven window dragged this narrow gets the same shape, which is the
   point of doing it in CSS rather than in a JS branch.

   Per plan §2.5 the phone expression is "full-bleed hero + floating pill
   nav": the bar keeps the wordmark, the search field and the controls in one
   row, and navigation drops to a floating pill group at the bottom. There is
   exactly one #q in the document either way — the search field never moves in
   the DOM, only in the flexbox. */
@media (max-width:899px){
  [data-layout=theater]{--th-top:56px; --th-gut:14px; --th-lead:64px}
  [data-layout=theater] main#main{padding-bottom:104px}
  [data-layout=theater] .th-top{gap:10px}
  /* Explicit order on all three, because the SHIPPED phone header rules at
     max-width:640px are unscoped — `.logo{order:1}` and `.search{order:4}`
     reach inside this bar and reorder it, while .th-ctl (order:0) jumped to
     the front. A layout that inherits half an order is a layout whose header
     rearranges itself at 640px for no reason anyone can see. */
  [data-layout=theater] .th-top .logo{font-size:16px; flex:0 0 auto; order:1}
  [data-layout=theater] .th-nav{display:none}
  [data-layout=theater] .th-top .spacer{display:none}
  [data-layout=theater] .th-top .search{flex:1 1 auto; min-width:0; max-width:none; order:2}
  [data-layout=theater] .th-ctl{gap:8px; flex:0 0 auto; order:3}
  [data-layout=theater] .th-top .activity{display:none}
  [data-layout=theater] .th-hero{min-height:56vh; padding-bottom:26px}
  [data-layout=theater] .th-hero .th-fg{max-width:100%}
  [data-layout=theater] .th-detail{min-height:auto; padding-bottom:30px}
  [data-layout=theater] .th-dposter{width:104px; margin-right:16px}
  /* Floating pill nav. Fixed and safe-area aware — an iPhone home indicator
     otherwise sits on top of it. */
  [data-layout=theater] .th-pills{
    display:flex; position:fixed; z-index:45; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    gap:4px; padding:5px; border-radius:999px;
    background:color-mix(in srgb, var(--panel) 92%, var(--bg));
    border:1px solid color-mix(in srgb, var(--text) 14%, var(--line));
    box-shadow:0 10px 30px color-mix(in srgb, var(--bg) 72%, transparent)}
  [data-layout=theater] .th-pills a{
    padding:9px 18px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted)}
  [data-layout=theater] .th-pills a.on{
    color:var(--text); font-weight:700;
    background:color-mix(in srgb, var(--accent) 24%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent)}
  /* html.working is on <html>, so this is one compound selector, not a
     descendant pair — the usual mistake here renders nothing at all. */
  html.working[data-layout=theater] .th-pills a[data-tab=activity]{position:relative}
  html.working[data-layout=theater] .th-pills a[data-tab=activity]::after{
    content:""; position:absolute; top:5px; right:9px; width:6px; height:6px;
    border-radius:50%; background:var(--accent)}
  [data-layout=theater] .th-chips{gap:8px; padding:10px var(--th-gut) 12px}
  [data-layout=theater] .th-chips #libcount{margin-left:0; flex-basis:100%}
  [data-layout=theater] .azbar{right:2px}
}

/* ============================== television ================================
   The same test surfaceClass() uses for "tv": no pointing device at all, or a
   coarse hoverless pointer on a very wide screen (a remote driving a cursor).

   Per plan §2.5 and brand/NOIRR_PLAYER.md: one quiet nav row, the focused
   title owns the upper half, no admin surfaces on the television, and focus
   is ALWAYS scale + ring + depth together — never colour alone, so Silver
   (whose accent is near-white at night) keeps a visible focus. */
@media (pointer:none), (hover:none) and (pointer:coarse) and (min-width:1280px){
  [data-layout=theater]{--th-top:76px; --th-gut:56px; --th-lead:88px}
  [data-layout=theater] main#main{font-size:17px; padding-bottom:120px}
  /* Quiet: no search box and no controls competing with the picture. They are
     hidden, not removed, so the DOM and the focus order are the same document
     on every surface and a resized window needs no re-render. */
  [data-layout=theater] .th-top .search,
  [data-layout=theater] .th-top .activity,
  [data-layout=theater] .th-ctl,
  [data-layout=theater] .th-pills{display:none}
  [data-layout=theater] .th-nav{display:flex; gap:10px}
  [data-layout=theater] .th-nav a{font-size:17px; padding:10px 18px}
  /* Admin surfaces do not belong on a television — you do not reanalyze a
     file with a remote. The hook is a class the renderers put on every admin
     control, so this is one rule rather than one per button. */
  [data-layout=theater] .th-admin{display:none}
  /* The hero owns the upper half. */
  [data-layout=theater] .th-hero{min-height:52vh}
  [data-layout=theater] .th-detail{min-height:62vh}
  [data-layout=theater] .th-title{font-size:clamp(38px,3.8vw,58px)}
  /* Captions are never hidden here: there is no hover on a television, so
     there would be no way to reveal them. The rule below out-specifies the
     hover block above, which is already gated on (hover:hover). */

     z-index so the grown card is not clipped by its neighbours; the ring's
     halo is a --bg mix so it works on a bright frame and on a black one. */
  [data-layout=theater] .poster:focus-visible{
    transform:scale(1.07); z-index:3;
    outline:4px solid var(--accent); outline-offset:5px;
    box-shadow:0 22px 52px color-mix(in srgb, var(--bg) 72%, transparent),
               0 0 0 9px color-mix(in srgb, var(--bg) 78%, transparent)}
  [data-layout=theater] .th-top a:focus-visible,
  [data-layout=theater] .th-hero button:focus-visible,
  [data-layout=theater] .th-hero a:focus-visible{
    outline-width:4px; outline-offset:4px; transform:scale(1.04)}
  [data-layout=theater] .eprow:focus-visible{
    outline:4px solid var(--accent); outline-offset:-2px;
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2))}
}

/* ============================ reduced motion ==============================
   Theater is the motion-heaviest design in the catalogue — bar fade, hero
   wash, hover zooms, caption reveals — and every one of those is decorative,
   so every one of them is OPT-IN here.

   What each motion communicates is present without it: the caption still
   appears on hover (it just does not fade in), the card under the pointer is
   still marked (by the accent ring on .artbox, which is not animated), the
   focused card on a television is still scaled and ringed (a transform
   applied without a transition is still a transform). Nothing in this layout
   carries information in movement alone. */
@media (prefers-reduced-motion: no-preference){
  [data-layout=theater] .poster .meta{transition:opacity .15s ease-out}
  [data-layout=theater] .poster .artbox{transition:box-shadow .16s ease-out}
  [data-layout=theater] .th-nav a,
  [data-layout=theater] .th-pills a{transition:background-color .13s ease-out, color .13s ease-out}
  [data-layout=theater] .th-chips select{transition:border-color .13s ease-out}
  [data-layout=theater] .poster:focus-visible{transition:transform .14s ease-out}
}
/* The shipped .poster rule animates `transform` unconditionally and theater
   cannot edit it, so it opts out here for anyone who asked for less motion.
   The hover state stays legible because the ring above does not move. */
@media (prefers-reduced-motion: reduce){
  [data-layout=theater] .poster{transition:none}
  [data-layout=theater] .poster:hover{transform:none}
}

/* ============================ forced colours ==============================
   In forced-colors mode the UA replaces author colours wholesale, which
   silently erases everything in this layout that carried meaning as a tint:
   the current nav item, the focus halo, the filter chips, the hero progress
   bar and the card's resume bar. System keywords are the sanctioned way to
   put them back, so each one is restated against Highlight / CanvasText. */
@media (forced-colors: active){
  /* The bar's translucency is a colour effect and does not survive; give it a
     real edge so it stops being an invisible band over the content. */
  [data-layout=theater] .th-top{
    background:Canvas; border-bottom:1px solid CanvasText;
    -webkit-backdrop-filter:none; backdrop-filter:none}
  /* forced-color-adjust:none on the current item is not an opt-out — every
     colour it then uses is a system keyword. It is there to stop Chromium
     painting its text "backplate" (a Canvas-coloured rectangle behind text
     that sits on an author background), which lands Canvas ink on Highlight
     and erases the label of the one item the user is on. */
  [data-layout=theater] .th-nav a.on,
  [data-layout=theater] .th-pills a.on{
    forced-color-adjust:none; background:Highlight; color:HighlightText}
  [data-layout=theater] .th-nav a.on::after{background:HighlightText}
  [data-layout=theater] .th-top a:focus-visible,
  [data-layout=theater] .th-top button:focus-visible,
  [data-layout=theater] .th-top input:focus-visible,
  [data-layout=theater] .th-pills a:focus-visible,
  [data-layout=theater] .th-hero a:focus-visible,
  [data-layout=theater] .th-hero button:focus-visible,
  [data-layout=theater] .th-chips select:focus-visible,
  [data-layout=theater] .poster:focus-visible{
    outline:3px solid Highlight; outline-offset:2px; box-shadow:none}
  /* A backdrop is a background IMAGE, which forced colours does not repaint —
     it would survive as the one author-coloured thing on the page, with an
     oversized title on top of it. Chromium's backplate keeps a heading
     legible, but a backplate behind every line of a synopsis is not reading.
     The picture is decoration, so it goes, and the scrim and the wash with
     it. */
  [data-layout=theater] .th-hero{background:Canvas}
  [data-layout=theater] .th-hero .th-bg,
  [data-layout=theater] .th-hero .th-scrim{display:none}
  /* …and with the picture gone the height reserved FOR the picture is a
     screenful of nothing above the facts. min-height is an artwork budget,
     so it goes with the artwork. */
  [data-layout=theater] .th-hero,
  [data-layout=theater] .th-detail{min-height:auto; padding-top:calc(var(--th-top) + 18px)}
  /* Every text shadow in this layout exists to separate ink from artwork.
     With the artwork gone they are noise, and a shadow is not repainted. */
  [data-layout=theater] .th-top .logo,
  [data-layout=theater] .th-nav a,
  [data-layout=theater] .th-title,
  [data-layout=theater] .th-meta,
  [data-layout=theater] .th-desc,
  [data-layout=theater] .th-detail h1,
  [data-layout=theater] .th-detail .chips,
  [data-layout=theater] .th-detail .overview,
  [data-layout=theater] .th-detail .playinfo,
  [data-layout=theater] .th-detail .crumbs,
  [data-layout=theater] .th-detail .pgback{text-shadow:none}
  /* Chips read as a run-on line of words without a border. */
  [data-layout=theater] .th-detail .chips>span{border:1px solid CanvasText; background:Canvas}
  [data-layout=theater] .th-chips select{border:1px solid CanvasText}
  /* Progress is "how far in am I", and both the fill and the track otherwise
     collapse to the same system colour — i.e. it disappears entirely. */
  [data-layout=theater] .th-hprog{
    background:Canvas; border:1px solid CanvasText; forced-color-adjust:none}
  [data-layout=theater] .th-hprog>i{background:Highlight; forced-color-adjust:none}
  [data-layout=theater] .poster .prog{
    background:Canvas; border:1px solid CanvasText; forced-color-adjust:none}
  [data-layout=theater] .poster .prog>i{background:Highlight; box-shadow:none; forced-color-adjust:none}
  /* The card is edgeless by design in this layout, and "edgeless" in forced
     colours is "invisible". Give the artwork its box back. */
  [data-layout=theater] .poster .artbox{box-shadow:none; outline:1px solid CanvasText}
  /* A caption that can only be revealed by a colour effect is a caption that
     is gone. Show them all. */
  [data-layout=theater] .poster .meta{opacity:1}
  [data-layout=theater] .th-pills{background:Canvas; border:1px solid CanvasText}
}

<script>
"use strict";
const PlaybackPolicy = window.PlurxPlaybackPolicy;
const ReaderCore = window.PlurxReaderCore;
const API = "/api/v1";

// URL, localStorage, or the authored publication frame. The query flag carries

let ME = null;

function nativeReaderPost(event,message=""){

    const apple=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.cinemaReader;

}

async function startNativeReader(token,itemId,fileId){

// hook as invalidateLibs(); it fires on the transition either way.
async function libsCached(){

// appear in a function every layout calls.
function invalidateLibs(){

// throws, never blocks playback; auto-fills context from the active PLAYER.
function clientLog(ev){

    const p=PLAYER||{}, s=p.source||{};
    const body=Object.assign({

      method:p.method||null,
      title:p.title||null,
      file_id:p.fileId||null,
      vcodec:s.video_codec||null,

      headers:Object.assign({"content-type":"application/json"},TOKEN?{"authorization":"Bearer "+TOKEN}:{}),

// decoder or the tab, which is a completely different bug.
function bufferRunway(v){

    const t=v.currentTime;

      if(v.buffered.start(i)<=t+0.25 && v.buffered.end(i)>=t) return +(v.buffered.end(i)-t).toFixed(1);

// bucket where they flatter the numbers.

// the server-chosen default track on arrival, and when that default is the
// bitmap track that forced a burn — a forced-flag PGS on a foreign-dialogue

let PENDING_DEFAULT_SUB_OFF=false;

  if(!PLAYER) return;

    // one field that separates a 4K session's numbers from a 720p one's.

    // alias of its typed `session_id`, so old and native clients stay additive.

    // browser's own word for it, and it is the difference between two failures
    // that look identical from every other number here: a full buffer with
    // late frames because the link is fine and the GPU is doing the work, and
    // a full buffer with late frames because a CPU is software-decoding 4K.

//
// mediaCapabilities is the only API that answers "will this be hardware
// decoded" — `smooth` and `powerEfficient` are computed from the real codec,
// resolution, framerate and bitrate rather than from a codec string alone, so
// it distinguishes 1080p HEVC (fine nearly everywhere) from 4K HEVC at 69 Mb/s
// (fine almost nowhere without a GPU path). Best-effort: a browser without it,
// or one that throws on an odd configuration, leaves the field null rather
// than blocking playback on a diagnostic.
async function probeDecode(){

  // what gets asked about, and on a 10-bit source the honest question is the
  // Main10 one. Asking a Main (8-bit) string about a Main10 file would have

    message:`first frame after ${(ms/1000).toFixed(1)}s`}, playbackContext()));

//

// and the opposite of useful: it buries the real ones.
//
// Two things fix it. A wait only counts once it has LASTED — the video going
// hungry for 80ms between segments is not an interruption anyone saw. And a
// wait is classified by how much was buffered when it began, because that
// single number separates two unrelated faults: nothing left to play (supply —

// looking at pacing.
const STALL_MIN_MS=350;      // shorter than this and playback did not visibly pause
const SUPPLY_RUNWAY_SECS=1.5; // less buffered than this when it began: we ran dry

const CHASE_RATE_MAX=0.90;   // realized rate under this fraction of the asked rate is a chase

function finishStallRecovery(outcome,note){
  const p=PLAYER, r=p&&p.recoveringStall; if(!r) return false;
  const ms=Math.round(performance.now()-r.at);
  clientLog(Object.assign({level:outcome==='recovered'?"info":"error",
    event:"stall_recovery",detail:outcome,ms,
    message:`stall recovery ${outcome} after ${(ms/1000).toFixed(1)}s`+(note?` — ${note}`:"")},
    playbackContext()));
  p.recoveringStall=null;
  return true;
}
function showStallRecoveryFailure(note){
  const p=PLAYER; if(!p) return;
