// ---- layout: theater — G4 ---------------------------------------------------
//
// Paste into the body <script> of crates/plurxd/src/web/index.html, after the
// catalog block and before the router (`let PAGE_TIMER=null;`).
//
// A `{name, surfaces}` stub must ALSO go into the <head> registry beside
// classic's and catalog's — see NOTES §1. Without it applyLayout() cannot resolve
// a stored "theater" preference, <html data-layout> stays "classic", and not
// one scoped rule in styles.css matches. It debugs like a stylesheet that
// failed to load; it bit the catalog port.
//
// What this file deliberately does NOT contain, same as the two drops before
// it: a card renderer, a rail renderer, a grid renderer, an escape function,
// or a fetch. Every view here is a composition of shipped helpers — card(),
// rail(), grid(), comingCard(), installBannerHtml(), groupToggleHtml(),
// specBadges(), specBlock(), unprobedNote(), episodeRow(), watchControls(),
// pageHead(), artHtml(), photoUrl(), progressPct(), watchLine(), fmtDur(),
// fmtDate(), endsAt(), esc(), tok(). Larger posters and hover captions are CSS
// on that same shared card (`--poster`, `.meta` opacity), not a second card
// function. A second card function is how five layouts become five apps, and
// G4 is where that thesis gets tested.
//
// And it re-derives NOTHING that the page models carry. R4 landed with the G3
// record precisely because catalogItemBody re-derived ~70 lines of decisions from
// classicItemBody — the year range, the resume threshold, the playable file,
// the version-header rule, the children label. theaterItemBody switches on
// `p.shape` and reads `p.resume` / `p.playable` / `p.meta` / `p.years` /
// `p.runtime` / `p.childLabel` / `p.best` / `p.multi` / `p.editable`. Where a
// decision is still missing from the model it is rendered AND logged as a
// model gap in NOTES §5 rather than quietly re-derived a third time.
//
// Three seam shapes, per §3.2:
//   chrome         (active, inner) -> assigns #app
//   views.item     whole-body      (page) -> html for #main
//   views.home     whole-body      (page) -> html for #main
//   views.library  region-shaped   {shell}, resolved PER REGION; `items` and
//                  `count` are inherited from classic untouched, because
//                  theater does not differ from classic about what a grid of
//                  posters or the word "items" is.

// ---------------------------------------------------------------------------
// 1. Chrome — a translucent bar over the art
// ---------------------------------------------------------------------------
// Same contract as classicChrome() and catalogChrome(): assign #app, produce
// <main id="main"> with `inner` inside it, wire the 300 ms search debounce,
// end with pollActivity().
//
// The bar is fixed and floats ON the content rather than above it (styles.css
// cancels main's lead padding inside the hero), which is the one structural
// thing theater does that neither other layout does.
//
// Navigation is emitted TWICE and CSS decides which copy is real: the desktop
// row (.th-nav) and the phone's floating pill group (.th-pills), per plan
// §2.5. Same reason catalog emits its sidebar and its tab bar on every surface —
// a window dragged narrow changes shape live, with no re-render and no stale
// JS branch. Both copies are anchors, both carry aria-current, and the two
// never disagree because they are built from one list.
//
// Every control in the bar calls the SHIPPED popover functions —
// toggleThemeMenu / toggleAppearanceMenu / toggleSizeMenu / toggleProfileMenu
// — rather than a theater copy of them, so the layout picker inside the theme
// menu keeps working from inside theater and a change to any of those menus
// lands in all three layouts at once.
function theaterNavItems(active){
  const hash=location.hash||"#/";
  // Library, category and search routes all call layoutChrome("home", …), so
  // `active==="home"` alone would light Home while the user is looking at a
  // library. Home means the home page.
  const homeOn = active==="home" && (hash==="#/"||hash==="#"||hash==="");
  const items=[{tab:"home", href:"#/", label:"Home", on:homeOn},
               {tab:"activity", href:"#/activity", label:"Activity", on:active==="activity"}];
  // Settings appears for admins only, and nowhere else in the shell — a
  // non-admin sees no Settings anywhere in theater's chrome. (The account
  // popover applies the same test to its own entry.)
  if(ME&&ME.is_admin) items.push({tab:"settings", href:"#/settings", label:"Settings", on:active==="settings"});
  return items;
}
function theaterNavHtml(active){
  return theaterNavItems(active).map(i=>
    `<a href="${i.href}" data-tab="${i.tab}" class="${i.on?"on":""}"${i.on?' aria-current="page"':""}>${esc(i.label)}</a>`
  ).join("");
}
function theaterChrome(active, inner){
  // ${APP_NAME}, never the literal product name — the shipped header's title
  // attribute still says "plurx" here; that is a bug this layout does not copy.
  const getapp = installAvailable()
    ? `<button class="ghost sm getappbtn" onclick="showInstall()" title="Install the ${APP_NAME} app">Get app</button>` : "";
  document.getElementById("app").innerHTML=`
   <header class="th-top">
     <a href="#/" class="logo">${APP_NAME}</a>
     <nav class="th-nav" aria-label="Main">${theaterNavHtml(active)}</nav>
     <span class="spacer"></span>
     <span class="activity" id="activity" onclick="location.hash='#/activity'"></span>
     <input class="search" id="q" placeholder="Search…" aria-label="Search ${APP_NAME}" value="${esc(getQ())}">
     <div class="th-ctl">
       <div class="th-pop">
         <button class="ghost sm" onclick="toggleThemeMenu(event)" title="Theme &amp; layout" aria-label="Theme and layout"><span class="tsw"></span></button>
         <div class="amenu" id="thememenu"></div>
       </div>
       <div class="th-pop">
         <button class="ghost sm" onclick="toggleAppearanceMenu(event)" title="Light / dark" aria-label="Light or dark">◐</button>
         <div class="amenu" id="appmenu"></div>
       </div>
       <div class="th-pop">
         <button class="ghost sm sizebtn" onclick="toggleSizeMenu(event)" title="Icon size" style="display:inline-flex;align-items:center;gap:6px">
           <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="5" height="5" rx="1"/><rect x="7" y="0" width="5" height="5" rx="1"/><rect x="0" y="7" width="5" height="5" rx="1"/><rect x="7" y="7" width="5" height="5" rx="1"/></svg><span>Size</span>
         </button>
         <div class="amenu" id="sizemenu"></div>
       </div>
       ${getapp}
       <div class="th-pop">
         <button class="ghost sm profile" onclick="toggleProfileMenu(event)" title="Account">
           <span class="pavatar">${esc((ME&&ME.username?ME.username[0]:"?").toUpperCase())}</span><span class="pname">${esc(ME?ME.username:"")}</span><span class="caret">▾</span>
         </button>
         <div class="amenu" id="profilemenu"></div>
       </div>
     </div>
   </header>
   <main id="main">${inner}</main>
   <nav class="th-pills" aria-label="Sections">${theaterNavHtml(active)}</nav>`;
  const q=document.getElementById("q");
  let t; q.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{ location.hash= q.value?("#/search/"+encodeURIComponent(q.value)):"#/"; },300); });
  theaterWireOnce();
  pollActivity();
}

// ---------------------------------------------------------------------------
// 2. The hero — which item, and why that one
// ---------------------------------------------------------------------------
// Plan §3.3 and the G4 entry conditions: the hero is your actual
// continue-watching item, not a promo; it falls back to the newest
// recently-added when the continue hub is empty; and it is PLAYABLE VIDEO
// ONLY — never a folder, a photo, or a show/season container. Home video and
// photo libraries still render as folders and grids below; they just never
// front the page.
//
// Derived from the home model with no extra fetch: `p.hubs.continue_watching`
// and `p.hubs.recently_added` are already on the page model, already ordered
// newest-first by the server, and this function only filters and takes the
// first survivor. Two hub arrays in, one item out.
//
// `next_up` is deliberately NOT a source. It is what you have not started, and
// a hero captioned "continue watching" pointing at an episode you have never
// seen is a lie about your own history; when nothing is in progress the honest
// alternative is "new in your library", which is what the fallback says.
const THEATER_HERO_KINDS={movie:1, episode:1, video:1};
function theaterHeroPick(p){
  const hubs=(p&&p.hubs)||{};
  const ok=it=>!!it && THEATER_HERO_KINDS[it.kind]===1;
  // Array order IS recency — the server returns both hubs newest-first, and
  // re-sorting them here would be this layout inventing an opinion about data
  // it does not own.
  const cont=(hubs.continue_watching||[]).filter(ok)[0];
  // "Resume" vs "Play" comes from WHICH HUB the item came from, never from a
  // position threshold recomputed here. The 3-second resume rule lives in
  // exactly one place — loadItem()'s `resume` — and the continue-watching hub
  // is the server's own answer to "what am I in the middle of". A layout that
  // rounded that threshold differently would offer to resume something the
  // player then restarts, which is the class of bug R4 exists to end.
  if(cont) return {item:cont, kick:"Continue watching", resuming:true};
  const fresh=(hubs.recently_added||[]).filter(ok)[0];
  if(fresh) return {item:fresh, kick:"New in your library", resuming:false};
  // Nothing playable anywhere: a photo-only server, a brand-new install, a
  // library of folders. The home body degrades to rails with no hero rather
  // than throwing or fronting a folder.
  return null;
}
function theaterHeroHtml(pick){
  const it=pick.item;
  // The backdrop the model already carries, and nothing else. artHtml() would
  // reach for `poster` first, which is a 2:3 image and the WRONG picture for a
  // 21:9 band — and on the cards below it is already being loaded at card
  // size, so using it here would be a second full-resolution decode of an
  // image the page has in another size. One URL, one request, and it is the
  // same URL the item's own detail page uses, so clicking through is a cache
  // hit rather than a fresh load.
  //
  // No backdrop — which is most home media, most episodes, and every photo —
  // degrades to the token-mixed wash painted by .th-hero itself. Nothing to
  // load, nothing to wait for, and it is a --bg/--accent mix so it is on-theme
  // in all twenty palettes rather than a grey rectangle.
  const bg=it.backdrop
    ? `<div class="th-bg" style="background-image:url(${esc(tok(it.backdrop))})" aria-hidden="true"></div>` : "";
  // The kicker carries the show name for an episode, so the headline can be
  // the episode's own title without card()'s show-title swap being copied
  // here — see NOTES §5.6.
  const kick = it.kind==='episode' && it.show_title
    ? `${pick.kick} · ${it.show_title}` : pick.kick;

  const bits=[];
  if(it.kind==='episode' && (it.season_number!=null||it.episode_number!=null))
    bits.push(`<span>S${it.season_number||0}E${it.episode_number||0}</span>`);
  if(it.kind==='video' && it.recorded_at) bits.push(`<span>${esc(fmtDate(it.recorded_at))}</span>`);
  else if(it.year) bits.push(`<span>${esc(String(it.year))}</span>`);
  // watchLine() is the shipped "23m left · ends ~10:45 PM" helper and it owns
  // the position threshold itself, so the hero gets the same sentence the
  // Continue-watching cards get, from the same code. It returns "" for a
  // finished item, which is correct: nothing to say.
  const left=watchLine(it, true);

  const pct=progressPct(it.watch);
  const prog = pct>0&&pct<100
    ? `<div class="th-hprog" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div>` : "";

  // The primary action plays. It does not reimplement play(): it sets the
  // shipped AUTOPLAY handoff and navigates, which is exactly what an episode
  // row's ▶ button does. viewItem() then starts the file loadItem() picked, at
  // the position loadItem() computed, with the metadata loadItem() built — so
  // the hero needs no file id, no resume value and no /items/N fetch of its
  // own, and the request log for the home route is unchanged.
  const label = pick.resuming ? "▶ Resume" : "▶ Play";
  return `<section class="th-hero${bg?'':' th-noart'}" aria-label="Featured">${bg}
    <div class="th-scrim" aria-hidden="true"></div>
    <div class="th-fg">
      <div class="th-kick">${esc(kick)}</div>
      <h1 class="th-title">${esc(it.title)}</h1>
      <div class="th-meta">${bits.join("")}${left}</div>
      ${it.overview?`<p class="th-desc">${esc(it.overview)}</p>`:""}
      ${prog}
      <div class="actions">
        <button class="btnplay" onclick="AUTOPLAY=${it.id};location.hash='#/item/${it.id}'">${label}</button>
        <button class="ghost" onclick="location.hash='#/item/${it.id}'">ⓘ Details</button>
      </div>
    </div>
  </section>`;
}

// ---------------------------------------------------------------------------
// 3. Home
// ---------------------------------------------------------------------------
// Same model, same helpers, different composition: one hero, then rails under
// uppercase micro-labels. Hub headings keep the shipped wording ("Continue
// watching", "Next up") and not a cinema rename — user-facing strings are
// explicitly not a layout's to change, and a layout switch that renames things
// the user has learned is a worse trade than the reference it buys.
function theaterHomeBody(p){
  const hub=k=>(p.hubs&&p.hubs[k])||[];
  const pick=theaterHeroPick(p);
  // The hero is emitted FIRST and outside .th-rails: styles.css cancels main's
  // gutter and lead padding on it so it runs full-bleed under the fixed bar.
  // With no hero, main's own padding already clears the bar and the page
  // simply starts with the install banner — the empty-continue-hub and
  // empty-server paths are the same code path, not a special case.
  let html = pick ? theaterHeroHtml(pick) : "";
  let body = installBannerHtml();

  // watchCtx on the first two rails: those rows are about where you are in
  // something, so the card carries "23m left · ends ~10:45 PM".
  if(hub("continue_watching").length) body+=rail("Continue watching", hub("continue_watching").map(i=>card(i,true)).join(""));
  if(hub("next_up").length)           body+=rail("Next up",           hub("next_up").map(i=>card(i,true)).join(""));
  if(hub("recently_added").length)    body+=rail("Recently added",    hub("recently_added").map(i=>card(i)).join(""));
  // Coming soon: absent entirely when nothing is paired or monarr had nothing
  // to say — an empty rail is worse than no rail.
  if(p.soon&&p.soon.entries&&p.soon.entries.length) body+=rail("Coming soon", p.soon.entries.map(comingCard).join(""));

  if(p.libs.length){
    body+=groupToggleHtml(p.group);
    for(const s of p.sections){
      const head=`${esc(s.name)} <a class="muted" style="font-size:12px" href="${esc(s.href)}">· view all (${esc(String(s.total))})</a>`;
      // Two cases still take a grid rather than a rail, both inherited from
      // the catalog drop's reasoning. An EMPTY section, because rail() on an
      // empty row renders a heading over nothing while grid([]) renders the
      // "Nothing here yet." card the rest of the app uses; and any section
      // holding PHOTOS, because grid() is what populates PHOTO_SET and
      // without it the lightbox opens on one picture and cannot page to the
      // next.
      const photos=s.items.some(i=>i.kind==="photo");
      body += (!s.items.length||photos)
        ? `<h2 class="section">${head}</h2>${grid(s.items)}`
        : rail(head, s.items.map(i=>card(i)).join(""));
    }
  } else {
    body+=`<div class="empty">No libraries yet.${ME&&ME.is_admin?' Add one in <a href="#/settings">Settings</a>.':""}</div>`;
  }
  return html+`<div class="th-rails">${body}</div>`;
}

// ---------------------------------------------------------------------------
// 4. Library — shell only (items and count are inherited from classic)
// ---------------------------------------------------------------------------
// The shell is rendered ONCE per entry into #main and owns the frame: page
// head, the floating filter-chip bar, and the three region mounts (#libbody,
// #libpager, #librail). It must never be re-rendered per batch, and #libbody's
// CONTENTS — not #libbody itself — are what the loader replaces as pages land.
// That is the whole reason this route is region-shaped: a 200-item library
// redraws its grid five or six times while loading, and a body(model) contract
// would take the reader's scroll position with it every time.
//
// The scroller stays the WINDOW, as in classic and catalog. Making #libbody an
// overflow:auto box would satisfy a literal reading of "#libbody is the thing
// that scrolls" and would silently kill the shipped scroll-spy (one window
// listener; scroll events do not bubble).
//
// The chips ARE classic's three <select>s, re-emitted verbatim including their
// onchange strings — behaviour is not a layout's to retype, and a layout that
// retypes it is a layout that can get it subtly wrong. The pill shape is CSS.
// The `libbar` class stays on the bar because libGoPage() scrolls
// `#main .libbar` into view after a page change; dropping it would leave
// paging silently unanchored, which is a defect nobody would see in a
// screenshot.
function theaterLibraryShell(m){
  const sort=m.sort;
  const head=pageHead([{href:"#/",label:"Home"},{label:m.title}],m.title);
  const bar=`<div class="libbar th-chips">
      <span class="th-cpair"><span class="lbl">Sort</span>
        <select aria-label="Sort" onchange="LIB_SORT=this.value;${m.reload}">
          ${libOpt("title","Title (A–Z)",sort)}${libOpt("added","Recently added",sort)}${libOpt("recorded","Date recorded",sort)}${libOpt("year","Year",sort)}${libOpt("resolution","Resolution",sort)}</select></span>
      <span class="th-cpair"><span class="lbl">Show</span>
        <select aria-label="Show" onchange="LIB_FILTER=this.value;${m.reload}">
          ${libOpt("all","Everything",LIB_FILTER)}${libOpt("unwatched","Unwatched",LIB_FILTER)}${libOpt("inprogress","In progress",LIB_FILTER)}${libOpt("watched","Watched",LIB_FILTER)}</select></span>
      <span class="th-cpair"><span class="lbl">Per page</span>
        <select aria-label="Per page" onchange="setPerPage(this.value);libGoPage(0)">
          ${LIB_SIZES.map(n=>libOpt(String(n),String(n),String(LIB_PER))).join("")}${libOpt("all","All",String(LIB_PER))}</select></span>
      <span class="muted" id="libcount"></span></div>`;
  return `${head}${bar}<div class="th-grid"><div id="libbody"><div class="empty">Loading…</div></div></div>`
    +`<div id="libpager"></div><div id="librail"></div>`;
}

// ---------------------------------------------------------------------------
// 5. Item detail — full-screen backdrop, facts in the lower third
// ---------------------------------------------------------------------------
// Every branch classic has is here — photo, playable file, missing file,
// multiple versions, season episode list, children grid, empty folder, rollup
// chips, tags, watch controls, the edit and refresh-artwork admin buttons,
// breadcrumbs — and every one of them is selected by `p.shape` rather than by
// re-running classic's cascade of length checks.
//
// The structural difference from classic: classic puts EVERYTHING inside the
// hero's text column, so a 26-episode list renders in a 1fr column beside a
// poster. Theater splits at the natural seam — the backdrop screen carries
// identity and the play lockup, and the detail below it (version cards,
// episode list, children grid) gets the full width. Nothing moves between the
// two that changes what is on the page; the file-missing warning stays WITH
// the play lockup because it is the answer to "can I play this", not a
// footnote.
function theaterItemBody(p){
  const it=p.item;

  // Admin affordances. .th-admin is the hook the television surface hides them
  // with (styles.css) — you do not reanalyze a file with a remote.
  const artBtn = ME&&ME.is_admin
    ? ` <button class="ghost sm th-admin" title="Re-fetch this item's poster and backdrop" aria-label="Refresh artwork" onclick="refreshArtwork(${it.id},this)">⟳ Refresh artwork</button>`
    : '';
  // `p.editable` — the model's answer, not a re-test of admin + library kind.
  const editBtn = p.editable
    ? ` <button class="ghost sm th-admin" title="Edit details" aria-label="Edit details" onclick='openEdit(${esc(JSON.stringify(it))})'>✎ Edit</button>`
    : '';

  const trail=[{href:"#/",label:"Home"}]
    .concat(NAV_ORIGIN?[{href:NAV_ORIGIN.href,label:NAV_ORIGIN.label}]:[])
    .concat((p.ancestors||[]).map(a=>({href:`#/item/${a.id}`,label:a.title})))
    .concat([{label:it.title}]);
  const crumbs=pageHead(trail);

  // The kicker: kind above the title, the way a cinema detail page labels
  // itself, with the year range beside it. `p.years` is the MODEL's range —
  // gathered from the seasons' air dates plus the item's own — and is not
  // recomputed here. That single field is 12 lines of duplicated cascade in
  // classicItemBody and catalogItemBody, and it is the headline example in the
  // G3 record of the abstraction failing one layer down.
  const yrs = p.years ? `${p.years.from}${p.years.to>p.years.from?'–'+p.years.to:''}` : '';
  const kick=[it.kind?esc(it.kind):'', yrs].filter(Boolean).join(' · ');

  const chips=[];
  if(it.recorded_at) chips.push(`<span>${esc(fmtDate(it.recorded_at))}</span>`);
  if(p.runtime) chips.push(`<span>${esc(fmtDur(p.runtime))}</span>`);
  // A container has no watch flag of its own, so say what it is made of:
  // "3 of 10 watched" is the thing the mark-watched buttons act on. This
  // sentence is a DECISION and it is now written out for the third time in
  // this file's history — NOTES §5.1 asks for `p.rollupLabel`.
  if(it.rollup&&it.rollup.leaves){
    const r=it.rollup;
    chips.push(`<span>${r.watched===r.leaves?`all ${r.leaves} watched`:`${r.watched} of ${r.leaves} watched`}</span>`);
  }
  // Video badges show once: on the backdrop screen for a single version,
  // per-version below when there are several, so nothing is duplicated.
  // `p.best` and `p.multi` are the model's; the RULE that combines them is
  // not — NOTES §5.2.
  const heroBadges = (p.best && !p.multi) ? specBadges(p.best) : "";

  // `acts` lands on the backdrop screen (the play lockup and anything that
  // answers "can I play this"); `rest` lands below it at full width.
  let acts="", rest="";
  if(p.shape==="photo"){
    // A photo is a picture, not a playback session: show it, and let a click
    // open the same full-screen view the grid uses.
    PHOTO_SET=[{id:it.id,title:it.title,recorded_at:it.recorded_at}];
    acts=`<div class="actions"><button class="btnplay" onclick="openLightbox(${it.id})">View full size</button></div>`;
    rest=`<img class="art th-photo" style="aspect-ratio:auto;max-height:64vh;width:auto;border-radius:var(--radius);cursor:zoom-in"
           src="${esc(photoUrl(it.id,'thumb'))}" alt="" onclick="openLightbox(${it.id})">`;
  } else if(p.shape==="book"){
    acts=bookActions(p);
    rest=bookVersions(p);
  } else if(p.shape==="versions"){
    // Movie / episode / clip: play the best AVAILABLE version, plus labelled
    // specs. `p.playable` and `p.resume` and `p.meta` are all the model's —
    // the file pick, the 3-second threshold and the player's info payload are
    // decided once, in loadItem(), for every layout.
    const pmeta=p.meta, resume=p.resume, playable=p.playable;
    const watchBtn=watchControls(it);
    if(playable){
      acts=`<div class="actions">
        <button class="btnplay" onclick='play(${playable.id},${esc(JSON.stringify(it.title))},${resume},${playable.duration_ms||0},${esc(JSON.stringify(pmeta))})'>▶ ${resume?`Resume · ${fmtDur(resume)}`:'Play'}</button>
        ${resume?`<button class="ghost" onclick='play(${playable.id},${esc(JSON.stringify(it.title))},0,${playable.duration_ms||0},${esc(JSON.stringify(pmeta))})'>Start over</button>`:''}
        ${watchBtn}</div>`;
      const pdur=playable.duration_ms||p.runtime||0, prem=resume?Math.max(0,pdur-resume):pdur, pend=endsAt(prem);
      if(prem) acts+=`<div class="playinfo">${resume?fmtDur(prem)+" left":fmtDur(prem)}${pend?" · ends ~"+pend:""}</div>`;
    } else {
      // `mp`, not `p`: classic can shadow its page argument here because it
      // never uses it again. This function's `p` is still live.
      const mp=p.best?p.best.missing_path:null;
      acts=`<div class="filemissing">⚠ This file is missing on the server, so it can’t be played — its library path may be unmounted, moved, or renamed${ME.is_admin&&mp?`:<br><code>${esc(mp)}</code>`:'.'}</div><div class="actions">${watchBtn}</div>`;
    }
    rest=p.files.map(v=>{
      const miss=!v.available;
      // Header (badges + per-version play) only when there are several
      // versions to tell apart, or when a file is missing. A single version is
      // already badged on the backdrop screen, so its block is just the spec
      // detail. Third copy of that rule — NOTES §5.2.
      const header=(p.multi||miss)
        ? `<div class="vh"><span class="vbadges">${specBadges(v)||`<span class="vt">${esc(v.filename)}</span>`}${miss?'<span class="missbadge">missing</span>':''}</span>${(!miss&&p.multi)?`<button class="ghost sm" onclick='play(${v.id},${esc(JSON.stringify(it.title))},${resume},${v.duration_ms||0},${esc(JSON.stringify(pmeta))})'>▶ Play</button>`:''}</div>`
        : '';
      return `<div class="version">${header}${specBlock(v)}${miss&&ME.is_admin&&v.missing_path?`<div class="problem">${esc(v.missing_path)}</div>`:''}${unprobedNote(v,it.id)}</div>`;
    }).join("");
  } else if(p.shape==="episodes"){
    const a=watchControls(it);
    if(a) acts=`<div class="actions">${a}</div>`;
    rest=`<h2 class="section">${p.children.length} episode${p.children.length>1?'s':''}</h2>
      <div class="eplist">${p.children.map(episodeRow).join("")}</div>`;
  } else if(p.shape==="children"){
    const a=watchControls(it);
    if(a) acts=`<div class="actions">${a}</div>`;
    // `p.childLabel` straight, with no folder re-test on top of it: the model
    // already answers 'Contents' for a folder, 'Seasons' for a show and
    // 'Episodes' otherwise. classic and catalog both wrap it in a ternary that
    // recomputes the folder case the model had already handled.
    rest=`<h2 class="section">${esc(p.childLabel)}</h2>${grid(p.children)}`;
  } else if(p.shape==="folder"){
    rest=`<div class="empty">This folder is empty.</div>`;
  }
  // p.shape==="empty" falls through with nothing below the fold, as classic
  // does: an item with no files, no children and no folder kind has nothing
  // truthful to put there.

  rest+=bookEditionSection(p);
  const bg=it.backdrop
    ? `<div class="th-bg" style="background-image:url(${esc(tok(it.backdrop))})" aria-hidden="true"></div>` : "";
  return `<div class="th-hero th-detail${bg?'':' th-noart'}">${bg}
    <div class="th-scrim" aria-hidden="true"></div>
    <div class="th-dwrap">
      <div class="th-dposter">${artHtml(it)}</div>
      <div class="th-fg">${crumbs}
        ${kick?`<div class="th-kick">${kick}</div>`:''}
        <h1>${esc(it.title)}${editBtn}${artBtn}</h1>${bookByline(it)}
        ${chips.length?`<div class="chips">${chips.join("")}</div>`:''}
        ${(it.tags&&it.tags.length)?`<div class="chips th-tags">${it.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:''}
        ${heroBadges?`<div class="vbadges">${heroBadges}</div>`:''}
        ${it.overview?`<p class="overview">${esc(it.overview)}</p>`:''}
        ${acts}</div>
    </div></div>${rest?`<div class="th-rest">${rest}</div>`:''}`;
}

// ---------------------------------------------------------------------------
// 6. stickyFloor — where the layout's own chrome stops and content begins
// ---------------------------------------------------------------------------
// The A–Z scroll-spy asks "which letter is at the top of the reading area?"
// and needs a viewport y to measure against. classic answers with
// header.top's bottom; theater has no header.top at all, so the shipped
// fallback (56px) is a constant that happens to be close on a desktop and
// wrong everywhere else.
//
// Theater floors content with TWO stacked bands on the library route: the
// fixed top bar, and the sticky filter-chip bar that comes to rest against it.
// Both are measured rather than read off the --th-top/--th-gut constants,
// because the chip bar wraps to two rows on a narrow window and a television
// runs a taller bar — and a measurement is the same answer whether the window
// was resized or the page re-rendered, which a media-query branch in JS is
// not.
function theaterStickyFloor(){
  let floor=0;
  const top=document.querySelector(".th-top");
  if(top){
    const r=top.getBoundingClientRect();
    // A bar that has scrolled away or is hidden floors nothing. The theater
    // bar is position:fixed so this is normally always true, but the phone
    // query and any future variant are covered by the measurement rather than
    // by an assumption.
    if(r.bottom>0 && r.top<=2) floor=Math.max(floor, r.bottom);
  }
  const chips=document.querySelector(".th-chips");
  if(chips){
    const r=chips.getBoundingClientRect();
    // Only when the chip bar is actually PINNED — while it is still in normal
    // flow further down the page it is content, not chrome, and counting it
    // would push the spy line most of a screen down.
    if(r.bottom>0 && r.top<=floor+2) floor=Math.max(floor, r.bottom);
  }
  return floor;
}

// ---------------------------------------------------------------------------
// 7. One-time wiring: keyboard- and D-pad-operable cards
// ---------------------------------------------------------------------------
// A poster is a <div onclick=…>: clickable, but not focusable and not operable
// from the keyboard. Theater is the TV flagship (plan §2.5) — without this
// there is no D-pad path through the app at all, and the ten-foot focus
// treatment in styles.css has nothing to attach to. A MutationObserver rather
// than a call at the end of each view because theater does not own the
// activity, settings or search views.
//
// The layoutId() guard is the important line: switching layout re-runs
// render(), which repaints classic's DOM under the same live observer. Without
// the check, classic would start emitting posters carrying tabindex — a diff
// in the structural golden the gate re-checks after every layout lands.
//
// This is a near-copy of catalogWireOnce()/catalogEnhanceCards() and it should not
// be. NOTES §5.5 asks for it to move into shared wiring behind a per-layout
// flag before G5 — at five layouts it is five copies of the same observer.
let THEATER_WIRED=false;
function theaterEnhanceCards(){
  if(layoutId()!=="theater") return;
  for(const el of document.querySelectorAll(".poster[onclick]:not([tabindex])")){
    el.setAttribute("tabindex","0");
    // Cards that navigate are links; the photo cards call openLightbox() and
    // are buttons. Announcing every card as a link would promise a page that a
    // lightbox never delivers.
    el.setAttribute("role", /location\.hash/.test(el.getAttribute("onclick")||"") ? "link" : "button");
  }
}
function theaterWireOnce(){
  if(THEATER_WIRED) return;
  THEATER_WIRED=true;
  document.addEventListener("keydown",e=>{
    if(layoutId()!=="theater") return;
    // The player and the lightbox own the keyboard while they are up; both of
    // the shipped handlers guard on that and this one has to agree.
    const modal=document.getElementById("modal");
    if(lightboxOpen()||(modal&&modal.classList.contains("open"))) return;
    const el=e.target;
    if(!el||!el.classList||!el.classList.contains("poster")) return;
    // Enter and Space are what a role=link/button promises. "Spacebar" is the
    // legacy key name older WebKit still reports.
    if(e.key!=="Enter"&&e.key!==" "&&e.key!=="Spacebar") return;
    e.preventDefault();          // Space would otherwise page the grid down
    el.click();                  // fires the inline handler card() emitted
  });
  // #app itself is never replaced (every view assigns to its innerHTML), so
  // one observer on it outlives every route change.
  const app=document.getElementById("app");
  if(app&&window.MutationObserver) new MutationObserver(theaterEnhanceCards).observe(app,{childList:true,subtree:true});
  theaterEnhanceCards();
}

// ---- registration ---------------------------------------------------------
// `surfaces` includes tv: theater is the flagship television layout (§2.5).
// `library` is region-shaped and deliberately partial — `items` and `count`
// fall through to classic PER REGION, which is what the per-region fallback is
// for and the difference between overriding a detail and reimplementing a
// route.
LAYOUTS.theater={name:"Theater", surfaces:["desktop","mobile","tv"],
  chrome: theaterChrome,
  views: {home: theaterHomeBody, item: theaterItemBody,
          library: {shell: theaterLibraryShell}},
  stickyFloor: theaterStickyFloor};
// applyLayout() ran in the <head>, where the registry may not yet know this
// id. Re-applying here is invisible — boot() has not resolved /server yet, so
// #app is empty and there is nothing painted to reflow — and it is a belt to
// the <head> stub's braces, not a replacement for it: layoutMenuHtml() and
// ui-baseline's REGISTRY_JS both read LAYOUTS, but only the <head> copy runs
// before first paint.
applyLayout();

// ---- EPUB reader ---------------------------------------------------------
// The package parser and capability boundary live on the server. This route
// only ever sees normalized manifest hrefs and capability resource URLs; the
// account bearer stays in the parent page and is never appended to a chapter.
let READER=null;
const READER_PREFS_KEY="plurx_reader_prefs";

function readerPrefs(){
  let raw=null; try{ raw=JSON.parse(localStorage.getItem(READER_PREFS_KEY)||"null"); }catch(e){}
  return ReaderCore.normalizePrefs(raw);
}
function storeReaderPrefs(value){
  const prefs=ReaderCore.normalizePrefs(value);
  try{ localStorage.setItem(READER_PREFS_KEY,JSON.stringify(prefs)); }catch(e){}
  return prefs;
}
function readerProgressLabel(value){
  const pct=Math.max(0,Math.min(100,Math.round((value||0)*100)));
  return `${pct}%`;
}
function readerShell(item,file){
  return `<div class="reader-shell" role="application" aria-label="Ebook reader">
    <div class="reader-top">
      <button class="ghost sm" onclick="closeReader()" aria-label="Back to book detail">← Back</button>
      <h1 id="reader-title">${esc(item.title)}</h1><span class="reader-progress" id="reader-progress">0%</span>
      <span class="reader-spacer"></span>
      <button class="ghost sm" onclick="toggleReaderPanel('toc')" aria-expanded="false" id="reader-toc-button">Contents</button>
      <button class="ghost sm" onclick="toggleReaderPanel('search')" aria-expanded="false" id="reader-search-button">Search</button>
      <button class="ghost sm" onclick="toggleReaderSettings()" aria-expanded="false" id="reader-settings-button">Aa</button>
      <button class="ghost sm" onclick="setReaderCompleted(true)" id="reader-finish">Mark finished</button>
      <a class="ghost sm" href="${esc(bookContentUrl(file))}" target="_blank" rel="noopener">Open in…</a>
    </div>
    <div class="reader-body">
      <aside class="reader-panel" id="reader-panel" hidden aria-label="Reader navigation"></aside>
      <section class="reader-stage">
        <div class="reader-loading" id="reader-loading">Opening publication…</div>
        <iframe class="reader-frame" id="reader-frame" sandbox="allow-same-origin" referrerpolicy="no-referrer" title="${esc(item.title)}"></iframe>
        <div class="reader-pop" id="reader-settings" hidden></div>
        <div class="reader-status" id="reader-status" role="status" aria-live="polite"></div>
      </section>
    </div>
    <div class="reader-bottom">
      <button class="ghost sm" onclick="readerStep(-1)" aria-label="Previous page or chapter">← Previous</button>
      <span class="reader-location" id="reader-location">Opening…</span>
      <button class="ghost sm" onclick="readerStep(1)" aria-label="Next page or chapter">Next →</button>
    </div>
  </div>`;
}
function readerStatus(message){
  const status=document.getElementById("reader-status"); if(!status) return;
  status.textContent=message; status.classList.add("on");
  clearTimeout(READER&&READER.statusTimer);
  if(READER) READER.statusTimer=setTimeout(()=>status.classList.remove("on"),1800);
}
function readerError(message){
  const loading=document.getElementById("reader-loading"); if(!loading) return;
  const r=READER, file=r&&r.file;
  loading.className="reader-error";
  loading.hidden=false;
  loading.innerHTML=`<strong>${esc(message||"Cinema could not open this book.")}</strong>
    <p>The original file is unchanged. You can open it in another reading app or download it.</p>
    ${file?`<div class="actions"><a class="ghost" href="${esc(bookContentUrl(file))}" target="_blank" rel="noopener">Open in…</a>
      <a class="ghost" href="${esc(bookContentUrl(file))}" download="${esc(file.filename||"book.epub")}">Download original</a></div>`:""}`;
}
function showReaderLoading(message){
  const loading=document.getElementById("reader-loading"); if(!loading) return;
  loading.className="reader-loading"; loading.textContent=message||"Opening chapter…"; loading.hidden=false;
}
function hideReaderLoading(){ const loading=document.getElementById("reader-loading"); if(loading) loading.hidden=true; }

function readerTocRows(entries,depth){
  return (entries||[]).map(entry=>{
    const href=String(entry.href||"");
    return `<button style="padding-left:${8+depth*16}px" data-reader-href="${esc(href)}" onclick='navigateReader(${esc(JSON.stringify(href))})'>${esc(entry.title||"Untitled")}</button>${readerTocRows(entry.children||[],depth+1)}`;
  }).join("");
}
function showReaderToc(){
  const panel=document.getElementById("reader-panel"); if(!panel||!READER) return;
  panel.innerHTML=`<h2>Contents</h2><div class="reader-toc">${readerTocRows(READER.open.publication.toc,0)||'<div class="muted">This EPUB has no authored table of contents.</div>'}</div>`;
  updateReaderTocCurrent();
}
function showReaderSearch(){
  const panel=document.getElementById("reader-panel"); if(!panel) return;
  panel.innerHTML=`<h2>Search this book</h2><div class="reader-search"><input id="reader-search-query" type="search" minlength="2" autocomplete="off" placeholder="Words in this publication" aria-label="Search this book"><button class="sm" onclick="readerSearch()">Search</button></div><div class="reader-search-results" id="reader-search-results"><div class="muted">Search stays on this Cinema server and in this browser.</div></div>`;
  const q=document.getElementById("reader-search-query");
  if(q){ q.addEventListener("keydown",event=>{if(event.key==="Enter") readerSearch();}); q.focus(); }
}
function toggleReaderPanel(mode){
  const panel=document.getElementById("reader-panel"); if(!panel) return;
  const same=READER&&READER.panel===mode&&!panel.hidden;
  panel.hidden=same; if(READER) READER.panel=same?null:mode;
  for(const name of ["toc","search"]){ const button=document.getElementById(`reader-${name}-button`); if(button) button.setAttribute("aria-expanded",String(!same&&name===mode)); }
  if(same) return;
  if(mode==="search") showReaderSearch(); else showReaderToc();
}
function updateReaderTocCurrent(){
  if(!READER) return;
  const path=ReaderCore.splitHref(READER.href).path;
  document.querySelectorAll("[data-reader-href]").forEach(button=>{
    button.setAttribute("aria-current",String(ReaderCore.splitHref(button.dataset.readerHref).path===path));
  });
}
function readerSettingsHtml(){
  const p=READER.prefs;
  return `<div class="reader-pref-grid">
    <label for="reader-font">Typeface</label><select id="reader-font" onchange="updateReaderPref('font',this.value)">
      <option value="publisher" ${p.font==='publisher'?'selected':''}>Publisher</option><option value="serif" ${p.font==='serif'?'selected':''}>Serif</option><option value="sans" ${p.font==='sans'?'selected':''}>Sans serif</option><option value="accessible" ${p.font==='accessible'?'selected':''}>Accessible</option></select>
    <label for="reader-size">Text size</label><input id="reader-size" type="range" min="70" max="220" step="5" value="${p.fontSize}" oninput="updateReaderPref('fontSize',Number(this.value))">
    <label for="reader-line">Line height</label><input id="reader-line" type="range" min="1.1" max="2.4" step=".05" value="${p.lineHeight}" oninput="updateReaderPref('lineHeight',Number(this.value))">
    <label for="reader-margin">Margins</label><input id="reader-margin" type="range" min="2" max="18" step="1" value="${p.margin}" oninput="updateReaderPref('margin',Number(this.value))">
    <label for="reader-theme">Page</label><select id="reader-theme" onchange="updateReaderPref('theme',this.value)"><option value="light" ${p.theme==='light'?'selected':''}>Light</option><option value="sepia" ${p.theme==='sepia'?'selected':''}>Sepia</option><option value="dark" ${p.theme==='dark'?'selected':''}>Dark</option></select>
    <label for="reader-flow">Layout</label><select id="reader-flow" onchange="updateReaderPref('flow',this.value)"><option value="paginated" ${p.flow==='paginated'?'selected':''}>Paginated</option><option value="scrolled" ${p.flow==='scrolled'?'selected':''}>Scrolled</option></select>
  </div>`;
}
function toggleReaderSettings(){
  const pop=document.getElementById("reader-settings"), button=document.getElementById("reader-settings-button"); if(!pop||!READER) return;
  const opening=pop.hidden; pop.hidden=!opening; button&&button.setAttribute("aria-expanded",String(opening));
  if(opening) pop.innerHTML=readerSettingsHtml();
}
async function updateReaderPref(key,value){
  if(!READER||!READER.navigator) return;
  READER.prefs=storeReaderPrefs(Object.assign({},READER.prefs,{[key]:value}));
  await READER.navigator.applyPrefs(READER.prefs);
  READER.dirty=true; scheduleReaderSave();
}

function readingOrderIndex(href){
  if(!READER) return -1;
  const path=ReaderCore.splitHref(href).path;
  return READER.open.publication.readingOrder.findIndex(link=>ReaderCore.splitHref(link.href).path===path);
}
async function navigateReader(href,locator){
  if(!READER) return;
  const r=READER, generation=(r.navigationGeneration||0)+1;
  r.navigationGeneration=generation;
  // Manifest/TOC/search hrefs are already publication-root-normalized. Only
  // an authored link intercepted inside the current chapter is relative.
  const resolved=readingOrderIndex(href)>=0?href:(ReaderCore.resolveHref(READER.href||href,href)||href);
  const index=readingOrderIndex(resolved);
  if(index<0){ readerStatus("That link is outside this publication."); return; }
  const link=READER.open.publication.readingOrder[index];
  const destination=locator||(ReaderCore.splitHref(resolved).fragment?{version:1,href:resolved}:null);
  showReaderLoading(`Opening ${link.title||`section ${index+1}`}…`);
  try{
    r.index=index; r.href=resolved;
    const url=ReaderCore.resourceUrl(r.open.resource_base,resolved);
    if(!url) throw new Error("The chapter link is invalid.");
    await r.navigator.load(url,resolved,index,r.open.publication.readingOrder.length,r.prefs,destination);
    if(READER!==r||r.navigationGeneration!==generation) return;
    hideReaderLoading(); updateReaderTocCurrent(); updateReaderLocation();
  }catch(error){ if(READER===r&&r.navigationGeneration===generation) readerError(error.message); }
}
function updateReaderLocation(){
  if(!READER) return;
  const total=READER.progression||0, current=READER.index+1, count=READER.open.publication.readingOrder.length;
  const progress=document.getElementById("reader-progress"), location=document.getElementById("reader-location");
  if(progress) progress.textContent=readerProgressLabel(total);
  if(location) location.textContent=`${current} of ${count} · ${readerProgressLabel(total)}`;
}
function readerLocated(locator){
  if(!READER||!locator) return;
  READER.locator=locator;
  READER.progression=locator.locations&&locator.locations.totalProgression||0;
  READER.dirty=true; updateReaderLocation(); scheduleReaderSave();
}
async function readerStep(direction){
  if(!READER||!READER.navigator) return;
  if(READER.navigator.move(direction)) return;
  const next=READER.index+direction;
  if(next<0){ readerStatus("Beginning of book"); return; }
  if(next>=READER.open.publication.readingOrder.length){ readerStatus("End of book · use Mark finished when you are done"); return; }
  await navigateReader(READER.open.publication.readingOrder[next].href);
}
function scheduleReaderSave(){
  if(!READER) return; clearTimeout(READER.saveTimer);
  READER.saveTimer=setTimeout(()=>saveReaderState(),3000);
}
async function saveReaderState(force){
  const r=READER; if(!r||!r.locator||(!r.dirty&&!force)) return;
  if(force) r.forceSave=true;
  if(r.saving){
    r.saveAgain=true;
    // Close/explicit completion must not outrun the write already in flight.
    // Its promise includes any coalesced follow-up snapshot.
    if(force&&r.savePromise) await r.savePromise;
    return;
  }
  r.saving=true;
  r.savePromise=(async()=>{
    try{
      do{
        r.saveAgain=false;
        const forceThis=!!r.forceSave; r.forceSave=false;
        if(!r.locator||(!r.dirty&&!forceThis)) continue;
        const locator=JSON.parse(JSON.stringify(r.locator)), fingerprint=JSON.stringify(locator), completed=!!r.completed;
        try{
          const saved=await api(`/items/${r.item.id}/reading-state`,{method:"PUT",body:{
            file_id:r.file.id,revision:r.open.revision,locator,
            progression:r.progression||0,completed,recorded_at:Math.floor(Date.now()/1000)
          }});
          if(READER===r){
            // A second gesture may have changed completion or location while
            // this request was in flight. Never overwrite that newer intent
            // with the response to the older snapshot.
            const unchanged=JSON.stringify(r.locator)===fingerprint&&r.completed===completed;
            if(unchanged){ r.completed=!!saved.completed; r.dirty=false; }
            updateReaderFinish();
          }
        }catch(error){
          if(READER===r){
            if(error.status===409||error.code==="publication_changed") readerError("The book file changed. Reopen it before continuing.");
            else readerStatus("Reading position will retry");
          }
        }
      }while(READER===r&&(r.saveAgain||r.forceSave));
    }finally{
      r.saving=false; r.savePromise=null;
    }
  })();
  await r.savePromise;
}
function updateReaderFinish(){
  const button=document.getElementById("reader-finish"); if(!button||!READER) return;
  button.textContent=READER.completed?"Mark unfinished":"Mark finished";
  button.onclick=()=>setReaderCompleted(!READER.completed);
}
async function setReaderCompleted(completed){
  if(!READER) return;
  READER.completed=!!completed; READER.dirty=true; updateReaderFinish();
  await saveReaderState(true); readerStatus(completed?"Marked finished":"Marked unfinished");
}

async function readerSearch(){
  const input=document.getElementById("reader-search-query"), out=document.getElementById("reader-search-results");
  if(!input||!out||!READER) return;
  const query=input.value.trim(); if(query.length<2){ out.innerHTML='<div class="muted">Enter at least two characters.</div>'; return; }
  const generation=++READER.searchGeneration; out.innerHTML='<div class="muted">Searching this publication…</div>';
  const results=[], order=READER.open.publication.readingOrder, max=READER.open.limits.markup_bytes||8388608;
  for(let index=0;index<order.length&&results.length<100;index++){
    if(!READER||generation!==READER.searchGeneration) return;
    const link=order[index], url=ReaderCore.resourceUrl(READER.open.resource_base,link.href);
    try{
      const response=await fetch(url,{headers:{accept:"application/xhtml+xml,text/html;q=.9"},referrerPolicy:"no-referrer"});
      const bytes=Number(response.headers.get("content-length")||0), type=response.headers.get("content-type")||"";
      if(!response.ok||bytes>max||!/html|xhtml|xml/i.test(type)){ if(response.body) response.body.cancel(); continue; }
      const source=await response.text(); if(source.length>max) continue;
      let doc=new DOMParser().parseFromString(source,/xhtml|xml/i.test(type)?"application/xhtml+xml":"text/html");
      if(doc.querySelector("parsererror")) doc=new DOMParser().parseFromString(source,"text/html");
      const blocks=Array.from(doc.body?doc.body.querySelectorAll("h1,h2,h3,h4,h5,h6,p,li,blockquote,pre,figcaption"):[]);
      for(const element of blocks){
        const excerpt=ReaderCore.snippet(element.textContent,query); if(!excerpt) continue;
        const within=blocks.length>1?blocks.indexOf(element)/(blocks.length-1):0;
        results.push({title:link.title||`Section ${index+1}`,snippet:excerpt,
          locator:ReaderCore.makeLocator(link.href,index,order.length,within,element)});
        if(results.length>=100) break;
      }
    }catch(error){ /* a missing optional spine document does not end the search */ }
  }
  if(!READER||generation!==READER.searchGeneration) return;
  READER.searchResults=results;
  out.innerHTML=results.length?results.map((result,index)=>`<button onclick="readerSearchGo(${index})"><span class="reader-result-title">${esc(result.title)}</span><span class="reader-result-snippet">${esc(result.snippet)}</span></button>`).join(""):'<div class="muted">No matches in this publication.</div>';
}
async function readerSearchGo(index){
  const result=READER&&READER.searchResults&&READER.searchResults[index]; if(!result) return;
  await navigateReader(result.locator.href,result.locator);
  const panel=document.getElementById("reader-panel"); if(panel&&innerWidth<720) panel.hidden=true;
}

function readerFlushKeepalive(r){
  if(!r||!r.open||!r.locator||!TOKEN) return;
  const body=JSON.stringify({file_id:r.file.id,revision:r.open.revision,locator:r.locator,
    progression:r.progression||0,completed:!!r.completed,recorded_at:Math.floor(Date.now()/1000)});
  fetch(`${API}/items/${r.item.id}/reading-state`,{method:"PUT",headers:{authorization:"Bearer "+TOKEN,"content-type":"application/json"},body,keepalive:true}).catch(()=>{});
}
function closeReaderSession(r){
  if(!r||!r.open||!r.open.session_id||!TOKEN) return;
  fetch(`${API}/publication/${encodeURIComponent(r.open.session_id)}`,{method:"DELETE",headers:{authorization:"Bearer "+TOKEN},keepalive:true}).catch(()=>{});
}
function destroyReader(flush){
  const r=READER; if(!r) return;
  READER=null; clearTimeout(r.saveTimer); clearInterval(r.heartbeat); clearTimeout(r.statusTimer);
  if(flush) readerFlushKeepalive(r);
  if(r.navigator) r.navigator.destroy();
  closeReaderSession(r);
}
async function closeReader(){
  const r=READER; if(!r){ history.back(); return; }
  await saveReaderState(true); const itemId=r.item.id; destroyReader(false);
  if(NATIVE_READER_BOOT){ TOKEN=null; ME=null; nativeReaderPost("close"); return; }
  location.hash=`#/item/${itemId}`;
}
async function viewReader(itemId,fileId){
  if(surfaceClass()==="tv") throw new Error("The ebook reader is available on desktop, phone, and tablet screens.");
  if(READER&&(READER.item.id!==Number(itemId)||READER.file.id!==Number(fileId))) destroyReader(true);
  if(READER) return;
  const detail=await api(`/items/${itemId}`), item=detail.item;
  const file=(detail.files||[]).find(candidate=>candidate.id===Number(fileId));
  if(!canReadBookFile(file)) throw new Error("This ebook format is not available in Cinema's reader.");
  document.getElementById("app").innerHTML=readerShell(item,file);
  try{
    const [opened,state]=await Promise.all([
      api(`/files/${file.id}/publication`,{method:"POST"}),
      api(`/items/${item.id}/reading-state?file_id=${file.id}`)
    ]);
    const saved=state&&!state.stale?state.state:null, prefs=readerPrefs();
    READER={item,file,detail,open:opened,prefs,locator:saved&&saved.locator||null,
      progression:saved&&saved.progression||0,completed:!!(saved&&saved.completed),dirty:false,
      index:0,href:opened.publication.readingOrder[0].href,searchGeneration:0,navigationGeneration:0};
    const frame=document.getElementById("reader-frame");
    READER.navigator=new ReaderCore.FrameNavigator(frame,{
      onLocation:readerLocated,
      onNavigate:href=>navigateReader(href),
      onBlockedLink:()=>readerStatus("External publication links are blocked. Use Open in… for the original file."),
      onBoundary:direction=>readerStep(direction),
    });
    updateReaderFinish(); showReaderToc(); updateReaderLocation();
    const start=saved&&saved.locator&&readingOrderIndex(saved.locator.href)>=0?saved.locator.href:READER.href;
    await navigateReader(start,saved&&saved.locator);
    READER.heartbeat=setInterval(()=>saveReaderState(true),30000);
    nativeReaderPost("ready");
  }catch(error){
    if(!READER) READER={item,file,detail,open:null,locator:null,progression:0,completed:false};
    readerError(error.message);
    nativeReaderPost("error",error.message);
  }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&READER) readerFlushKeepalive(READER); });
window.addEventListener("beforeunload",()=>{ if(READER){ readerFlushKeepalive(READER); closeReaderSession(READER); } });

// ---- router ---------------------------------------------------------------
// One page-scoped poller at a time; routing away always clears it.
let PAGE_TIMER=null;
function setPageTimer(fn,ms){ clearInterval(PAGE_TIMER); PAGE_TIMER=setInterval(fn,ms); }
async function render(){
  if(!TOKEN||!ME) return boot();
  clearInterval(PAGE_TIMER);
  if(!ACT_TIMER) ACT_TIMER=setInterval(pollActivity,4000);
  const h=location.hash||"#/";
  if(!h.startsWith("#/read/")&&READER) destroyReader(true);
  // A join token is bearer authority, so leaving Settings drops the only
  // in-memory copy even before a later Settings visit clears it again.
  if(h!=="#/settings"&&h!=="#/admin") forgetJoinToken();
  // Item pages inherit the list you arrived from; everything else replaces it
  // (the list views re-set it as they render) or drops it.
  if(!h.startsWith("#/item/")) NAV_ORIGIN=null;
  try{
    if(h.startsWith("#/read/")) await viewReader(h.split("/")[2],h.split("/")[3]);
    else if(h.startsWith("#/item/")) await viewItem(h.split("/")[2]);
    else if(h.startsWith("#/library/")) await viewLibrary(h.split("/")[2]);
    else if(h.startsWith("#/category/")) await viewCategory(decodeURIComponent(h.split("/")[2]||""));
    else if(h.startsWith("#/search/")) await viewSearch(decodeURIComponent(h.split("/")[2]||""));
    else if(h==="#/activity") await viewActivity();
    else if(h==="#/admin"||h==="#/settings") await viewSettings();
    else await viewHome();
    // Converted routes restore at the moment their content lands; this catches
    // the ones that do not, and — because it is consume-once — guarantees a
    // pending offset never survives the route that was on screen when it was
    // armed. Without it, switching layout on Settings scrolled the NEXT page.
    restoreScroll();
  }catch(e){
    if(e.message!=="unauthorized"){ const m=document.getElementById("main"); if(m) m.innerHTML=`<div class="empty">${esc(e.message)}</div>`; else toast(e.message); }
  }
}
window.addEventListener("hashchange",render);

if(NATIVE_READER_BOOT){
  document.getElementById("app").innerHTML='<div class="center"><div class="card">Opening reader…</div></div>';
  nativeReaderPost("shell-ready");
}else boot();
</script>
</body>
