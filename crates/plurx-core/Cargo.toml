[package]
name = "plurx-core"
description = "plurx core: storage boundary, configuration, shared domain types"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Compiles `testfixtures` — the shared media-fixture builder the plurxd test
# suite also uses. Dev-dependencies only; `cargo build` never turns it on.
fixtures = []
# M0-only dependency and semantic harness. The production daemon does not
# enable this; later milestones promote the proven API behind Store.
hiqlite-spike = ["dep:hiqlite", "dep:rustls"]

[dependencies]
async-trait = { workspace = true }
rusqlite = { workspace = true }
hiqlite = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Scanner
walkdir = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
kamadak-exif = { workspace = true }
# Metadata
reqwest = { workspace = true }
# Auth
argon2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
# `trace` (sqlite3_trace_v2) is how the page-wide lookups prove they are one
# statement rather than one per item. Tests only — resolver 2 keeps a
# dev-dependency's features out of the shipped build.
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
