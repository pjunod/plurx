<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="slat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55555e"/>
      <stop offset="100%" stop-color="#c9c9d2"/>
    </linearGradient>
    <filter id="beamglow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#e5484d" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5.5" flood-color="#e5484d" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <!-- slats with a diagonal gap: light through the blinds cuts the N -->
  <g fill="url(#slat)">
    <rect x="10" y="12"   width="3"    height="5.5" rx="1"/><rect x="21"   y="12"   width="33"   height="5.5" rx="1"/>
    <rect x="10" y="20.5" width="10.5" height="5.5" rx="1"/><rect x="28.5" y="20.5" width="25.5" height="5.5" rx="1"/>
    <rect x="10" y="29"   width="18"   height="5.5" rx="1"/><rect x="36"   y="29"   width="18"   height="5.5" rx="1"/>
    <rect x="10" y="37.5" width="25.5" height="5.5" rx="1"/><rect x="43.5" y="37.5" width="10.5" height="5.5" rx="1"/>
    <rect x="10" y="46"   width="33"   height="5.5" rx="1"/><rect x="51"   y="46"   width="3"    height="5.5" rx="1"/>
  </g>
  <line x1="17" y1="11" x2="47" y2="52.5" stroke="#e5484d" stroke-width="2.5" stroke-linecap="round" filter="url(#beamglow)"/>
</svg>
