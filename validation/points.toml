version = 1

[settings]
profiles = ["commit", "ci", "full", "nightly"]
artifact_dir = "target/validation"
always_checks = ["catalog-contract", "history-regressions", "rust-gate", "rust-gate-ci"]
audit_paths = [
  ".dockerignore",
  ".github/workflows/**",
  "Cargo.lock",
  "Cargo.toml",
  "Dockerfile",
  "Makefile",
  "benchmarks/**",
  "clients/**",
  "crates/**",
  "deploy/**",
  "plurx.example.toml",
  "rust-toolchain.toml",
  "scripts/**",
  "tests/**",
  "validation/**",
  "vendor/**",
]
audit_exclude = []
allow_unmatched_globs = ["docs/METADATA*.md"]

[[checks]]
id = "catalog-contract"
title = "Validation runner contract"
command = "python3 -m unittest discover -s tests/validation -p 'test_*.py'"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["python3"]
missing = "fail"
timeout_seconds = 60

[[checks]]
id = "history-regressions"
title = "Historical corrective commits have current validation evidence"
command = "scripts/history-audit --report target/validation/history.json"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["git", "python3"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "operations-contract"
title = "Deploy, CI, container, and client shipping contracts"
command = "python3 -m unittest discover -s tests/operations -p 'test_*.py'"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["bash", "make", "python3", "sh"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "benchmark-contract"
title = "Cinema-vs-Plex benchmark config, runners, raw schema, and reports"
command = "make benchmark-check"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["make", "python3"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "mobile-version"
title = "Changed mobile apps advance their store build numbers"
command = "python3 -m validation.mobile_versions"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["git", "python3"]
missing = "fail"
timeout_seconds = 60

[[checks]]
id = "rust-gate"
title = "Rust format, lint, and workspace tests"
command = "make rust-check"
profiles = ["commit", "full", "nightly"]
requires = ["cargo", "make"]
missing = "fail"
timeout_seconds = 1800

# The CI profile splits the local gate three ways so nothing runs twice per
# push: clippy is lint.yml's whole job, and the replicated store member is the
# cluster_auth job's whole job — `--exclude plurx-cluster-check` keeps feature
# unification from dragging the hiqlite stack into this build, which is also
# what makes this suite test plurx-core with the features plurxd actually
# ships. Local profiles keep the one-command `make rust-check` above.
[[checks]]
id = "rust-gate-ci"
title = "Rust format and workspace tests (CI split: clippy in lint.yml, replicated store in cluster_auth)"
command = "make ci-rust-gate"
profiles = ["ci"]
requires = ["cargo", "make"]
missing = "fail"
timeout_seconds = 1800

[[checks]]
id = "web-static"
title = "Embedded JavaScript and theme contrast"
command = "make web-check"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["node", "python3"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "web-layout"
title = "Every web layout against the structural golden"
command = "make ui-check"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["python3", "ffmpeg"]
requires_files = ["tests/ui-structure.golden"]
preflight = "python3 -c 'import playwright'"
missing = "skip"
skip_if_env = ["PLURX_SKIP_UI_BASELINE"]
timeout_seconds = 1800

[[checks]]
id = "playback-smoke"
title = "Risk-weighted browser playback matrix"
command = "make playback-smoke"
profiles = ["full", "nightly"]
platforms = ["darwin", "linux"]
requires = ["cargo", "ffmpeg", "node"]
missing = "skip"
timeout_seconds = 3600

# The browser matrix above needs ffmpeg, a server build, and Chrome, so it only
# runs in the deep profiles. The shaping layer's own contract — the profile
# grammar, the rate limiter, the cliff, the recovery scoring, and the artifact
# rules — is pure Node and runs on every commit, because a shaper that silently
# stops shaping would turn a green stall-recovery run into false evidence.
[[checks]]
id = "playback-shaping"
title = "Network-shaping harness contract"
command = "node tests/playback/network-shaping.test.js"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["node"]
missing = "fail"
timeout_seconds = 300

# The membership panel's promise is the sentences an operator reads, not the API
# fields behind them: two voters are a reconfiguration waypoint and never
# redundancy (CLUSTERING-PLAN §7.2), and a removal refusal has to name a next
# step. Neither is visible to the Rust gate or to a structural DOM golden, and
# both are pure Node against the shipped index.html, so this runs on every
# commit rather than only in a browser profile.
[[checks]]
id = "web-membership"
title = "Cluster membership panel wording and join-token handling"
command = "node tests/web/cluster-membership.test.js"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["node"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "reader-browser"
title = "EPUB reader restore, navigation, search, and hostile-content boundary"
command = "scripts/reader-browser"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["python3", "cargo"]
preflight = "python3 -c 'import playwright'"
missing = "skip"
timeout_seconds = 1800

[[checks]]
id = "apple-simulators"
title = "Shared iOS and tvOS XCTest suite"
command = "make apple-test"
profiles = ["ci", "full", "nightly"]
platforms = ["darwin"]
requires = ["xcodebuild", "xcodegen"]
missing = "skip"
timeout_seconds = 3600

[[checks]]
id = "android-jvm"
title = "Android JVM unit tests and lint"
command = """
mkdir -p target/validation/buildx && \
BUILDX_CONFIG=target/validation/buildx make android-test
"""
profiles = ["ci", "full", "nightly"]
platforms = ["darwin", "linux"]
requires = ["docker"]
missing = "skip"
skip_if_env = ["PLURX_SKIP_ANDROID_JVM"]
timeout_seconds = 3600

[[checks]]
id = "android-device"
title = "Android and Google TV instrumented UI tests"
command = "make android-instrumentation"
profiles = ["full"]
platforms = ["darwin", "linux"]
requires = ["adb", "docker"]
preflight = "test -n \"$PLURX_ANDROID_SERIAL\""
missing = "skip"
timeout_seconds = 3600

[[checks]]
id = "container-runtime"
title = "Release container startup, health, and restart smoke"
command = "mkdir -p target/validation/buildx && BUILDX_CONFIG=target/validation/buildx make container-smoke"
profiles = ["full", "nightly"]
platforms = ["darwin", "linux"]
requires = ["curl", "docker"]
missing = "skip"
timeout_seconds = 3600

# In the CI profile this exact test already runs inside rust-gate-ci — the
# `-p plurxd` invocation resolves the same features as the excluded-member
# workspace run, so a second process would re-execute an identical binary.
[[checks]]
id = "api-wire"
title = "Live native API matches the shared Rust/Swift/Kotlin fixture"
command = "cargo test -p plurxd http::tests::shared_native_api_fixture_uses_the_servers_live_wire_keys -- --exact"
profiles = ["commit", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 300

[[checks]]
id = "database-upgrades"
