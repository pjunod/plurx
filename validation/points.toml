[[points]]
id = "core.media"
title = "Media facts, persistence, and domain rules"
contract = "The core model classifies media and persists its durable state without corrupting existing libraries."
paths = [
  "Cargo.lock",
  "Cargo.toml",
  "crates/plurx-core/Cargo.toml",
  "crates/plurx-core/src/{cluster,config,domain,error,lib,testfixtures}.rs",
  "crates/plurx-core/src/store/mod.rs",
  "crates/plurx-core/src/store/replicated.rs",
  "crates/plurx-core/src/store/sqlite/cache.rs",
  "crates/plurx-core/src/store/sqlite/reading.rs",
  "crates/plurx-core/src/store/sqlite/telemetry.rs",
  "crates/plurx-core/src/store/telemetry.rs",
  "crates/plurx-core/tests/store_contract.rs",
  "spikes/hiqlite-m0/{Cargo.toml,Cargo.lock,src/lib.rs,tests/hiqlite_m0.rs}",
  "rust-toolchain.toml",
]
checks = ["rust-gate"]

[[points]]
id = "persistence.upgrades"
title = "Persistent database compatibility"
contract = "Existing libraries upgrade without losing data; a newer unsupported database is refused without changing staging state; clustering publishes a durable content-addressed SQLite backup, imports v14 through current durable rows into a fresh one-voter Hiqlite target, rebuilds derived FTS, and returns only after exact per-table parity. A fsynced completion marker and atomic rename make the verified target active; a failed or interrupted pre-rename attempt is cleaned before one unchanged-SQLite recovery boot, while post-rename recovery selects only the completed target. An ambiguous active target refuses the boot instead of reverting to SQLite, an activated directory that lost its target refuses to re-import the retained source, and retained source backups are bounded. Synchronous source reads stay on one blocking worker, while target parity uses bounded primary-key pages and an incremental digest."
paths = [
  "crates/plurx-core/src/cluster/migration.rs",
  "crates/plurx-core/src/store/hiqlite_import.rs",
  "crates/plurx-core/src/store/sqlite/mod.rs",
  "crates/plurxd/tests/cluster_activation.rs",
]
checks = ["rust-gate", "database-upgrades", "cluster-auth"]
depends_on = ["core.media"]

[[points]]
id = "cluster.auth"
title = "Replicated durable state"
contract = "The shared Store suite passes on SQLite and three voters; populated v14 and current SQLite backups reach exact imported-table parity; replicated path metadata retains its named owner while bytes and playback telemetry stay node-local; local FTS rebuilds from replicated items; identity/state guards survive follower and leader loss; quorum loss fails readiness; incompatible candidates are refused; the production progress coalescer's deterministic five-second/ten-second load stays within 64 physical commits per stream and 512 compacted bytes per incoming beat after production-threshold compaction, while an uncoalesced control violates both budgets."
paths = [
  "crates/plurx-cluster-check/**",
  "crates/plurx-core/src/store/hiqlite.rs",
  "crates/plurx-core/src/store/hiqlite_catalog.rs",
  "crates/plurx-core/src/store/hiqlite_durable.rs",
  "crates/plurx-core/src/store/hiqlite_import.rs",
  "crates/plurx-core/src/store/hiqlite_media.rs",
  "crates/plurx-core/src/store/hiqlite_reading.rs",
  "crates/plurx-core/tests/store_contract.rs",
  "scripts/vendor-audit-lock",
  "vendor/hiqlite/**",
  "vendor/hiqlite-wal/**",
  "vendor/rust_decimal/**",
  "vendor/s3-simple/**",
]
checks = ["rust-gate", "cluster-auth"]
depends_on = ["core.media", "identity.access"]

[[points]]
id = "cluster.membership"
title = "Cluster membership lifecycle and node health"
contract = "An admin issues an encrypted single-use join token whose cleartext is absent from status, logs, configuration, and redemption/finalization requests; those requests carry only its SHA-256 digest, and stable refusal codes distinguish expired, reused, reserved, and invalid or tampered tokens. A fresh daemon refuses an existing SQLite install, resumes its own staged join, ignores a foreign token on a healthy voter, and joins as a voter without changing instance.id, growing one voter to three. Never-joined voters keep cluster listeners on loopback; an opted-in sole voter crash-safely commits its advertised address from a metadata-reset snapshot, while remote listeners use TLS and refuse later host or port drift. Follower removal preserves quorum or refuses a leader and a quorum-losing change; two voters remain degraded reconfiguration rather than healthy HA. Removing a node resolves the offline work it owns before the membership change commits: a queued or preparing package is requeued only on a survivor that answered a source probe by actually reading the snapshotted bytes, and anything else — including every ready package, whose bytes lived only on the departing node — fails with the stable node_removed code and releases its reservation. Silent reassignment stays forbidden, the old producer is fenced out of work a survivor has taken over, and removal still refuses an in-flight transfer with an operator-visible reason. Replicated node records expose only node identity, role, reachability, and last-seen, remain readable during quorum loss, preserve removed-node tombstones, and consume the canonical replication projection for lag. SQLite reports membership unavailable."
paths = [
  "crates/plurx-core/src/cluster/membership.rs",
  "crates/plurxd/src/http/cluster.rs",
]
checks = ["rust-gate", "cluster-auth", "security-boundaries"]
depends_on = ["cluster.auth", "identity.access"]

[[points]]
id = "server.api"
title = "Native server API and runtime"
contract = "The single server binary exposes stable native endpoints and coordinates background work safely."
paths = [
  "crates/plurxd/Cargo.toml",
  "crates/plurxd/src/{cachekeep,logbuf,main,schedule,state,storeprobe,telemetry}.rs",
  "crates/plurxd/src/reader_formats.rs",
  "crates/plurxd/src/http/{dto,error,extract,mod,network,publication,reading,system}.rs",
  "plurx.example.toml",
]
checks = ["rust-gate", "api-wire", "user-journey", "resource-bounds"]
depends_on = ["core.media", "persistence.upgrades"]

[[points]]
id = "api.contract"
