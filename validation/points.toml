profiles = ["commit", "ci", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 600

[[checks]]
id = "credential-encryption"
title = "Trakt bearer credential sealed at rest, migrated on upgrade, refused without its key"
command = "cargo test -p plurx-core secrets:: -- --nocapture && cargo test -p plurx-core cluster::tests -- --nocapture && cargo test -p plurx-core store::sqlite::trakt -- --nocapture"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
