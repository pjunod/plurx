version = 1

[settings]
profiles = ["commit", "ci", "full", "nightly"]
artifact_dir = "target/validation"
always_checks = ["catalog-contract", "history-regressions", "rust-gate"]
audit_paths = [
  ".dockerignore",
  ".github/workflows/**",
  "Cargo.lock",
  "Cargo.toml",
  "Dockerfile",
  "Makefile",
  "clients/**",
  "crates/**",
  "deploy/**",
  "plurx.example.toml",
  "rust-toolchain.toml",
  "scripts/**",
  "tests/**",
  "validation/**",
  "vendor/**",
]
audit_exclude = []

[[checks]]
id = "catalog-contract"
title = "Validation runner contract"
command = "python3 -m unittest discover -s tests/validation -p 'test_*.py'"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["python3"]
missing = "fail"
timeout_seconds = 60

[[checks]]
id = "history-regressions"
title = "Historical corrective commits have current validation evidence"
command = "scripts/history-audit --report target/validation/history.json"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["git", "python3"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "operations-contract"
title = "Deploy, CI, container, and client shipping contracts"
command = "python3 -m unittest discover -s tests/operations -p 'test_*.py'"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["bash", "make", "python3", "sh"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "mobile-version"
title = "Changed mobile apps advance their store build numbers"
command = "python3 -m validation.mobile_versions"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["git", "python3"]
missing = "fail"
timeout_seconds = 60

[[checks]]
id = "rust-gate"
title = "Rust format, lint, and workspace tests"
command = "make rust-check"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["cargo", "make"]
missing = "fail"
timeout_seconds = 1800

[[checks]]
id = "web-static"
title = "Embedded JavaScript and theme contrast"
command = "make web-check"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["node", "python3"]
missing = "fail"
timeout_seconds = 120

[[checks]]
id = "web-layout"
title = "Every web layout against the structural golden"
command = "make ui-check"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["python3", "ffmpeg"]
requires_files = ["tests/ui-structure.golden"]
preflight = "python3 -c 'import playwright'"
missing = "skip"
skip_if_env = ["PLURX_SKIP_UI_BASELINE"]
timeout_seconds = 1800

[[checks]]
id = "playback-smoke"
title = "Risk-weighted browser playback matrix"
command = "make playback-smoke"
profiles = ["full", "nightly"]
platforms = ["darwin", "linux"]
requires = ["cargo", "ffmpeg", "node"]
missing = "skip"
timeout_seconds = 3600

[[checks]]
id = "apple-simulators"
title = "Shared iOS and tvOS XCTest suite"
command = "make apple-test"
profiles = ["ci", "full", "nightly"]
platforms = ["darwin"]
requires = ["xcodebuild", "xcodegen"]
missing = "skip"
timeout_seconds = 3600

[[checks]]
id = "android-jvm"
title = "Android JVM unit tests and lint"
command = """
mkdir -p target/validation/buildx && \
BUILDX_CONFIG=target/validation/buildx make android-test
"""
profiles = ["ci", "full", "nightly"]
platforms = ["darwin", "linux"]
requires = ["docker"]
missing = "skip"
skip_if_env = ["PLURX_SKIP_ANDROID_JVM"]
timeout_seconds = 3600

[[checks]]
id = "android-device"
title = "Android and Google TV instrumented UI tests"
command = "make android-instrumentation"
profiles = ["full"]
platforms = ["darwin", "linux"]
requires = ["adb", "docker"]
preflight = "test -n \"$PLURX_ANDROID_SERIAL\""
missing = "skip"
timeout_seconds = 3600

[[checks]]
id = "container-runtime"
title = "Release container startup, health, and restart smoke"
command = "mkdir -p target/validation/buildx && BUILDX_CONFIG=target/validation/buildx make container-smoke"
profiles = ["full", "nightly"]
platforms = ["darwin", "linux"]
requires = ["curl", "docker"]
missing = "skip"
timeout_seconds = 3600

[[checks]]
id = "api-wire"
title = "Live native API matches the shared Rust/Swift/Kotlin fixture"
command = "cargo test -p plurxd http::tests::shared_native_api_fixture_uses_the_servers_live_wire_keys -- --exact"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 300

[[checks]]
id = "database-upgrades"
title = "SQLite upgrade and downgrade-safety contract"
command = "cargo test -p plurx-core store::sqlite::tests:: -- --nocapture"
profiles = ["ci", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 300

[[checks]]
id = "cluster-auth"
title = "Three-voter replicated durable-state failure contract"
command = "make cluster-check"
profiles = ["ci", "full", "nightly"]
platforms = ["darwin", "linux"]
requires = ["cargo", "make"]
missing = "fail"
timeout_seconds = 600

[[checks]]
id = "offline-contract"
title = "Offline package persistence, ownership, lease, and media boundary"
command = "cargo test -p plurx-core store::sqlite::offline -- --nocapture && cargo test -p plurx-core v14_offline -- --nocapture && cargo test -p plurxd offline -- --nocapture"
profiles = ["commit", "ci", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 600

[[checks]]
id = "security-boundaries"
title = "Authentication, administration, and scoped-key boundaries"
command = "cargo test -p plurxd http::tests::auth_is_required_and_admin_enforced -- --exact && cargo test -p plurxd http::tests::only_an_admin_manages_keys -- --exact && cargo test -p plurxd http::tests::the_scan_route_takes_a_key_and_only_a_key -- --exact"
profiles = ["ci", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 600

[[checks]]
id = "user-journey"
title = "Seeded browse, playback-decision, progress, and settings journeys"
command = "cargo test -p plurxd seeded_ -- --nocapture"
profiles = ["ci", "full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 600

[[checks]]
id = "playback-recovery"
title = "Interrupted playback production resumes without losing media"
command = "cargo test -p plurxd transcode::tests::a_preempted_producer_resumes_without_losing_picture -- --exact --nocapture"
profiles = ["nightly"]
platforms = ["darwin", "linux"]
requires = ["cargo", "ffmpeg"]
missing = "fail"
timeout_seconds = 1800

[[checks]]
id = "resource-bounds"
title = "Session registries, hardware slots, and memory work stay bounded"
command = "cargo test -p plurxd cannot_grow_the_registry_without_bound -- --nocapture && cargo test -p plurxd transcode::tests::concurrent_starts_cannot_exceed_the_hardware_slot_cap -- --exact --nocapture"
profiles = ["nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 600

[[checks]]
id = "playback-exhaustive"
title = "Every browser playback fixture, quality, and restart case"
command = "make playback-full"
profiles = ["nightly"]
platforms = ["darwin", "linux"]
requires = ["cargo", "ffmpeg", "node"]
missing = "fail"
timeout_seconds = 7200

[[points]]
id = "core.media"
title = "Media facts, persistence, and domain rules"
contract = "The core model classifies media and persists its durable state without corrupting existing libraries."
paths = [
  "Cargo.lock",
  "Cargo.toml",
  "crates/plurx-core/Cargo.toml",
  "crates/plurx-core/src/{cluster,config,domain,error,lib,testfixtures}.rs",
  "crates/plurx-core/src/store/mod.rs",
  "crates/plurx-core/src/store/replicated.rs",
  "crates/plurx-core/src/store/sqlite/cache.rs",
  "crates/plurx-core/tests/store_contract.rs",
  "spikes/hiqlite-m0/{Cargo.toml,Cargo.lock,src/lib.rs,tests/hiqlite_m0.rs}",
  "rust-toolchain.toml",
]
checks = ["rust-gate"]

[[points]]
id = "persistence.upgrades"
title = "Persistent database compatibility"
contract = "Existing libraries upgrade without losing data, and a newer unsupported database is refused instead of corrupted."
paths = ["crates/plurx-core/src/store/sqlite/mod.rs"]
checks = ["rust-gate", "database-upgrades"]
depends_on = ["core.media"]

[[points]]
id = "cluster.auth"
title = "Replicated durable state"
contract = "Three voters converge on settings, authentication, catalogue, watch, and root-safety state; local FTS rebuilds from replicated items, quorum loss fails readiness, and incompatible voters cannot participate."
paths = [
  "crates/plurx-cluster-check/**",
  "crates/plurx-core/src/store/hiqlite.rs",
  "crates/plurx-core/src/store/hiqlite_catalog.rs",
  "crates/plurx-core/src/store/hiqlite_media.rs",
  "vendor/rust_decimal/**",
  "vendor/s3-simple/**",
]
checks = ["rust-gate", "cluster-auth"]
depends_on = ["core.media", "identity.access"]

[[points]]
id = "server.api"
title = "Native server API and runtime"
contract = "The single server binary exposes stable native endpoints and coordinates background work safely."
paths = [
  "crates/plurxd/Cargo.toml",
  "crates/plurxd/src/{cachekeep,logbuf,main,schedule,state,storeprobe}.rs",
  "crates/plurxd/src/http/{dto,error,extract,mod,system}.rs",
  "plurx.example.toml",
]
checks = ["rust-gate", "api-wire", "user-journey"]
depends_on = ["core.media", "persistence.upgrades"]

[[points]]
id = "api.contract"
title = "Shared native API wire contract"
contract = "The server, Apple clients, and Android clients decode the same representative JSON without field-name or type drift."
paths = [
  "tests/contracts/native-api.json",
  "crates/plurxd/src/http/{dto,mod}.rs",
  "clients/apple/Sources/{PlurxAPI,Models}.swift",
  "clients/android/app/src/main/java/tv/plurx/app/data/**",
  "clients/android/app/src/test/java/tv/plurx/app/data/ModelContractTest.kt",
]
checks = ["api-wire", "apple-simulators", "android-jvm"]
depends_on = ["server.api"]

[[points]]
id = "library.catalog"
title = "Library discovery and catalog maintenance"
contract = "Scans find supported media, update existing items idempotently, and preserve user-owned files."
paths = [
  "crates/plurx-core/src/scan/**",
  "crates/plurx-core/src/store/sqlite/library.rs",
  "crates/plurx-core/src/store/sqlite/media.rs",
  "crates/plurxd/src/http/{browse,comingsoon,images,items,libraries,photos,scan}.rs",
  "docs/FEATURES.md",
  "docs/REQUIREMENTS.md",
]
checks = ["rust-gate"]
depends_on = ["core.media", "server.api"]

[[points]]
id = "metadata.enrichment"
title = "Metadata matching and enrichment"
contract = "Local and remote metadata improve catalog records deterministically, retry safely, and never overwrite stronger user-owned facts."
paths = [
  "crates/plurx-core/src/metadata/**",
  "crates/plurxd/src/http/items.rs",
  "docs/METADATA*.md",
]
checks = ["rust-gate"]
depends_on = ["core.media", "server.api", "library.catalog"]

[[points]]
id = "identity.access"
title = "Accounts, tokens, and authorization boundaries"
contract = "Only authenticated users can cross protected API and media boundaries, with admin operations kept separate."
paths = [
  "crates/plurx-core/src/auth.rs",
  "crates/plurx-core/src/store/sqlite/{apikeys,users}.rs",
  "crates/plurx-core/src/store/hiqlite.rs",
  "crates/plurxd/src/http/{auth,keys,users}.rs",
  "docs/SECURITY.md",
]
checks = ["rust-gate", "security-boundaries"]
depends_on = ["core.media", "server.api"]

[[points]]
id = "playback.pipeline"
title = "Playback decision, delivery, and presentation"
contract = "Every supported source reaches a client through the intended direct, remux, copy, or transcode path and keeps presenting media."
paths = [
  "crates/plurx-core/src/fmp4.rs",
  "crates/plurx-core/src/mediafacts.rs",
  "crates/plurx-core/src/playback/**",
  "crates/plurx-core/src/tracks.rs",
  "crates/plurx-core/src/transcode/**",
  "crates/plurx-pgs/**",
  "fuzz/**",
  "crates/plurxd/src/{admission,copyseg,delivery,ffmpeg,meter,pgs_overlay,pipeprobe,playstart,produce,progressive,subtitles,transcode}.rs",
  "crates/plurxd/src/http/{hls,pgs_overlay,stream}.rs",
  "crates/plurxd/src/web/playback-policy.js",
  "docs/PLAYBACK*.md",
  "docs/STUTTER-4K.md",
  "scripts/dv-evidence",
  "scripts/playback-lab",
  "tests/playback/**",
]
checks = ["rust-gate", "web-static", "playback-smoke", "playback-recovery", "resource-bounds", "playback-exhaustive"]
depends_on = ["core.media", "server.api", "library.catalog"]

[[points]]
id = "watch-state.sync"
title = "Watch state and external history sync"
contract = "Progress, watched state, and Trakt synchronization converge without losing newer user activity."
paths = [
  "crates/plurx-core/src/store/sqlite/{outbox,trakt,watch}.rs",
  "crates/plurx-core/src/trakt.rs",
  "crates/plurxd/src/{trakt,watched}.rs",
  "crates/plurxd/src/http/{trakt,watch}.rs",
]
checks = ["rust-gate", "user-journey"]
depends_on = ["core.media", "server.api", "library.catalog"]

[[points]]
id = "offline.viewing"
title = "App-managed offline viewing"
contract = "Authenticated users can prepare one portable VOD package, transfer it through a stable scoped lease, and play only app-owned local bytes while disconnected."
paths = [
  "crates/plurx-core/src/store/sqlite/offline.rs",
  "crates/plurxd/src/offline.rs",
  "crates/plurxd/src/http/offline.rs",
  "docs/OFFLINE-VIEWING-PLAN.md",
]
checks = [
  "offline-contract",
  "rust-gate",
  "database-upgrades",
  "security-boundaries",
  "api-wire",
  "apple-simulators",
  "android-jvm",
  "android-device",
  "playback-recovery",
  "resource-bounds",
]
depends_on = [
  "core.media",
  "persistence.upgrades",
  "server.api",
  "identity.access",
  "playback.pipeline",
]

[[points]]
id = "plex.compatibility"
title = "Plex-compatible discovery and API surface"
contract = "Direct-connection Plex clients receive compatible discovery, metadata, playback, and timeline responses."
paths = [
  "crates/plurx-compat-plex/**",
  "crates/plurxd/src/http/plex.rs",
]
checks = ["rust-gate"]
depends_on = ["server.api", "api.contract", "playback.pipeline"]

[[points]]
id = "web.experience"
title = "Embedded web player and administration UI"
contract = "The shipped one-file web app remains syntactically valid, readable in every theme, and structurally stable across layouts."
paths = [
  "brand/tokens.css",
  "crates/plurxd/src/http/web.rs",
  "crates/plurxd/src/web/**",
  "docs/UI-*.md",
  "scripts/contrast-*",
  "scripts/js-check",
  "scripts/themes-proposed.json",
  "scripts/ui-baseline",
  "tests/ui-structure.golden",
]
checks = ["rust-gate", "web-static", "web-layout", "playback-smoke", "playback-exhaustive"]
depends_on = ["server.api", "api.contract", "identity.access", "metadata.enrichment", "playback.pipeline"]

[[points]]
id = "mobile.versioning"
title = "Mobile release versioning"
contract = "Shipped Apple and Android changes advance their store build counters, and both marketing versions track the workspace release."
paths = [
  "Cargo.toml",
  "clients/apple/Sources/**",
  "clients/apple/Resources/**",
  "clients/apple/project.yml",
  "clients/android/app/src/main/**",
  "clients/android/app/build.gradle.kts",
  "clients/android/app/proguard-rules.pro",
  "clients/android/build.gradle.kts",
  "clients/android/gradle.properties",
  "clients/android/gradle/libs.versions.toml",
  "clients/android/settings.gradle.kts",
]
checks = ["mobile-version"]

[[points]]
id = "apple.client"
title = "Native iOS and tvOS clients"
contract = "The Apple clients preserve the shared API, navigation, preferences, and playback policies on both platforms."
paths = ["clients/apple/**"]
checks = ["apple-simulators"]
depends_on = ["server.api", "api.contract", "identity.access", "metadata.enrichment", "playback.pipeline", "offline.viewing"]

[[points]]
id = "android.client"
title = "Native Android and Google TV clients"
contract = "The Android clients preserve API models, TV focus, preferences, and Media3 playback policy."
paths = ["clients/android/**"]
checks = ["android-jvm", "android-device"]
depends_on = ["server.api", "api.contract", "identity.access", "metadata.enrichment", "playback.pipeline", "offline.viewing"]

[[points]]
id = "operations.packaging"
title = "Build, deploy, and release artifacts"
contract = "Every supported installation path builds the same stamped server and keeps its runtime configuration explicit."
paths = [
  ".dockerignore",
  ".github/workflows/**",
  "Dockerfile",
  "deploy/**",
  "crates/plurxd/build.rs",
  "crates/plurxd/src/version.rs",
  "scripts/{bench,dv-evidence,gop-census,mkpgs,perf-report,ship}",
  "scripts/container-smoke",
  "tests/operations/**",
]
checks = ["rust-gate", "operations-contract", "container-runtime", "resource-bounds"]
depends_on = ["server.api"]

[[points]]
id = "validation.framework"
title = "Functionality-point catalog and automation"
contract = "Every governed source file maps to a named point, every point maps to a runnable check, and every run leaves machine-readable evidence."
paths = [
  ".github/workflows/**",
  "Makefile",
  "docs/VALIDATION.md",
  "scripts/pre-commit",
  "scripts/history-audit",
  "scripts/validate",
  "tests/validation/**",
  "validation/**",
]
checks = ["catalog-contract", "history-regressions", "operations-contract"]
