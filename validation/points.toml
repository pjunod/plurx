profiles = ["nightly"]
platforms = ["darwin", "linux"]
requires = ["cargo", "ffmpeg"]
missing = "fail"
timeout_seconds = 1800

[[checks]]
id = "resource-bounds"
title = "Session registries, hardware slots, and memory work stay bounded"
command = "cargo test -p plurxd cannot_grow_the_registry_without_bound -- --nocapture && cargo test -p plurxd transcode::tests::concurrent_starts_cannot_exceed_the_hardware_slot_cap -- --exact --nocapture && cargo test -p plurxd http::publication::tests::epub_manifest_does_not_expand_large_resource -- --exact --ignored --nocapture"
profiles = ["nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 600

[[checks]]
