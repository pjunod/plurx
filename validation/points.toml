[[checks]]
id = "user-journey"
title = "Seeded browse, playback-decision, progress, and settings journeys"
command = "cargo test -p plurxd seeded_ -- --nocapture"
profiles = ["full", "nightly"]
requires = ["cargo"]
missing = "fail"
timeout_seconds = 600

[[checks]]
id = "playback-recovery"
title = "Interrupted playback production resumes without losing media"
