id = "web.experience"
title = "Embedded web player and administration UI"
contract = "The shipped one-file web app remains syntactically valid, readable in every theme, and structurally stable across layouts. Its admin cluster panel reads the membership API without widening it, presents two voters as a reconfiguration waypoint rather than redundancy, renders every removal refusal as an actionable sentence, stays absent for a non-admin, and holds a minted join token in memory only — never in browser storage, a URL, or a log."
