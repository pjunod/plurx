[[checks]]
id = "security-boundaries"
title = "Authentication, administration, and scoped-key boundaries"
command = "cargo test -p plurxd http::tests::auth_is_required_and_admin_enforced -- --exact && cargo test -p plurxd http::tests::only_an_admin_manages_keys -- --exact && cargo test -p plurxd http::tests::the_scan_route_takes_a_key_and_only_a_key -- --exact && cargo test -p plurxd http::tests::cluster_membership_controls_are_admin_only_and_sqlite_is_explicit -- --exact"
profiles = ["full", "nightly"]
requires = ["cargo"]
missing = "fail"
