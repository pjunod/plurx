reason = "The retained plurxd HLS regressions drive `http::hls::segment` and `exact_hls_context` against a published producer-less session, so they discriminate where segment bytes are counted rather than the tracker's arithmetic: `segment_bytes_are_counted_as_the_body_drains_not_at_open` requires the session delivery meter to read zero when the handler returns and the segment's full length only after the body is consumed, so restoring `session.delivery.note(len)` at open fails the first assertion and removing the counting body stream fails the second; `an_abandoned_segment_body_is_recorded_as_response_dropped` drops a partially consumed body and requires the `Drop`-only `response_dropped` classification naming delivered and expected bytes; `an_unreadable_segment_body_is_recorded_as_storage_read_error` fails the first read with EISDIR and requires exactly one `storage_read_error` terminal event; and the two `init` probe regressions require a playlist-time codec sniff to move no delivery bytes, to emit nothing for a bounded read that returned every byte it asked for, and to tag a failed internal read `\"purpose\":\"internal_probe\"` so it cannot be read as a client segment fetch."
