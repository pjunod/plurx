reason = "The shipped-binary regression `sigterm_is_registered_before_the_listener_can_become_reachable` raises SIGTERM immediately after the daemon binds its HTTP listener but before `serve` can first poll the graceful-shutdown future; eager SIGTERM/SIGINT registration buffers that signal and the daemon drains with exit 0, while reverting only the production registration correction restores the default SIGTERM action and the child exits from signal 15. That test now waits on a bounded child rather than `Command::output()` and requires the `shutdown signal received, draining` line in the child's captured logs, so a failpoint that never fires fails on its deadline instead of hanging, and an unrelated clean exit cannot stand in for a drain. The retained `subsequent_plurxd_run_reopens_the_completed_replicated_target` separately proves ordinary activated and reopened daemons still drain cleanly."
