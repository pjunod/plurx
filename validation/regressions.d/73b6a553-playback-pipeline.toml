reason = "The retained plurxd marker regressions drive `markers_from_chapters` directly, so they discriminate where a Skip Credits window opens rather than merely that one exists. `markers_come_from_a_chapters_array` requires a 55-minute chapterless file to yield an 82,500 ms tail — 2.5% of runtime — and requires a 22-minute episode and a 3-hour film to differ (33,000 ms against the 180,000 ms ceiling), so restoring `(dur / 12).clamp(45s, 150s)` answers the flat 150,000 ms that every runtime at or above 30 minutes used to share. `a_chaptered_file_without_a_credits_title_uses_its_last_boundary` requires a chaptered file whose titles never say credits to start at its real final boundary of 3,200,000 ms, and to fall back to the proportion when that boundary is instead a story chapter minutes long, so restoring the `has_credits`-only gate answers 3,150,000 ms from a blind guess while the file's own positional evidence was on hand. `a_marker_in_the_wrong_half_of_the_runtime_is_rejected` requires that ordinary scene titles which trip the broad `credit_kw`/`intro_kw` substrings — \"Closing Time\" at 27:30, \"The Ending\", a trailing \"Recap\" — are vetoed by position and do not suppress the fallback, so restoring the unbounded classification serves three markers including `credits start_ms: 1650000 chapter: true`: the reported defect, a Skip Credits button at 27:30 of a 55-minute episode, which every client prefers over the real one because markers are sorted by start and the first containing match wins."
