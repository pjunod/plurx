reason = "The retained three-voter `large_probe_json_import_respects_the_production_wal_limit` regression imports two probe bands under the production 2 MiB WAL and verifies exact `probe_json` parity for both: the original 64 adjacent 48 KiB rows, plus 18 rows of 144 KiB whose 16 adjacent rows serialize past the 2,097,118-byte WAL payload capacity, which the test asserts as its own premise so a favourable row count cannot pass for byte safety. Import transactions are now bounded by measured serialized bytes, so the covered contract is byte safety rather than an average row size; reverting only the byte bound reproduces the writer panic node m6 hit in production. `a_probe_row_larger_than_the_wal_is_refused_instead_of_crashing_the_node` covers the remaining case a byte bound cannot split: a single 2,100 KiB probe row is refused with the table, row id, measured size, and limit, and the voter still answers afterwards instead of restarting into unreplicated SQLite recovery. The importer's boundary arithmetic — the flush exactly on and one byte past the budget, mixed sizes forcing several flushes, a row above the budget carried alone, and the estimate proven an upper bound on the `bincode::config::legacy()` encoding `hiqlite-wal` 0.14 actually appends log entries with, asserted against `standard()` as well in case that changes — is pinned by the `store::hiqlite_import` unit tests. `the_row_estimate_stays_above_what_the_wal_encoder_produces` measures integer-heavy, text-heavy, and mixed rows rather than a few large payloads, because a per-param under-count is what an estimate checked only against wide payloads hides; it fails on the superseded 11-byte per-param allowance that was verified against `standard()` alone."
