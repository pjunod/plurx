reason = "Three corrections with three retained regressions. `profile5_renderer_keeps_software_decode_and_may_encode_anywhere_probed` requires the reshape to keep `requires_software_decode` and to stay off the GPU end to end while allowing every hardware encoder to pair — reverting the pairing to software-only fails it, and deleting the software-decode requirement fails it in the other direction, which is the split that made a 4K Dolby Vision source 720p for non-DV clients. `the_advertised_ladder_never_offers_a_rung_the_pipeline_cannot_serve` still pins Auto onto the advertised ladder and now pins that an unproved hardware pairing falls back to the software rung rather than advertising a rung that would fail. `an upgrade needs encode headroom, not just a bandwidth estimate` drives `decideRung` with the production shape — a ~200 Mb/s JIT estimate at 720p — and requires the upgrade to be refused when the server's measured pace predicts under realtime one rung up, requires it to proceed on real headroom, requires an unmeasured session to stay able to rise, requires a rung that already failed to open never to be re-entered, and requires emergencies to keep falling past a blocked rung; reverting any one of those arms restores the 720<->1080 limit cycle."
