---
# The production inventory can keep its existing `control` host. Copy only the
# variables needed for the devices this controller is responsible for.
all:
  children:
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          plurx_repo: ~/code/plurx

          # `adb connect` these endpoints before discovery. USB devices need no
          # entry here.
          plurx_android_connect: []

          # Empty means every online physical adb device. Set explicit endpoint
          # serials when this Mac also has unrelated development devices.
          plurx_android_serials: []

          # Hardware serials, not network endpoints. A missing required device
          # fails the play instead of reporting a misleading partial success.
          plurx_android_required_serials:
            - HA263LBP

          # Upload is the default. This switch exists for a deliberate local
          # archive/export run, not as a way to call an upload failure green.
          plurx_apple_upload: true
