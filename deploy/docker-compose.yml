# plurx single-node deployment.
#
# Host-specific configuration (your media mounts, GPU passthrough, and shared
# Docker networks) belongs in an override file. The standard ports stay here,
# so this tracked file never needs local edits and `git pull` applies cleanly:
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   $EDITOR docker-compose.override.yml         # your mounts, your GPU
#   cp .env.example .env                        # data dir, uid, ports
#   docker compose up -d --build
#
# Compose merges docker-compose.override.yml automatically; both it and .env
# are gitignored. This developer/fleet path deliberately builds from the
# checked-out Dockerfile (`up -d --build` the first time and after pulling
# changes). Tagged releases are published separately to `ghcr.io/pjunod/plurx`
# for image-only installations such as the Unraid template.
#
# plurx never writes to your media; mount it read-only (`:ro`). The data
# directory holds the database, artwork cache, and transcode scratch — every
# user, library, watch position and API key you have.
#
# That directory is a BIND MOUNT to a path you chose, not a named volume, and
# the difference is the point. A named volume lives at a path Docker picks and
# is easy to orphan: rename the deployment directory, recreate the stack in a
# way that drops the volume, and plurxd is handed an empty directory rather
# than an error — it starts, shows the first-run setup screen, and every key
# and user is silently gone. A path you can `ls` cannot disappear without you
# noticing. Set PLURX_DATA in .env to move it.

# Pin the Compose project name. Left unset, Compose derives it from the
# directory holding this file — which is `deploy`, a name half the self-hosted
# world also uses. Two stacks that resolve to the same project are the same
# project: `docker compose ps` in one lists the other's containers, and
# `up --remove-orphans` or `down` in one DELETES the other's, because from
# there they are containers the compose file doesn't mention. `container_name`
# below hides the collision rather than causing it, by keeping this service off
# the `<project>-<service>-1` naming that would otherwise make it obvious.
name: plurx

services:
  plurxd:
    build:
      context: ..            # repo root (where the Dockerfile + workspace live)
      dockerfile: Dockerfile
      args:
        # Which commit this image is. `.git` is deliberately outside the build
        # context, so the build script cannot work it out for itself and a
        # bare `docker compose up -d --build` produces an image stamped
        # "unknown" — which makes "did my deploy land?" unanswerable from
        # inside the product, exactly when it matters most.
        #
        # **Use `make docker-up` from the repo root**, which is this command with
        # the variable already set. Relying on a human to type it was tried and
        # it does not work: nobody remembers, nothing complains, and the System
        # page reads "(unstamped build)" for weeks. An image built without it
        # still reports its compile time, which at least tells one deploy from
        # the next.
        PLURX_BUILD_REF: ${PLURX_BUILD_REF:-}
    image: plurx/plurxd:latest
    container_name: plurxd
    restart: unless-stopped
    # Keep the base service on ordinary Docker networking. Host-specific
    # overrides commonly attach plurxd to an external media network, and
    # Compose forbids combining `networks` with `network_mode: host`.
    ports:
      # Keep the container port stable for peer containers. Move only the host
      # side when another service (usually Plex) still owns TCP 32400.
      - "${PLURX_HTTP_PORT:-32400}:32400"      # HTTP API + web app
      # GDM discovery for Plex clients. Discovery only works on host port
      # 32414; if something else owns it (a still-running Plex), set
      # PLURX_GDM_PORT in .env to park it elsewhere until Plex retires.
      - "${PLURX_GDM_PORT:-32414}:32414/udp"
    # Run as you, not as the image's internal `plurx` user, so the files under
    # PLURX_DATA are readable and removable without sudo. Set PUID/PGID in
    # .env if your uid is not 1000; `id -u` and `id -g` say what to use.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PLURX_SERVER_NAME: "plurx"
      # Containers see a generated container hostname by default. Give the
      # membership roster the physical machine's short name. `make docker-up`
      # always supplies it; the HOSTNAME fallback also covers shells that
      # export the host name when Compose is run directly.
      PLURX_NODE_HOSTNAME: "${PLURX_NODE_HOSTNAME:-${HOSTNAME:-}}"
      PLURX_BIND: "0.0.0.0:32400"
      PLURX_DATA_DIR: "/var/lib/plurx"
      # Multicast cannot escape a Docker bridge. The host-network discovery
      # companion below owns Bonjour so this container does not publish a
      # duplicate service on the private `media` bridge.
      PLURX_MDNS_ADVERTISE: "false"
      # HLS master experiments for the copied-Dolby-Vision investigation
      # (docs/APPLE-NATIVE-SUBTITLES-PLAN.md §5.4). Enable ONE per deploy and
      # watch a real Apple TV: every master regression in that arc passed the
      # unit tests and failed on the device.
      # PLURX_HLS_CLOSED_CAPTIONS_NONE: "1"
      # PLURX_HLS_FORCED_AUTOSELECT: "1"
    volumes:
      # The database and everything else that must survive a rebuild. Create
      # it first, owned by the same uid the container runs as:
      #   sudo install -d -o $(id -u) -g $(id -g) /srv/plurx
      - ${PLURX_DATA:-/srv/plurx}:/var/lib/plurx
      # Media mounts go in docker-compose.override.yml (see example file).

  # Keep only multicast discovery on the host network. The actual server stays
  # on its ordinary/external Compose networks, including a host override's
  # `media` network, and remains reachable through the published HTTP port.
  # Splitting these roles avoids Compose's forbidden `network_mode` +
  # `networks` combination while making Bonjour visible to phones and TVs.
  plurx-discovery:
    image: plurx/plurxd:latest
    container_name: plurx-discovery
    restart: unless-stopped
    network_mode: host
    # The advertiser uses the machine hostname when the configured server name
    # is the generic default `plurx`, so a multi-server picker shows m6/nuc4/etc.
    uts: host
    depends_on:
      plurxd:
        condition: service_healthy
    environment:
      # The companion reads the server through the host-published port, then
      # advertises that same port to native clients over Bonjour.
      PLURX_DISCOVERY_SERVER_URL: "http://127.0.0.1:${PLURX_HTTP_PORT:-32400}"
      # The image healthcheck reads PLURX_BIND. Because this container uses the
      # host network, point its probe at the same published server port instead
      # of the image default (which may still belong to Plex).
      PLURX_BIND: "127.0.0.1:${PLURX_HTTP_PORT:-32400}"
    command: ["advertise"]
